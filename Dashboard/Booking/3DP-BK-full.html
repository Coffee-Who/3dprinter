<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D列印機預約系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
.hidden{display:none !important}
:root{
  --bg:#ffffff;
  --bg-soft:#fafbfc;
  --bg-panel:#f5f7f9;
  --line:#e6e8ec;
  --line-soft:#eef0f3;
  --ink:#0a0e14;
  --ink-2:#3b4250;
  --ink-3:#5a6270;
  --ink-4:#8a93a3;
  --accent:#0c7a99;
  --accent-soft:#e6f1f6;
  --ok:#1d6f43;
  --ok-soft:#e6f1ea;
  --warn:#c79b2a;
  --warn-soft:#fbf3dc;
  --danger:#c0392b;
  --danger-soft:#fbe7e3;
  --purple:#6b5fc9;
  --purple-soft:#ece9fb;
  --indigo:#4f46c7;
  --indigo-soft:#e8e6fb;
  --sky:#0c7a99;
  --sky-soft:#e6f1f6;
  --violet:#7c3aed;
  --violet-soft:#f1e9fd;
  --radius:10px;
  --radius-sm:6px;
  --font-ui:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
  --sidebar-w:224px;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}

.shell{height:100vh;background:var(--bg);display:flex;position:relative;overflow:hidden}

.shell-sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--bg-soft);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:transform .2s}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 16px 16px;border-bottom:1px solid var(--line)}
.shell-brand-mark{width:28px;height:28px;background:#0a0e14;border-radius:7px;position:relative;flex-shrink:0}
.shell-brand-mark::before{content:'';position:absolute;top:6px;left:6px;width:6px;height:6px;background:var(--accent);border-radius:1px}
.shell-brand-mark::after{content:'';position:absolute;bottom:6px;right:6px;width:10px;height:2px;background:var(--accent);border-radius:1px}
.shell-brand-title{font-size:14px;font-weight:700;letter-spacing:-0.01em;line-height:1.1;color:var(--ink)}
.shell-brand-sub{font-size:9.5px;color:var(--ink-4);font-family:var(--font-mono);letter-spacing:0.1em;margin-top:3px}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:10px 8px;overflow-y:auto}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;background:transparent;border-radius:6px;cursor:pointer;text-align:left;font:inherit;color:var(--ink-3);transition:background .12s,color .12s;width:100%;text-decoration:none}
.sidebar-item:hover{background:var(--bg);color:var(--ink)}
.sidebar-item.active{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.sidebar-item.active .sidebar-item-icon{color:var(--accent)}
.sidebar-item-icon{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-4);flex-shrink:0}
.sidebar-item-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.sidebar-item-label{font-size:13px;font-weight:700;letter-spacing:-0.005em;line-height:1.1;white-space:nowrap}
.sidebar-item-sub{font-size:9.5px;font-family:var(--font-mono);color:var(--ink-4);letter-spacing:0.08em;white-space:nowrap}
.sidebar-foot{padding:14px 16px;border-top:1px solid var(--line);font-family:var(--font-mono);font-size:10.5px;color:var(--ink-4);display:flex;flex-direction:column;gap:3px}
.sidebar-foot-name{color:var(--ink-2);font-weight:700}

.shell-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.shell-top{display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;min-height:48px}
.shell-tabs{display:flex;gap:2px;overflow-x:auto}
.shell-tab{position:relative;border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;color:var(--ink-3);padding:14px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:color .15s}
.shell-tab:hover{color:var(--ink)}
.shell-tab.active{color:var(--ink);font-weight:700}
.shell-tab.active::after{content:'';position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--accent);border-radius:1px}
.shell-spacer{flex:1}
.shell-aux{font-size:10.5px;color:var(--ink-4);font-family:var(--font-mono);letter-spacing:0.08em;white-space:nowrap}
.shell-body{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto;background:var(--bg);padding:20px 24px}
.menu-btn{display:none;border:1px solid var(--line);background:var(--bg);border-radius:6px;width:34px;height:34px;align-items:center;justify-content:center;font-size:18px;color:var(--ink-3);cursor:pointer;flex-shrink:0}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(10,14,20,.35);z-index:90}

.tab-panel{display:block}

.sec-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sec-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--ink)}
.sec-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--bg-panel);border-radius:8px;padding:2px;gap:2px}
.seg button{font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:6px;border:none;background:transparent;color:var(--ink-3);cursor:pointer;font-family:inherit}
.seg button.active{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(10,14,20,.06)}
.btn-ghost{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink-3);cursor:pointer;font-family:inherit}
.btn-ghost:hover{background:var(--bg-soft)}
.btn-ghost:disabled{opacity:.5;cursor:not-allowed}
.muted{font-size:11.5px;color:var(--ink-4);font-family:var(--font-mono)}

.status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:8px}
.status-card{background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px}
.status-card .row{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.status-card .name{font-size:13px;font-weight:700;color:var(--ink)}
.status-card .sub{font-size:11px;color:var(--ink-3);margin-top:4px}
.status-card .mat{font-size:10px;font-family:var(--font-mono);color:var(--ink-4);margin-top:6px}
.s-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:1px 7px;border-radius:999px;font-weight:600;white-space:nowrap}
.s-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.col-green{background:var(--ok-soft);color:var(--ok)}.dot-green{background:#1d6f43}
.col-blue{background:var(--accent-soft);color:var(--accent)}.dot-blue{background:#0c7a99}
.col-yellow{background:var(--warn-soft);color:#8b6b13}.dot-yellow{background:#c79b2a}
.col-red{background:var(--danger-soft);color:var(--danger)}.dot-red{background:#c0392b}
.col-indigo{background:var(--indigo-soft);color:var(--indigo)}.dot-indigo{background:#4f46c7}
.col-orange{background:#fde6d2;color:#a35a17}.dot-orange{background:#e08a39}
.col-gray{background:var(--line-soft);color:var(--ink-4)}.dot-gray{background:#b4b7bd}
.prog-bar{background:var(--line-soft);border-radius:99px;height:6px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent)}
.prog-fill-yellow{background:#c79b2a}
.empty-msg{grid-column:1/-1;text-align:center;color:var(--ink-4);font-size:12.5px;padding:24px 0}
.error-msg{grid-column:1/-1;text-align:center;color:var(--danger);font-size:12.5px;padding:24px 0}

.printer-group{margin-bottom:14px}
.printer-group-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px}
.printer-group-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--bg-panel);border:1px solid var(--line-soft);border-radius:8px;padding:10px 14px;cursor:pointer;font:inherit;text-align:left}
.printer-group-toggle:hover{background:var(--bg-soft)}
.printer-group-toggle .printer-group-title{margin-bottom:0}
.printer-group-meta{display:flex;align-items:center;gap:8px}
.printer-group-meta i{transition:transform .15s;color:var(--ink-4)}
.printer-group-toggle.open .printer-group-meta i{transform:rotate(180deg)}
.printer-group-body{display:none}
.printer-group-body.open{display:block;margin-top:10px}

.status-card.idle{background:var(--ok-soft);border-color:transparent;transition:box-shadow .15s,border-color .15s}
.status-card.idle:hover{box-shadow:0 0 0 1px var(--ok);border-color:var(--ok)}
.status-card-img{margin-top:8px;height:110px;border-radius:6px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center}
.status-card-img img{width:100%;height:100%;object-fit:contain}
.status-card-img.placeholder{background:var(--bg-panel);color:var(--ink-4)}
.mat-section{margin-top:8px;border-top:1px solid var(--line-soft);padding-top:8px}
.mat-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:4px}
.mat-row .mname{font-weight:700;color:var(--ink-2)}
.mat-row .mlabel{color:var(--ink-3)}

.card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:8px}
.form-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;align-items:end}
.form-grid .wide{grid-column:span 2}
.field label{font-size:11px;color:var(--ink-3);display:block;margin-bottom:4px;font-weight:600}
.field input,.field select{width:100%;height:34px;border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:12.5px;font-family:inherit;background:var(--bg);color:var(--ink)}
.field input:disabled{background:var(--bg-soft);color:var(--ink-4)}
.field input:focus,.field select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.toggle-row .lbl{font-size:11px;color:var(--ink-3);font-weight:600}
.toggle-row .opt{display:flex;gap:4px;align-items:center}
.toggle-row .hint{font-size:10px;color:var(--ink-4);margin-right:2px}
.toggle-btn{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid var(--line);cursor:pointer;background:var(--bg);color:var(--ink-3);font-family:inherit}
.toggle-btn.active-yes{background:var(--ok-soft);color:var(--ok);border-color:#bfe3cf}
.toggle-btn.active-no{background:var(--danger-soft);color:var(--danger);border-color:#f4c2bd}
.form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;margin-top:4px}
.btn-primary{height:36px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;padding:0 18px;display:flex;align-items:center;gap:6px}
.btn-primary:hover{background:#0a6a86}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}

.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.filters .lbl{font-size:11.5px;font-weight:600;color:var(--ink-3);margin-right:2px}
.filters select{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg);color:var(--ink-2);font-family:inherit}
.filters .clear{font-size:11.5px;color:var(--ink-4);text-decoration:underline;cursor:pointer;margin-left:2px;background:none;border:none;font-family:inherit}

.outer-card{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
thead tr{background:var(--bg-soft)}
th{text-align:left;font-weight:700;font-size:10.5px;font-family:var(--font-mono);color:var(--ink-3);letter-spacing:0.06em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th .sort{margin-left:4px;color:var(--ink-4);font-size:9px}
th.sorted{color:var(--accent)}
th.sorted .sort{color:var(--accent)}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);vertical-align:middle}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--bg-soft)}
tbody tr:last-child td{border-bottom:0}
tbody tr.is-done{opacity:.6}
tbody tr.is-conflict{background:#fdf3ea}
tbody tr.is-conflict:hover{background:#fbe9d9}
.date-cell{font-weight:700;color:var(--ink-2);white-space:nowrap}
.overdue{color:var(--danger)}
.overdue-tag{font-size:9.5px;background:var(--danger-soft);color:var(--danger);padding:1px 5px;border-radius:4px;margin-left:4px;font-weight:700}
.conflict-tag{font-size:9.5px;background:#fde6d2;color:#a35a17;padding:1px 5px;border-radius:4px;margin-left:4px;font-weight:700}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;font-size:11px;border-radius:999px;font-weight:600;white-space:nowrap}
.mono{font-family:var(--font-mono);color:var(--ink-2)}
.order-tag{font-size:11px;background:var(--ok-soft);color:var(--ok);border:1px solid #bfe3cf;padding:1px 7px;border-radius:5px;font-weight:600}
.note-text{font-size:11.5px;color:var(--ink-4)}
.status-select{font-size:11.5px;font-weight:700;border:1px solid transparent;border-radius:6px;padding:5px 10px;font-family:inherit;cursor:pointer}
.status-select:disabled{cursor:not-allowed}
.lastmod{font-size:11px;color:var(--ink-4);line-height:1.3}
.lastmod b{color:var(--ink-3);font-weight:600}
.actions{display:flex;gap:4px;justify-content:center}
.actbtn{width:28px;height:28px;border:1px solid var(--line);background:var(--bg);border-radius:6px;cursor:pointer;color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center}
.actbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.actbtn.danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.empty-row td{text-align:center;color:var(--ink-4);padding:40px 0}

.pagination{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg-soft);font-size:12px;color:var(--ink-3);font-family:var(--font-mono);flex-wrap:wrap;gap:10px}
.page-btn{padding:4px 10px;border-radius:6px;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);cursor:pointer;font-family:inherit}
.page-btn:hover{background:var(--bg-soft)}
.page-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}

.gantt-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:14px}
.gantt-toolbar .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gantt-toolbar .legend{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--ink-3)}
.gantt-toolbar .legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.icon-btn{width:30px;height:30px;border:1px solid var(--line);background:var(--bg);border-radius:6px;cursor:pointer;color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--bg-soft)}
.gantt-detail-toggle{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);cursor:pointer;user-select:none}
.gantt-detail-toggle input{width:auto;height:auto;margin:0;cursor:pointer}
.gantt-container{overflow-x:auto;padding:0 14px 14px}

.gantt-table-month{border-collapse:collapse;font-size:10.5px;table-layout:fixed}
.gantt-table-month th,.gantt-table-month td{border:1px solid var(--line-soft);padding:0;text-align:center}
.gantt-table-month thead th{background:var(--bg-soft);color:var(--ink-3);font-weight:700;padding:4px 0}
.gantt-table-month thead th.today{background:var(--accent-soft);color:var(--accent)}
.gantt-table-month thead th.weekend{background:var(--bg-panel)}
.gantt-table-month .gp-head{position:sticky;left:0;background:var(--bg-soft);width:60px;min-width:60px;text-align:left;padding:4px 8px}
.gantt-table-month .gp-name{position:sticky;left:0;background:var(--bg);font-weight:700;color:var(--ink-2);text-align:left;padding:4px 8px;white-space:nowrap}
.gantt-table-month td.today-col{background:#f3fafd}
.gantt-table-month td.weekend-col{background:var(--bg-panel)}
.gantt-table-month [data-day].col-hl{box-shadow:inset 0 0 0 1px var(--accent)}
.gantt-cell-split{display:flex;flex-direction:column;height:28px}
.gantt-table-month.detail .gantt-cell-split{height:78px}
.gantt-half{flex:1}
.gantt-half[onclick]{cursor:pointer}
.gantt-half.conflict{box-shadow:inset 0 0 0 1px #e08a39}
.gantt-half + .gantt-half{border-top:1px solid var(--bg)}
.gantt-half-text{display:flex;flex-direction:column;justify-content:center;gap:1px;height:100%;padding:0 4px;font-weight:600;text-align:left;overflow:hidden}
.gantt-half-text .l{display:block;font-size:9px;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.gantt-preview{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--bg-panel);font-size:11.5px;color:var(--ink-3);min-height:20px}
.gantt-preview .ttl{font-weight:700;color:var(--ink);margin-bottom:4px;font-size:12px}
.gantt-preview .item{margin-bottom:2px}
.gantt-preview .item:last-child{margin-bottom:0}

.toast{position:fixed;bottom:24px;right:24px;z-index:9999;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(10,14,20,.15);animation:slideIn .3s ease;color:#fff}
.toast.success{background:var(--ok)}
.toast.error{background:var(--danger)}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.modal-overlay{position:fixed;inset:0;background:rgba(10,14,20,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:var(--bg);border-radius:12px;box-shadow:0 16px 40px rgba(10,14,20,.2);padding:24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-grid .full{grid-column:1/-1}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.btn-cancel{flex:1;height:38px;border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;font-family:inherit}
.btn-cancel:hover{background:var(--bg-soft)}
.btn-save{flex:1;height:38px;border:none;background:var(--accent);color:#fff;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-save:hover{background:#0a6a86}

@media(max-width:960px){
  .shell-sidebar{position:fixed;left:0;top:0;height:100vh;z-index:100;transform:translateX(-100%);width:224px}
  .shell-sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex}
  .sidebar-overlay.show{display:block}
  .form-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid .wide{grid-column:span 2}
}
@media(max-width:600px){
  .shell-top{padding:0 14px;gap:10px}
  .shell-tab{padding:12px 10px;font-size:12px}
  .shell-aux{display:none}
  .shell-body{padding:14px}
  .form-grid{grid-template-columns:1fr 1fr}
  .form-grid .wide{grid-column:1/-1}
  .filters{gap:6px}
  .filters select{flex:1 1 45%}
  .modal-grid{grid-template-columns:1fr}
}
</style>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import {
    getAuth, onAuthStateChanged, signOut
} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import {
    getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
    onSnapshot, serverTimestamp, query, orderBy
} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';

// ══ Firebase 配置 ══════════════════════════════
const firebaseConfig = {
    apiKey: "AIzaSyBhgfPGUgGsWr4VmOUeaEe_cC0RNSx8I7U",
    authDomain: "swtc-portal-6930c.firebaseapp.com",
    projectId: "swtc-portal-6930c",
    storageBucket: "swtc-portal-6930c.firebasestorage.app",
    messagingSenderId: "447508396321",
    appId: "1:447508396321:web:ee8d1faaa0331590e5e660"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

function safeIcons(){
    try { if (window.lucide) lucide.createIcons(); } catch(e) { console.warn('lucide icons skipped', e); }
}

// 應用程式常數
const SALES     = ['Amber','Charlie','Chrissy','Benny','Celine','Mino','Yoga','Jungle','其他'];
const ENGINEERS = ['Barry','Bill','Jaylen','Jimmy'];
const PRINTERS  = ['Form4','Form4L','MarkTwo','UR','Other'];
const STATUSES  = ['待確認','執行中','已完成','異常/取消'];
const DONE_STATUSES = new Set(['已完成','異常/取消']);
const GANTT_PRINTERS = ['Form4','Form4L','UR'];

// 應用程式狀態
let currentUser = null;
let bookings = [];
let unsubscribeBookings = null;
let hasOrder = null, editHasOrder = null, editingId = null;
let ganttMonthStart = null;
let ganttDetailMode = false;
let sortField = 'date', sortDir = 'asc';
const PAGE_SIZE = 10;
let currentPage = 1;

// ══════════════════════════════════════════════
// ══ 1. Auth：共用主控台登入狀態 ════════════════
// ══════════════════════════════════════════════
onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUser = {
            uid: user.uid,
            email: user.email || '',
            displayName: (user.email || '使用者').split('@')[0],
            role: 'editor'
        };
        document.getElementById('main-app').classList.remove('hidden');
        document.getElementById('sidebar-user').textContent = currentUser.displayName;
        applyRoleUI();
        subscribeBookings();
        safeIcons();
    } else {
        currentUser = null;
        if (unsubscribeBookings) { unsubscribeBookings(); unsubscribeBookings = null; }
        // 尚未登入：導向主控台登入頁，登入後再回到本頁
        window.location.href = '../index.html';
    }
});

window.doSignOut = async function(){
    if(!confirm('確定要登出嗎？')) return;
    await signOut(auth);
};


function applyRoleUI() {
    const u = currentUser;
    const canEdit = u.role === 'admin' || u.role === 'editor';
    document.getElementById('panel-tab-booking').style.display = canEdit ? '' : 'none';
    document.getElementById('ops-col').classList.toggle('hidden', !canEdit);
}

// ══════════════════════════════════════════════
// ══ 2. 介面切換（側邊欄）══════════════════════
// ══════════════════════════════════════════════
window.toggleSidebar = function(open){
    document.getElementById('sidebar').classList.toggle('open', open);
    document.getElementById('overlay').classList.toggle('show', open);
};
function updateClock(){
    const d = new Date();
    document.getElementById('timeNow').textContent = d.toLocaleString('zh-TW',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    document.getElementById('dateNow').textContent = d.toLocaleDateString('zh-TW');
}
updateClock();
setInterval(updateClock, 60000);

// ══════════════════════════════════════════════
// ══ 3. Firestore 即時訂閱 bookings ════════════
// ══════════════════════════════════════════════
function subscribeBookings() {
    if (unsubscribeBookings) unsubscribeBookings();
    const q = query(collection(db, 'bookings'), orderBy('date', 'asc'));
    unsubscribeBookings = onSnapshot(q, (snap) => {
        bookings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderTable();
    }, (err) => {
        console.error('訂閱 bookings 失敗', err);
        showToast('讀取資料失敗：' + err.message, 'error');
    });
}

// ══════════════════════════════════════════════
// ══ 4. 表格與甘特圖渲染 ═══════════════════════
// ══════════════════════════════════════════════
function getOccupiedSlots(b) { return b.slot==='ALL' ? ['AM','PM'] : [b.slot||'AM']; }
function getConflictKeys() {
    const counts = {};
    bookings.forEach(b=>{
        if(!b.date || !b.printer) return;
        getOccupiedSlots(b).forEach(s=>{
            const k = `${b.printer}|${b.date}|${s}`;
            counts[k] = (counts[k]||0) + 1;
        });
    });
    const cs = new Set();
    Object.entries(counts).forEach(([k,c])=>{ if(c>1) cs.add(k); });
    return cs;
}
function bookingHasConflict(b, cs) {
    return getOccupiedSlots(b).some(s => cs.has(`${b.printer}|${b.date||''}|${s}`));
}
function populateFilterSelects() {
    const fills = [
        ['filter-engineer','所有工程師', ENGINEERS],
        ['filter-status',  '所有狀態',   STATUSES],
        ['filter-printer', '所有設備',   PRINTERS],
        ['filter-sales',   '所有業務',   SALES],
    ];
    fills.forEach(([id,placeholder,opts])=>{
        const sel = document.getElementById(id);
        if(!sel) return;
        const cur = sel.value;
        sel.innerHTML = `<option value="">${placeholder}</option>` +
            opts.map(o=>`<option value="${o}" ${cur===o?'selected':''}>${o}</option>`).join('');
    });
}
function updateSortIndicators() {
    ['date','slot','sales','printer','engineer','status'].forEach(f=>{
        const th = document.getElementById('sort-'+f)?.closest('th');
        const el = document.getElementById('sort-'+f);
        if(!el || !th) return;
        if(f === sortField){ el.textContent = sortDir==='asc' ? '↑' : '↓'; th.classList.add('sorted'); }
        else { el.textContent = ''; th.classList.remove('sorted'); }
    });
}
function getSortKey(b, field) {
    if(field==='date')     return b.date || '';
    if(field==='slot')     return ({'AM':1,'PM':2,'ALL':0}[b.slot]) ?? 9;
    if(field==='sales')    return b.sales || '';
    if(field==='printer')  return b.printer || '';
    if(field==='engineer') return b.engineer || '';
    if(field==='status'){
        const order={'執行中':0,'待確認':1,'已完成':2,'異常/取消':3};
        return order[b.status] ?? 9;
    }
    return '';
}
function fmtDateLocal(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtRelTime(ts) {
    if(!ts) return '—';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

window.sortBy = function(field) {
    if(sortField === field) sortDir = sortDir==='asc' ? 'desc' : 'asc';
    else { sortField = field; sortDir = 'asc'; }
    renderTable();
};
window.resetFilters = function() {
    ['filter-engineer','filter-status','filter-printer','filter-sales','filter-special'].forEach(id=>{
        const el = document.getElementById(id); if(el) el.value = '';
    });
    renderTable();
};

// 狀態色票
const STATUS_CLASS = {
    '待確認':  {cls:'col-yellow', sel:'background:var(--warn-soft);color:#8b6b13'},
    '執行中':  {cls:'col-blue',   sel:'background:var(--accent-soft);color:var(--accent)'},
    '已完成':  {cls:'col-green',  sel:'background:var(--ok-soft);color:var(--ok)'},
    '異常/取消':{cls:'col-red',   sel:'background:var(--danger-soft);color:var(--danger)'},
};

window.renderTable = function() {
    if (!currentUser) return;
    const tbody = document.getElementById('table-body');
    populateFilterSelects();
    updateSortIndicators();
    const canEdit = currentUser.role === 'admin' || currentUser.role === 'editor';

    if(!bookings.length){
        document.getElementById('total-count').textContent = '共 0 筆';
        tbody.innerHTML = '<tr class="empty-row"><td colspan="10">目前沒有任何預約紀錄</td></tr>';
        document.getElementById('pagination').classList.add('hidden');
        renderGantt();
        return;
    }

    const fEng     = document.getElementById('filter-engineer').value;
    const fStatus  = document.getElementById('filter-status').value;
    const fPrinter = document.getElementById('filter-printer').value;
    const fSales   = document.getElementById('filter-sales').value;
    const fSpecial = document.getElementById('filter-special').value;
    const today = fmtDateLocal(new Date());
    const conflicts = getConflictKeys();

    let filtered = bookings.filter(b => {
        if(fEng     && b.engineer !== fEng)     return false;
        if(fStatus  && b.status   !== fStatus)  return false;
        if(fPrinter && b.printer  !== fPrinter) return false;
        if(fSales   && b.sales    !== fSales)   return false;
        if(fSpecial==='overdue'  && !(b.date && b.date<today && !DONE_STATUSES.has(b.status))) return false;
        if(fSpecial==='active'   && DONE_STATUSES.has(b.status)) return false;
        if(fSpecial==='conflict' && !bookingHasConflict(b, conflicts)) return false;
        return true;
    });

    document.getElementById('total-count').textContent =
        filtered.length === bookings.length ? `共 ${bookings.length} 筆` : `已篩選 ${filtered.length} / ${bookings.length} 筆`;

    if(!filtered.length){
        tbody.innerHTML = '<tr class="empty-row"><td colspan="10">沒有符合篩選條件的資料</td></tr>';
        document.getElementById('pagination').classList.add('hidden');
        renderGantt();
        return;
    }

    const dir = sortDir==='asc' ? 1 : -1;
    const sorted = filtered.slice().sort((a,b)=>{
        const aDone = DONE_STATUSES.has(a.status) ? 1 : 0;
        const bDone = DONE_STATUSES.has(b.status) ? 1 : 0;
        if(aDone !== bDone) return aDone - bDone;
        const ka = getSortKey(a, sortField);
        const kb = getSortKey(b, sortField);
        if(ka < kb) return -1*dir;
        if(ka > kb) return  1*dir;
        return 0;
    });

    const totalPages = Math.ceil(sorted.length / PAGE_SIZE);
    if(currentPage > totalPages) currentPage = Math.max(1, totalPages);
    const pageData = sorted.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

    tbody.innerHTML = '';
    pageData.forEach(b => {
        const tr = document.createElement('tr');
        const isDone = DONE_STATUSES.has(b.status);
        const isConflict = bookingHasConflict(b, conflicts);
        tr.className = (isDone?'is-done ':'') + (isConflict?'is-conflict':'');
        const opts = STATUSES.map(s=>`<option value="${s}" ${b.status===s?'selected':''}>${s}</option>`).join('');
        const displayDate = b.date
            ? new Date(b.date+'T00:00:00').toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'})
            : '—';
        const isOverdue = b.date && b.date<today && !DONE_STATUSES.has(b.status);
        const slotLabel = b.slot==='PM' ? '下午' : b.slot==='AM' ? '上午' : b.slot==='ALL' ? '全天' : '—';
        let slotClass;
        if(isConflict) slotClass = 'col-orange';
        else if(b.slot==='PM') slotClass = 'col-orange';
        else if(b.slot==='ALL') slotClass = 'col-violet';
        else slotClass = 'col-blue';
        const slotStyle = slotClass==='col-violet' ? 'background:var(--violet-soft);color:var(--violet)' : '';

        const printerCell = isConflict
            ? `<span style="color:#a35a17;font-weight:700">${b.printer}</span><span class="conflict-tag">衝突</span>`
            : `<span class="mono">${b.printer}</span>`;

        const purposeCell = b.hasOrder
            ? `<span class="order-tag">${b.purpose||'—'}</span>`
            : `<span class="note-text">${b.purpose||'—'}</span>`;

        const lastEdit = b.updatedAt ? fmtRelTime(b.updatedAt) : (b.createdAt ? fmtRelTime(b.createdAt) : '—');
        const lastBy = b.updatedByEmail || b.createdByEmail || '';
        const lastByShort = lastBy ? lastBy.split('@')[0] : '';

        const stCls = STATUS_CLASS[b.status] || {cls:'col-gray',sel:''};

        tr.innerHTML = `
            <td class="date-cell">
                <span class="${isOverdue?'overdue':''}">${displayDate}</span>${isOverdue?'<span class="overdue-tag">逾期</span>':''}
            </td>
            <td><span class="tag ${slotClass}" ${slotStyle?`style="${slotStyle}"`:''}>${slotLabel}</span></td>
            <td><span class="tag col-violet" style="background:var(--purple-soft);color:var(--purple)">${b.sales}</span></td>
            <td>${printerCell}</td>
            <td>${purposeCell}</td>
            <td class="mono">${b.duration||'—'}</td>
            <td><span class="tag col-indigo">${b.engineer}</span></td>
            <td>
                <select ${canEdit?'':'disabled'} onchange="updateStatus('${b.id}',this.value)"
                    class="status-select ${stCls.cls}" ${canEdit?'':'style="cursor:not-allowed"'}>
                    ${opts}
                </select>
            </td>
            <td class="lastmod">
                ${lastEdit}
                ${lastByShort?`<div>by ${lastByShort}</div>`:''}
            </td>
            ${canEdit ? `
            <td class="actions">
                <button onclick="openEditModal('${b.id}')" title="編輯" class="actbtn"><i data-lucide="pencil" style="width:14px;height:14px"></i></button>
                <button onclick="deleteBooking('${b.id}')" title="刪除" class="actbtn danger"><i data-lucide="trash-2" style="width:14px;height:14px"></i></button>
            </td>` : '<td></td>'}
        `;
        tbody.appendChild(tr);
    });

    renderPagination(sorted.length);
    safeIcons();
    renderGantt();
};

function renderPagination(total) {
    const totalPages = Math.ceil(total / PAGE_SIZE);
    const pagination = document.getElementById('pagination');
    const pageInfo   = document.getElementById('page-info');
    const pageBtns   = document.getElementById('page-btns');
    if(totalPages <= 1){ pagination.classList.add('hidden'); return; }
    pagination.classList.remove('hidden');
    const start = (currentPage-1)*PAGE_SIZE + 1;
    const end   = Math.min(currentPage*PAGE_SIZE, total);
    pageInfo.textContent = `第 ${start}–${end} 筆，共 ${total} 筆`;
    pageBtns.innerHTML = '';
    const prev = document.createElement('button');
    prev.className = 'page-btn'; prev.textContent = '‹';
    if(currentPage===1) prev.disabled = true;
    prev.onclick = () => { currentPage--; renderTable(); };
    pageBtns.appendChild(prev);

    let sp = Math.max(1, currentPage-2), ep = Math.min(totalPages, sp+4);
    if(ep-sp < 4) sp = Math.max(1, ep-4);
    for(let i=sp; i<=ep; i++){
        const btn = document.createElement('button');
        btn.className = 'page-btn' + (i===currentPage ? ' active' : '');
        btn.textContent = i;
        btn.onclick = (() => { const p = i; return () => { currentPage = p; renderTable(); }; })();
        pageBtns.appendChild(btn);
    }

    const next = document.createElement('button');
    next.className = 'page-btn'; next.textContent = '›';
    if(currentPage===totalPages) next.disabled = true;
    next.onclick = () => { currentPage++; renderTable(); };
    pageBtns.appendChild(next);
}

// 甘特圖（月檢視）
function startOfMonth(d) {
    return new Date(d.getFullYear(), d.getMonth(), 1);
}
window.ganttThisMonth = function() { ganttMonthStart = startOfMonth(new Date()); renderGantt(); };
window.ganttShiftMonth = function(n) {
    if(!ganttMonthStart) ganttMonthStart = startOfMonth(new Date());
    ganttMonthStart = new Date(ganttMonthStart.getFullYear(), ganttMonthStart.getMonth()+n, 1);
    renderGantt();
};
function ganttStatusColor(status) {
    return {
        '待確認':  '#f4d35e',
        '執行中':  '#5dade2',
        '已完成':  '#82c99a',
        '異常/取消':'#e6a4a4',
    }[status] || 'var(--line-soft)';
}
function ganttStatusTextColor(status) {
    return {
        '待確認':  '#6b5410',
        '執行中':  '#ffffff',
        '已完成':  '#15452a',
        '異常/取消':'#6e1f1f',
    }[status] || 'var(--ink-3)';
}
function parseDateLocal(dateStr) {
    if(!dateStr) return null;
    const parts = dateStr.split('-').map(Number);
    if(parts.length !== 3 || parts.some(isNaN)) return null;
    return new Date(parts[0], parts[1]-1, parts[2]);
}
// 依「預約日期 + 時段 + 預約天數」展開成所有占用的半日格（每 0.5D = 一個上午或下午）
function getOccupiedHalfSlots(b) {
    const start = parseDateLocal(b.date);
    if(!start) return [];
    const startHalf = b.slot === 'PM' ? 1 : 0; // AM 與 ALL 都從上午開始
    const totalHalves = Math.max(1, Math.round((parseFloat(b.duration) || 1) * 2));
    const out = [];
    for(let i=0; i<totalHalves; i++){
        const h = startHalf + i;
        const dayOffset = Math.floor(h/2);
        const slot = (h % 2 === 0) ? 'AM' : 'PM';
        const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+dayOffset);
        out.push({ dateKey: fmtDateLocal(d), slot });
    }
    return out;
}
function buildGanttCellMap() {
    const map = {};
    GANTT_PRINTERS.forEach(p=>{ map[p] = {}; });
    bookings.forEach(b=>{
        if(!GANTT_PRINTERS.includes(b.printer)) return;
        getOccupiedHalfSlots(b).forEach(({dateKey, slot})=>{
            if(!map[b.printer][dateKey]) map[b.printer][dateKey] = {AM:[], PM:[]};
            map[b.printer][dateKey][slot].push(b);
        });
    });
    return map;
}
function ganttRenderHalf(items, canEdit) {
    if(!items.length) return '<div class="gantt-half"></div>';
    const isConflict = items.length > 1;
    const b = items[0];
    const color = ganttStatusColor(b.status);
    const titleText = items.map(x=>`${x.sales||''} · ${x.purpose||''} · ${x.engineer||''} · ${x.status}${x.slot==='ALL'?' · 全天':''}${x.duration?(' · '+x.duration):''}`).join(' ｜ ');
    const cls = 'gantt-half' + (isConflict?' conflict':'');
    const click = canEdit ? ` onclick="openEditModal('${b.id}')"` : '';
    let inner = '';
    if(ganttDetailMode){
        const textColor = ganttStatusTextColor(b.status);
        inner = `<div class="gantt-half-text" style="color:${textColor}">` +
            `<span class="l">${b.sales||'—'}</span>` +
            `<span class="l">${b.duration||'—'}</span>` +
            `<span class="l">${b.engineer||'—'}</span>` +
            `</div>`;
    }
    return `<div class="${cls}" style="background:${color}" title="${titleText}"${click}>${inner}</div>`;
}
window.toggleGanttDetail = function(checked) {
    ganttDetailMode = checked;
    renderGantt();
};
function renderGantt() {
    if(!ganttMonthStart) ganttMonthStart = startOfMonth(new Date());
    const container = document.getElementById('gantt-container');
    const year = ganttMonthStart.getFullYear();
    const month = ganttMonthStart.getMonth();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    document.getElementById('gantt-range').textContent = `${year}年${month+1}月`;
    const todayKey = fmtDateLocal(new Date());
    const canEdit = currentUser && (currentUser.role==='admin' || currentUser.role==='editor');
    const dayColWidth = ganttDetailMode ? 88 : 24;
    const cellMap = buildGanttCellMap();

    let html = `<table class="gantt-table-month${ganttDetailMode?' detail':''}"><thead><tr><th class="gp-head">機台</th>`;
    for(let day=1; day<=daysInMonth; day++){
        const d = new Date(year, month, day);
        const dayKey = fmtDateLocal(d);
        const dow = d.getDay();
        const isToday = dayKey===todayKey;
        const isWeekend = dow===0 || dow===6;
        html += `<th data-day="${dayKey}" style="width:${dayColWidth}px;min-width:${dayColWidth}px" class="${isToday?'today':''} ${isWeekend?'weekend':''}">${day}</th>`;
    }
    html += '</tr></thead><tbody>';

    GANTT_PRINTERS.forEach(printer=>{
        html += `<tr><td class="gp-name">${printer}</td>`;
        for(let day=1; day<=daysInMonth; day++){
            const d = new Date(year, month, day);
            const dayKey = fmtDateLocal(d);
            const dow = d.getDay();
            const isToday = dayKey===todayKey;
            const isWeekend = dow===0 || dow===6;
            const cell = (cellMap[printer] && cellMap[printer][dayKey]) || {AM:[], PM:[]};
            const cellCls = `${isToday?'today-col':''} ${isWeekend?'weekend-col':''}`;
            html += `<td data-day="${dayKey}" class="${cellCls}"><div class="gantt-cell-split">${ganttRenderHalf(cell.AM,canEdit)}${ganttRenderHalf(cell.PM,canEdit)}</div></td>`;
        }
        html += '</tr>';
    });
    html += '</tbody></table>';
    container.innerHTML = html;
    bindGanttHoverEvents();
    safeIcons();
}

// 滑鼠移到日期欄：高亮整列並在下方預覽當日所有預約
function bindGanttHoverEvents() {
    const table = document.getElementById('gantt-container').querySelector('table');
    if(!table) return;
    table.querySelectorAll('th[data-day]').forEach(th=>{
        th.addEventListener('mouseenter', ()=>highlightGanttDay(th.dataset.day));
    });
    table.addEventListener('mouseleave', clearGanttHighlight);
}
function highlightGanttDay(dateKey) {
    const table = document.getElementById('gantt-container').querySelector('table');
    if(!table) return;
    table.querySelectorAll('[data-day]').forEach(el=>{
        el.classList.toggle('col-hl', el.dataset.day===dateKey);
    });
    renderGanttPreview(dateKey);
}
function clearGanttHighlight() {
    const table = document.getElementById('gantt-container').querySelector('table');
    if(table) table.querySelectorAll('.col-hl').forEach(el=>el.classList.remove('col-hl'));
    document.getElementById('gantt-preview').innerHTML = '將滑鼠移到上方日期，預覽當日所有預約';
}
function renderGanttPreview(dateKey) {
    const preview = document.getElementById('gantt-preview');
    const d = parseDateLocal(dateKey);
    if(!d) return;
    const seen = new Set();
    const items = [];
    bookings.forEach(b=>{
        if(!GANTT_PRINTERS.includes(b.printer) || seen.has(b.id)) return;
        if(getOccupiedHalfSlots(b).some(o=>o.dateKey===dateKey)){
            seen.add(b.id);
            items.push(b);
        }
    });
    if(!items.length){
        preview.innerHTML = `<div class="ttl">${d.getMonth()+1}/${d.getDate()}</div>當日無預約`;
        return;
    }
    preview.innerHTML = `<div class="ttl">${d.getMonth()+1}/${d.getDate()} 預約明細</div>` +
        items.map(b=>`<div class="item">${b.printer} · ${b.slot==='ALL'?'全天':(b.slot==='AM'?'上午起':'下午起')} · 業務 ${b.sales||'—'} · 天數 ${b.duration||'—'} · 工程師 ${b.engineer||'—'} · ${b.status}</div>`).join('');
}

            purpose,
            engineer: document.getElementById('engineer-select').value,

const MACHINE_TYPE_MAP_FE = {
    'form-4':'Form 4','form-4l':'Form 4L','form-3':'Form 3','form-3l':'Form 3L',
    'fuse-1':'Fuse 1','fuse-1-plus':'Fuse 1+',
};
function getMachineLabelFE(id) {
    if (!id) return '';
    const k=id.toLowerCase().replace(/[\s\-]/g,'');
    for(const[mk,mv] of Object.entries(MACHINE_TYPE_MAP_FE)) if(mk.replace(/-/g,'')===k) return mv;
    if(k.includes('frml40')||k.includes('form4l')) return 'Form 4L';
    if(k.includes('frml30')||k.includes('form3l')) return 'Form 3L';
    if(k.includes('form40')||k.includes('form4'))  return 'Form 4';
    if(k.includes('form3')) return 'Form 3';
    return id;
}

let cachedPrinters = [];

window.toggleTaipeiGroup = function(){
    const body = document.getElementById('taipei-body');
    const btn = document.getElementById('taipei-toggle');
    const open = body.classList.toggle('open');
    btn.classList.toggle('open', open);
};

window.manualRefreshPrinters = async function() {
    const btn = document.getElementById('printer-refresh-btn');
    const icon = document.getElementById('printer-refresh-icon');
    btn.disabled = true;
    icon.style.animation = 'spin 0.7s linear infinite';
    document.getElementById('printer-updated').textContent = '刷新中...';
    await loadPrinterStatus();
    btn.disabled = false;
    icon.style.animation = '';
};

async function loadPrinterStatus() {
    try {
        const res = await fetch(STATUS_URL + '?t=' + Date.now());
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const printers = await res.json();
        cachedPrinters = Array.isArray(printers) ? printers : [];
        const updatedAt = cachedPrinters[0]?.updated_at;
        if(updatedAt){
            const d = new Date(updatedAt);
            document.getElementById('printer-updated').textContent =
                `資料時間：${d.toLocaleDateString('zh-TW')} ${d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}`;
        }
        if(!cachedPrinters.length){
            document.getElementById('panel-status-tc').innerHTML = '<div class="empty-msg">尚無列印機資料</div>';
            document.getElementById('panel-status-tp').innerHTML = '';
            document.getElementById('taipei-count').textContent = '';
            return;
        }
        renderStatusPanel(cachedPrinters);
    } catch(err){
        document.getElementById('panel-status-tc').innerHTML = `<div class="error-msg">無法載入：${err.message}</div>`;
        document.getElementById('panel-status-tp').innerHTML = '';
    }
}

function buildMaterialSectionHTML(p) {
    const cartridges = p.cartridges || [];
    const barCls = pct => pct < 20 ? 'var(--danger)' : pct < 40 ? '#c79b2a' : 'var(--accent)';
    if(cartridges.length){
        return `<div class="mat-section">${cartridges.map(c=>{
            const slotLabel = c.slot==='FRONT'?'前匣':c.slot==='BACK'?'後匣':c.slot==='SINGLE'?'單匣':c.slot||'樹脂罐';
            const pct = c.remaining_pct;
            return `
                <div class="mat-row"><span class="mlabel">${slotLabel}</span><span class="mname">${matNameFE(c.material)||'—'}</span></div>
                ${pct!=null
                    ? `<div class="prog-bar" style="height:5px;margin-bottom:8px"><div class="prog-fill" style="width:${Math.min(pct,100)}%;background:${barCls(pct)}"></div></div>`
                    : `<p style="font-size:10px;color:#8b6b13;margin-bottom:8px">容量待補登</p>`}
            `;
        }).join('')}</div>`;
    }
    if(p.material){
        return `<div class="mat-section"><div class="mat-row"><span class="mlabel">材料</span><span class="mname">${matNameFE(p.material)}</span></div></div>`;
    }
    return '';
}

function buildPrinterCardHTML(p) {
    const s = PRINTER_STATUS_MAP[p.status] || PRINTER_STATUS_MAP['UNKNOWN'];
    const isPrinting = ['PRINTING','PAUSED','PAUSING'].includes(p.status);
    const isIdle = p.status === 'IDLE';
    const ml = getMachineLabelFE(p.machine_type);
    const img = getMachineImageFE(p);

    const progressHTML = (isPrinting && p.print_name) ? `
        <div style="margin-top:8px">
            <div class="sub" style="margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.print_name}">${p.print_name}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
                <span class="sub">進度</span>
                <span style="font-size:11px;font-weight:700;color:var(--accent)">${p.progress}%</span>
            </div>
            <div class="prog-bar"><div class="prog-fill${p.status==='PAUSED'?' prog-fill-yellow':''}" style="width:${Math.min(p.progress,100)}%"></div></div>
            <div style="display:flex;justify-content:space-between;margin-top:4px" class="mat">
                <span>第 ${p.layer_now} / ${p.layer_total} 層</span>
                <span>${p.time_left!=='-'?'剩餘 '+p.time_left:'計算中...'}</span>
            </div>
        </div>` : '';

    const imgHTML = img
        ? `<img src="${img}" alt="${printerDisplayFE(p.alias)||p.serial}" loading="lazy" style="width:100px;height:100px;object-fit:contain;flex-shrink:0;border-radius:6px;background:var(--bg)">`
        : `<div class="status-card-img placeholder" style="width:100px;height:100px;flex-shrink:0;margin-top:0"><i data-lucide="printer" style="width:32px;height:32px"></i></div>`;

    return `
        <div class="status-card${isIdle?' idle':''}">
            <div class="row">
                <div>
                    <div class="name">${printerDisplayFE(p.alias)||p.serial}</div>
                    <div class="sub">${ml?ml+' · ':''}${p.alias||p.serial}</div>
                </div>
            </div>
            <div style="display:flex;align-items:flex-start;gap:10px;margin-top:8px">
                ${imgHTML}
                <div style="flex:1;min-width:0">
                    <span class="s-pill ${s.cls}"><span class="s-dot ${s.dot}"></span>${s.label}</span>
                    ${progressHTML}
                </div>
            </div>
            ${buildMaterialSectionHTML(p)}
        </div>
    `;
}

function renderStatusPanel(printers) {
    const tcList = printers.filter(isTaichungFE);
    const tpList = printers.filter(p=>!isTaichungFE(p));
    const tcGrid = document.getElementById('panel-status-tc');
    const tpGrid = document.getElementById('panel-status-tp');
    tcGrid.innerHTML = tcList.length ? tcList.map(buildPrinterCardHTML).join('') : '<div class="empty-msg">尚無機台資料</div>';
    tpGrid.innerHTML  = tpList.length ? tpList.map(buildPrinterCardHTML).join('')  : '<div class="empty-msg">尚無機台資料</div>';
    document.getElementById('taipei-count').textContent = `${tpList.length} 台機器`;
    safeIcons();
}

loadPrinterStatus();
setInterval(loadPrinterStatus, 5*60*1000);

window.showToast = function(msg,type){
    const container = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = `toast ${type==='error'?'error':'success'}`;
    t.textContent = msg;
    container.appendChild(t);
    setTimeout(()=>t.remove(), 3500);
};

function populateSelect(id, options){
    const sel = document.getElementById(id);
    options.forEach(o=>{ const opt=document.createElement('option'); opt.value=opt.textContent=o; sel.appendChild(opt); });
}

 ['edit-sales',SALES],['edit-printer',PRINTERS],['edit-engineer',ENGINEERS]]
