<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 列印 · 工作管理平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#fff;height:100vh;overflow:hidden}

/* ── CSS Variables (同原版) ── */
:root{
  --bg:#ffffff;--bg-soft:#fafbfc;--line:#e6e8ec;--line-soft:#eef0f3;
  --ink:#0a0e14;--ink-2:#3b4250;--ink-3:#5a6270;--ink-4:#8a93a3;
  --accent:#0c7a99;--accent-soft:#e6f1f6;
  --sidebar-w:224px;
}

/* ── Login ── */
.login-page{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(135deg,#0a0e14 0%,#131c2e 50%,#0c2340 100%);
  display:flex;align-items:center;justify-content:center;
}
.login-card{
  background:#fff;border-radius:16px;padding:40px 48px;
  width:420px;max-width:95vw;
  box-shadow:0 24px 48px rgba(0,0,0,.3);
}
.login-brand{text-align:center;margin-bottom:28px}
.login-brand-mark{
  width:48px;height:48px;background:#0a0e14;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:12px;position:relative;
}
.login-brand-mark::before{content:'';position:absolute;top:11px;left:11px;width:10px;height:10px;background:#0c7a99;border-radius:2px}
.login-brand-mark::after{content:'';position:absolute;bottom:11px;right:11px;width:16px;height:3px;background:#0c7a99;border-radius:1px}
.login-brand h1{font-size:18px;font-weight:700;color:#0a0e14;letter-spacing:-.02em}
.login-brand p{font-size:11px;color:#8a93a3;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;margin-top:4px}
.login-demo{background:#f5f8ff;border:1px solid #d4e2f8;border-radius:8px;padding:11px 14px;margin-bottom:20px;font-size:12px}
.login-demo b{color:#0c7a99;display:block;margin-bottom:6px;font-size:11.5px}
.login-demo-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;color:#3b4250}
.login-demo-grid code{font-family:monospace;font-size:11px;color:#0c7a99}
.login-err{background:#fff5f5;border:1px solid #ffc9c9;color:#c0392b;border-radius:6px;padding:9px 12px;font-size:12.5px;margin-bottom:14px;display:none}
.login-err.show{display:block}
.login-fg{margin-bottom:16px}
.login-fg label{display:block;font-size:12px;font-weight:600;color:#5a6270;margin-bottom:5px}
.login-fg input{width:100%;padding:9px 13px;border:1.5px solid #e6e8ec;border-radius:7px;font-size:13.5px;font-family:inherit;outline:none;transition:border-color .15s}
.login-fg input:focus{border-color:#0c7a99;box-shadow:0 0 0 3px #e6f1f6}
.login-submit{width:100%;padding:11px;border:0;border-radius:7px;background:#0a0e14;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
.login-submit:hover{background:#1a2334}
.login-submit:disabled{opacity:.5;cursor:not-allowed}

/* ── App Shell ── */
.app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
.shell-sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:var(--bg-soft);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;
  padding:18px 16px 16px;border-bottom:1px solid var(--line);
}
.shell-brand-mark{
  width:28px;height:28px;background:#0a0e14;border-radius:7px;
  position:relative;flex-shrink:0;
}
.shell-brand-mark::before{content:'';position:absolute;background:#0c7a99;top:6px;left:6px;width:6px;height:6px;border-radius:1px}
.shell-brand-mark::after{content:'';position:absolute;background:#0c7a99;bottom:6px;right:6px;width:10px;height:2px;border-radius:1px}
.shell-brand-title{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.1;color:var(--ink)}
.shell-brand-sub{font-size:9.5px;color:var(--ink-4);font-family:'JetBrains Mono',monospace;letter-spacing:.1em;margin-top:3px}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:10px 8px;overflow-y:auto}
.sidebar-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border:0;background:transparent;border-radius:6px;cursor:pointer;
  text-align:left;font:inherit;color:var(--ink-3);
  transition:background .12s,color .12s;width:100%;
}
.sidebar-item:hover{background:var(--bg);color:var(--ink)}
.sidebar-item[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.sidebar-item[aria-selected="true"] .sb-icon{color:var(--accent)}
.sb-icon{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-4);flex-shrink:0}
.sb-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.sb-label{font-size:13px;font-weight:600;letter-spacing:-.005em;line-height:1.1}
.sb-sub{font-size:9.5px;font-family:'JetBrains Mono',monospace;color:var(--ink-4);letter-spacing:.08em}

/* Admin sidebar 區塊 */
.sb-divider{height:1px;background:var(--line);margin:8px 12px}
.sb-admin-lbl{font-size:9.5px;color:var(--ink-4);font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px 2px}

.sidebar-foot{
  padding:14px 16px;border-top:1px solid var(--line);
  font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-4);
  display:flex;flex-direction:column;gap:3px;
}
.sb-foot-date{color:var(--ink-2);font-feature-settings:'tnum'}
.sb-foot-user{display:flex;justify-content:space-between;align-items:center}
.logout-btn{background:none;border:none;font-size:10.5px;color:var(--ink-4);cursor:pointer;padding:2px 4px;font-family:inherit}
.logout-btn:hover{color:#c0392b}

/* ── Main area ── */
.shell-main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.shell-top{
  display:flex;align-items:center;gap:18px;padding:0 28px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:20;min-height:48px;flex-shrink:0;
}
.shell-tabs{display:flex;gap:2px}
.shell-tab{
  position:relative;border:0;background:transparent;
  font:inherit;font-size:13px;font-weight:500;color:var(--ink-3);
  padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;
  transition:color .15s;
}
.shell-tab:hover{color:var(--ink)}
.shell-tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.shell-tab[aria-selected="true"]::after{content:'';position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--accent);border-radius:1px}
.shell-tab-icon{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.shell-spacer{flex:1}
.shell-aux{font-size:10.5px;color:var(--ink-4);font-family:'JetBrains Mono',monospace;letter-spacing:.08em}

/* ── iframe ── */
.iframe-wrap{flex:1;overflow:hidden;position:relative}
.iframe-wrap iframe{width:100%;height:100%;border:none;display:block}

/* ── Admin Modal ── */
.adm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:8000}
.adm-modal{background:#fff;border-radius:12px;width:820px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 16px 40px rgba(0,0,0,.2)}
.adm-mh{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.adm-mh h3{font-size:15px;font-weight:700}
.adm-close{background:none;border:none;font-size:22px;cursor:pointer;color:#8a93a3;padding:2px 6px;border-radius:4px}
.adm-close:hover{background:#eef0f3}
.adm-mb{padding:0 24px}
.adm-mf{padding:16px 24px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #e6e8ec;margin-top:16px}
.adm-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.adm-field{margin-bottom:14px}
.adm-field label{display:block;font-size:11.5px;font-weight:600;color:#5a6270;margin-bottom:5px}
.adm-field input,.adm-field select,.adm-field textarea{width:100%;padding:8px 11px;border:1.5px solid #e6e8ec;border-radius:6px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.adm-field input:focus,.adm-field select:focus{border-color:#0c7a99;box-shadow:0 0 0 3px #e6f1f6}
.adm-hint{font-size:11px;color:#8a93a3;margin-top:3px}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.perm-chip{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1.5px solid #e6e8ec;border-radius:6px;cursor:pointer;transition:all .12s;font-size:12px;user-select:none}
.perm-chip:hover,.perm-chip.on{border-color:#0c7a99;background:#e6f1f6}
.perm-chip input{accent-color:#0c7a99;width:14px;height:14px;cursor:pointer;flex-shrink:0}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.preset-chip{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid #e6e8ec;background:#fff;color:#5a6270;transition:all .12s;font-family:inherit}
.preset-chip.p-admin{border-color:#e6b800;color:#7a5000;background:#fffadc}
.preset-chip.p-mgr{border-color:#0c7a99;color:#0c7a99;background:#e6f1f6}
.preset-chip.p-eng{border-color:#1d6f43;color:#1d6f43;background:#e6f1ea}
.preset-chip.p-view{border-color:#8a93a3;color:#5a6270;background:#f5f6f8}
.users-tbl{width:100%;border-collapse:collapse}
.users-tbl th{padding:9px 14px;text-align:left;font-size:11px;font-weight:700;color:#8a93a3;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid #e6e8ec;background:#fafbfc;white-space:nowrap}
.users-tbl td{padding:11px 14px;border-bottom:1px solid #eef0f3;font-size:13px;vertical-align:middle}
.users-tbl tr:hover td{background:#fafbfc}
.u-avatar{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#0a0e14;color:#fff;flex-shrink:0}
.role-chip{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700}
.role-chip.admin{background:#fffadc;color:#7a5000}
.role-chip.manager{background:#e6f1f6;color:#0c7a99}
.role-chip.operator{background:#e6f1ea;color:#1d6f43}
.role-chip.viewer{background:#f5f6f8;color:#5a6270}
.st-dot{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.st-dot.on{color:#1d6f43}.st-dot.off{color:#8a93a3}
.seg{display:flex;gap:2px}
.seg-btn{border:1px solid #e6e8ec;background:#fff;color:#5a6270;font-size:12px;font-weight:500;padding:5px 12px;border-radius:5px;cursor:pointer;font-family:inherit;transition:all .12s}
.seg-btn:hover{border-color:#c8cdd5;color:#3b4250}
.seg-btn.active{background:#0a0e14;color:#fff;border-color:#0a0e14}
/* adm stats */
.adm-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.adm-stat{background:#fafbfc;border:1px solid #e6e8ec;border-radius:8px;padding:18px 20px}
.adm-stat-icon{font-size:22px;margin-bottom:8px}
.adm-stat-val{font-size:28px;font-weight:800;color:#0a0e14}
.adm-stat-lbl{font-size:12px;color:#8a93a3;margin-top:2px}
/* toast */
.toast-box{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast-item{padding:11px 16px;border-radius:8px;font-size:13px;font-weight:500;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:tIn .2s ease;display:flex;align-items:center;gap:8px}
.toast-item.ok{background:#1d6f43}.toast-item.err{background:#c0392b}.toast-item.inf{background:#0c7a99}
@keyframes tIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* perm denied */
.perm-denied{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:#8a93a3}
.perm-denied .icon{font-size:48px}

/* responsive */
@media(max-width:960px){
  :root{--sidebar-w:60px}
  .sidebar-brand>div:not(.shell-brand-mark){display:none}
  .sb-text{display:none}
  .sidebar-item{justify-content:center;padding:10px 8px}
  .sidebar-foot{display:none}
}
</style>
</head>
<body>

<!-- ============================================================
     LOGIN PAGE
     ============================================================ -->
<div id="login-page" class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-mark"></div>
      <h1>3D Print Workspace</h1>
      <p>WORK BOARD · ISSUES · RESOURCES</p>
    </div>

    <!-- Firebase 設定提示 (config 尚未設定時顯示) -->
    <div id="config-warn" style="background:#fff8e6;border:1px solid #f0c040;border-radius:8px;padding:10px 13px;margin-bottom:16px;font-size:12px;color:#7a5000;display:none">
      ⚠️ 請先在 <code style="background:#fff3c0;padding:1px 5px;border-radius:3px">firebase-config.js</code> 填入 Firebase 設定
    </div>

    <div id="login-err" class="login-err"></div>
    <div class="login-fg">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="your@email.com" autocomplete="username"/>
    </div>
    <div class="login-fg">
      <label>密碼</label>
      <input type="password" id="login-pw" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="login-submit" id="login-btn">🔐 登入</button>
  </div>
</div>

<!-- ============================================================
     APP SHELL
     ============================================================ -->
<div id="app" class="app" style="display:none">

  <!-- Sidebar -->
  <aside class="shell-sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="shell-brand-mark"></div>
      <div>
        <div class="shell-brand-title">3D Print</div>
        <div class="shell-brand-sub">WORKSPACE</div>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- 工作看板 -->
      <button class="sidebar-item" aria-selected="true" data-app="board" id="nav-board">
        <span class="sb-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="2" y="3" width="3.5" height="12" rx="1" stroke="currentColor" strokeWidth="1.4"/>
            <rect x="7.25" y="3" width="3.5" height="7.5" rx="1" stroke="currentColor" strokeWidth="1.4"/>
            <rect x="12.5" y="3" width="3.5" height="10" rx="1" stroke="currentColor" strokeWidth="1.4"/>
          </svg>
        </span>
        <span class="sb-text">
          <span class="sb-label">工作看板</span>
          <span class="sb-sub">WORK BOARD</span>
        </span>
      </button>

      <!-- 異常與資源 -->
      <button class="sidebar-item" aria-selected="false" data-app="issues" id="nav-issues">
        <span class="sb-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M9 2L16 14.5H2L9 2Z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/>
            <line x1="9" y1="7" x2="9" y2="10.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
            <circle cx="9" cy="12.5" r="0.8" fill="currentColor"/>
          </svg>
        </span>
        <span class="sb-text">
          <span class="sb-label">異常與資源</span>
          <span class="sb-sub">ISSUES · RESOURCES</span>
        </span>
      </button>

      <!-- Admin 區塊 (只有 admin 才顯示) -->
      <div id="admin-section" style="display:none">
        <div class="sb-divider"></div>
        <div class="sb-admin-lbl">ADMIN</div>
        <button class="sidebar-item" data-app="admin" id="nav-admin">
          <span class="sb-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <circle cx="9" cy="7" r="3" stroke="currentColor" strokeWidth="1.4"/>
              <path d="M3 15c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
            </svg>
          </span>
          <span class="sb-text">
            <span class="sb-label">管理員後台</span>
            <span class="sb-sub">ADMIN PANEL</span>
          </span>
        </button>
      </div>
    </nav>

    <div class="sidebar-foot">
      <div class="sb-foot-date" id="sb-date">—</div>
      <div class="sb-foot-user">
        <span id="sb-username" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px">—</span>
        <button class="logout-btn" id="logout-btn">登出</button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="shell-main" id="shell-main">

    <!-- Board tabs bar (由 JS 控制顯示/隱藏) -->
    <div class="shell-top" id="board-topbar">
      <nav class="shell-tabs" id="board-tabs" role="tablist">
        <!-- 由 JS 動態產生 -->
      </nav>
      <div class="shell-spacer"></div>
      <div class="shell-aux" id="topbar-aux">WORK BOARD</div>
    </div>

    <!-- iframe 容器 -->
    <div class="iframe-wrap" id="iframe-wrap">
      <iframe id="app-frame" src="" allowfullscreen></iframe>
    </div>

    <!-- 權限不足提示 -->
    <div class="perm-denied" id="perm-denied" style="display:none">
      <div class="icon">🔒</div>
      <p>您沒有查看此頁面的權限</p>
    </div>

  </div>
</div>

<!-- Admin Modal (由 JS 動態插入) -->
<div id="admin-modal-root"></div>

<!-- Toast -->
<div class="toast-box" id="toasts"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- Firebase Config (使用者需填寫) -->
<script src="firebase-config.js"></script>

<!-- React (for admin modal) -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script>
// ============================================================
//  全域 Firebase 初始化
// ============================================================
(function(){
  try {
    if (typeof FIREBASE_CONFIG === 'undefined' || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY') {
      document.getElementById('config-warn').style.display = 'block';
      console.warn('[3DP] firebase-config.js 尚未設定！');
      window._fbConfigOk = false;
    } else {
      firebase.initializeApp(FIREBASE_CONFIG);
      window._auth = firebase.auth();
      window._db   = firebase.firestore();
      window._fbConfigOk = true;
      window._fbConfig   = FIREBASE_CONFIG; // 供 iframe 子頁使用
    }
  } catch(e) {
    console.error('[3DP] Firebase init error:', e);
    window._fbConfigOk = false;
  }
})();

// ============================================================
//  Toast
// ============================================================
function toast(msg, type) {
  type = type || 'ok';
  var c = document.getElementById('toasts');
  var el = document.createElement('div');
  el.className = 'toast-item ' + type;
  el.textContent = (type==='ok'?'✓ ':type==='err'?'✕ ':'ℹ ') + msg;
  c.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3200);
}

// ============================================================
//  Tab 設定
// ============================================================
var BOARD_TABS = [
  { key:'table',     label:'總表',       icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1.5" y="2" width="11" height="10" rx="1.2" stroke="currentColor" strokeWidth="1.3"/><line x1="1.5" y1="5.5" x2="12.5" y2="5.5" stroke="currentColor" strokeWidth="1.3"/><line x1="5" y1="2" x2="5" y2="12" stroke="currentColor" strokeWidth="1.3"/></svg>' },
  { key:'kanban',    label:'看板',       icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1.5" y="2" width="3" height="10" rx="0.8" stroke="currentColor" strokeWidth="1.3"/><rect x="5.5" y="2" width="3" height="6.5" rx="0.8" stroke="currentColor" strokeWidth="1.3"/><rect x="9.5" y="2" width="3" height="8.5" rx="0.8" stroke="currentColor" strokeWidth="1.3"/></svg>' },
  { key:'gantt',     label:'時間軸',     icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><line x1="1.5" y1="3" x2="9.5" y2="3" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><line x1="4" y1="7" x2="12.5" y2="7" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><line x1="2" y1="11" x2="8" y2="11" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>' },
  { key:'dashboard', label:'Dashboard', icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 11.5V8.5M5 11.5V5M8 11.5V7M11 11.5V3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/><line x1="1" y1="12.5" x2="13" y2="12.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>' },
];
var currentBoardTab = 'table';
var currentApp = 'board';
var currentUser = null;

// ============================================================
//  Build Board Tab Bar
// ============================================================
function buildBoardTabs() {
  var nav = document.getElementById('board-tabs');
  nav.innerHTML = '';
  BOARD_TABS.forEach(function(t) {
    var btn = document.createElement('button');
    btn.className = 'shell-tab';
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', t.key === currentBoardTab);
    btn.innerHTML = '<span class="shell-tab-icon">' + t.icon + '</span>' + t.label;
    btn.onclick = function() {
      currentBoardTab = t.key;
      buildBoardTabs();
      // 通知 iframe
      var frame = document.getElementById('app-frame');
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage({ type:'SET_TAB', tab: t.key }, '*');
      }
    };
    nav.appendChild(btn);
  });
}

// ============================================================
//  Navigate
// ============================================================
var PERMS = {
  board:  ['view_board'],
  issues: ['view_issues'],
  admin:  ['admin'],
};

function hasPerm(user, perm) {
  if (!user || !user.permissions) return false;
  if (user.permissions.indexOf('admin') >= 0) return true;
  return user.permissions.indexOf(perm) >= 0;
}

function navigate(appName, tabKey) {
  currentApp = appName;

  // 更新 sidebar active
  document.querySelectorAll('.sidebar-item[data-app]').forEach(function(btn) {
    btn.setAttribute('aria-selected', btn.dataset.app === appName);
  });

  // 更新 hash
  var hash = appName === 'board' ? ('board/' + (tabKey || currentBoardTab)) : appName;
  history.replaceState(null, '', '#' + hash);

  var frame     = document.getElementById('app-frame');
  var wrap      = document.getElementById('iframe-wrap');
  var topbar    = document.getElementById('board-topbar');
  var permDenied = document.getElementById('perm-denied');
  var aux       = document.getElementById('topbar-aux');

  permDenied.style.display = 'none';

  // 檢查權限
  var requiredPerms = PERMS[appName] || [];
  var hasAccess = requiredPerms.length === 0 || requiredPerms.some(function(p){ return hasPerm(currentUser, p); });
  if (!hasAccess && appName !== 'admin') {
    wrap.style.display = 'none';
    topbar.style.display = 'none';
    permDenied.style.display = 'flex';
    return;
  }
  if (appName === 'admin' && !hasPerm(currentUser, 'admin')) {
    wrap.style.display = 'none';
    topbar.style.display = 'none';
    permDenied.style.display = 'flex';
    return;
  }

  wrap.style.display = 'block';

  if (appName === 'board') {
    if (tabKey) currentBoardTab = tabKey;
    topbar.style.display = 'flex';
    aux.textContent = 'WORK BOARD';
    buildBoardTabs();
    if (frame.dataset.loaded !== 'board') {
      frame.src = 'workboard.html';
      frame.dataset.loaded = 'board';
      frame.onload = function() { injectUser(frame); };
    } else {
      injectUser(frame);
      frame.contentWindow.postMessage({ type:'SET_TAB', tab: currentBoardTab }, '*');
    }
  } else if (appName === 'issues') {
    topbar.style.display = 'none';
    if (frame.dataset.loaded !== 'issues') {
      frame.src = 'issues.html';
      frame.dataset.loaded = 'issues';
      frame.onload = function() { injectUser(frame); };
    } else {
      injectUser(frame);
    }
  } else if (appName === 'admin') {
    topbar.style.display = 'none';
    wrap.style.display = 'none';
    openAdminModal();
    return;
  }
}

function injectUser(frame) {
  try {
    // 1. 傳 Firebase config 讓 iframe 初始化
    frame.contentWindow.postMessage({ type:'FB_CONFIG', config: window._fbConfig }, '*');
    // 2. 傳 user 物件
    frame.contentWindow.postMessage({ type:'SET_USER', user: currentUser }, '*');
  } catch(e) {}
}

// 監聽來自 iframe 的訊息
window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'READY') {
    var frame = document.getElementById('app-frame');
    injectUser(frame);
    if (e.data.app === 'board') {
      frame.contentWindow.postMessage({ type:'SET_TAB', tab: currentBoardTab }, '*');
    }
  }
  if (e.data.type === 'TOAST') toast(e.data.msg, e.data.kind);
  if (e.data.type === 'NAVIGATE') navigate(e.data.app, e.data.tab);
});

// ============================================================
//  Auth
// ============================================================
document.getElementById('login-btn').onclick = doLogin;
document.getElementById('login-email').onkeydown = function(e){ if(e.key==='Enter') document.getElementById('login-pw').focus(); };
document.getElementById('login-pw').onkeydown   = function(e){ if(e.key==='Enter') doLogin(); };

function showLoginErr(msg) {
  var el = document.getElementById('login-err');
  el.textContent = msg; el.classList.add('show');
}

async function doLogin() {
  var email = document.getElementById('login-email').value.trim();
  var pw    = document.getElementById('login-pw').value;
  if (!email || !pw) { showLoginErr('請填寫 Email 與密碼'); return; }
  if (!window._fbConfigOk) { showLoginErr('Firebase 尚未設定，請先填寫 firebase-config.js'); return; }

  var btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = '登入中...';
  document.getElementById('login-err').classList.remove('show');

  try {
    var cred = await window._auth.signInWithEmailAndPassword(email, pw);
    var uid  = cred.user.uid;
    var doc  = await window._db.collection('users').doc(uid).get();
    if (doc.exists) {
      currentUser = Object.assign({ uid: uid }, doc.data());
    } else {
      // 第一次登入尚未建立 users 文件 → 給予最低預設權限
      currentUser = { uid: uid, email: cred.user.email, displayName: cred.user.email, permissions: ['view_board','view_issues'], active: true };
    }
    if (currentUser.active === false) {
      await window._auth.signOut();
      showLoginErr('此帳號已被停用，請聯絡管理員');
      btn.disabled = false; btn.textContent = '🔐 登入';
      return;
    }
    enterApp();
  } catch(e) {
    var msg = (e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential')
      ? 'Email 或密碼錯誤' : (e.message || '登入失敗');
    showLoginErr(msg);
    btn.disabled = false; btn.textContent = '🔐 登入';
  }
}

function enterApp() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  // Sidebar 使用者資訊
  document.getElementById('sb-username').textContent = currentUser.displayName || currentUser.email || '';
  // 日期
  var d = new Date(); var K_TODAY = new Date('2026-05-14');
  document.getElementById('sb-date').textContent = K_TODAY.getFullYear()+'-'+String(K_TODAY.getMonth()+1).padStart(2,'0')+'-'+String(K_TODAY.getDate()).padStart(2,'0');
  // Admin 入口
  if (hasPerm(currentUser,'admin')) {
    document.getElementById('admin-section').style.display = 'block';
  }
  // Hash 還原
  var hash = (window.location.hash||'').replace('#','');
  if (hash) {
    var parts = hash.split('/');
    var app = parts[0], tab = parts[1];
    navigate(app && ['board','issues'].includes(app) ? app : 'board', tab);
  } else {
    navigate('board');
  }
}

document.getElementById('logout-btn').onclick = async function() {
  if (window._fbConfigOk) await window._auth.signOut();
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('login-pw').value = '';
  document.getElementById('app-frame').src = '';
  document.getElementById('app-frame').dataset.loaded = '';
  history.replaceState(null,'','#');
};

// Sidebar click
document.querySelectorAll('.sidebar-item[data-app]').forEach(function(btn) {
  btn.onclick = function() {
    if (btn.dataset.app === 'admin') { openAdminModal(); return; }
    navigate(btn.dataset.app);
  };
});

// 自動 auth 狀態檢查
if (window._fbConfigOk) {
  window._auth.onAuthStateChanged(async function(fbUser) {
    if (!fbUser) return; // 顯示登入頁（預設已顯示）
    var doc = await window._db.collection('users').doc(fbUser.uid).get();
    currentUser = doc.exists ? Object.assign({uid:fbUser.uid}, doc.data()) : {uid:fbUser.uid, email:fbUser.email, displayName:fbUser.email, permissions:['view_board','view_issues'], active:true};
    if (currentUser.active !== false) enterApp();
  });
}
</script>

<!-- Admin Modal (React) -->
<script type="text/babel" data-presets="react">
const { useState: useStateA, useEffect: useEffectA } = React;

const PERMISSIONS = {
  view_board:'查看工作看板', edit_board:'編輯工作看板', delete_board:'刪除工作看板',
  view_issues:'查看異常資源', edit_issues:'編輯異常資源', delete_issues:'刪除異常資源',
  view_report:'查看報表', admin:'管理員（所有權限）',
};
const ROLE_PRESETS = {
  admin:    ['admin'],
  manager:  ['view_board','edit_board','view_issues','edit_issues','view_report'],
  operator: ['view_board','edit_board','view_issues','edit_issues'],
  viewer:   ['view_board','view_issues','view_report'],
};

function UserModal({ item, isCreate, onClose, onSave }) {
  const empty = { displayName:'', email:'', permissions:[...ROLE_PRESETS.operator], active:true, password:'' };
  const [form, setForm] = useStateA(item ? {...item, password:''} : empty);
  const [busy, setBusy] = useStateA(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const toggle = p => { const ps=form.permissions||[]; set('permissions', ps.includes(p)?ps.filter(x=>x!==p):[...ps,p]); };
  const preset = role => set('permissions', [...ROLE_PRESETS[role]]);

  const save = async () => {
    if (!form.displayName||!form.email) { toast('請填姓名與Email','err'); return; }
    if (isCreate && (!form.password||form.password.length<6)) { toast('密碼至少6字元','err'); return; }
    setBusy(true);
    try { await onSave(form); onClose(); }
    catch(e) { toast(e.message||'儲存失敗','err'); }
    finally { setBusy(false); }
  };

  const INP = {width:'100%',padding:'8px 11px',border:'1.5px solid #e6e8ec',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none'};
  const LBL = {display:'block',fontSize:11.5,fontWeight:600,color:'#5a6270',marginBottom:5};

  return (
    <div className="adm-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="adm-modal" onClick={e=>e.stopPropagation()} style={{maxWidth:680}}>
        <div className="adm-mh">
          <h3>{isCreate?'➕ 新增使用者':'✏️ 編輯使用者'}</h3>
          <button className="adm-close" onClick={onClose}>×</button>
        </div>
        <div className="adm-mb">
          <div className="adm-row">
            <div className="adm-field"><label style={LBL}>姓名 *</label><input style={INP} value={form.displayName} onChange={e=>set('displayName',e.target.value)}/></div>
            <div className="adm-field"><label style={LBL}>Email *</label><input style={INP} type="email" value={form.email} onChange={e=>set('email',e.target.value)} disabled={!isCreate}/></div>
          </div>
          {isCreate && <div className="adm-row">
            <div className="adm-field"><label style={LBL}>初始密碼 *</label><input style={INP} type="password" value={form.password} onChange={e=>set('password',e.target.value)} placeholder="至少 6 字元"/><div className="adm-hint">使用者首次登入後可自行修改</div></div>
            <div className="adm-field"><label style={LBL}>帳號狀態</label><select style={INP} value={form.active?'on':'off'} onChange={e=>set('active',e.target.value==='on')}><option value="on">啟用</option><option value="off">停用</option></select></div>
          </div>}
          {!isCreate && <div className="adm-field"><label style={LBL}>帳號狀態</label><select style={INP} value={form.active?'on':'off'} onChange={e=>set('active',e.target.value==='on')}><option value="on">啟用</option><option value="off">停用</option></select></div>}
          <div className="adm-field">
            <label style={LBL}>快速套用角色預設</label>
            <div className="preset-row">
              <button className="preset-chip p-admin" onClick={()=>preset('admin')}>👑 管理員</button>
              <button className="preset-chip p-mgr"   onClick={()=>preset('manager')}>🔷 主管</button>
              <button className="preset-chip p-eng"   onClick={()=>preset('operator')}>🔩 工程師</button>
              <button className="preset-chip p-view"  onClick={()=>preset('viewer')}>👁 檢視者</button>
            </div>
          </div>
          <div className="adm-field">
            <label style={LBL}>個別權限設定</label>
            <div className="perm-grid">
              {Object.entries(PERMISSIONS).map(([k,label])=>{
                const on=(form.permissions||[]).includes(k);
                return (<div key={k} className={'perm-chip'+(on?' on':'')} onClick={()=>toggle(k)}>
                  <input type="checkbox" checked={on} onChange={()=>{}}/>
                  <label>{label}</label>
                </div>);
              })}
            </div>
          </div>
        </div>
        <div className="adm-mf">
          <button onClick={onClose} style={{height:34,padding:'0 16px',border:'1px solid #e6e8ec',background:'#fff',color:'#3b4250',fontSize:13,fontWeight:500,borderRadius:6,cursor:'pointer',fontFamily:'inherit'}}>取消</button>
          <button onClick={save} disabled={busy} style={{height:34,padding:'0 16px',border:'none',background:'#0a0e14',color:'#fff',fontSize:13,fontWeight:600,borderRadius:6,cursor:'pointer',fontFamily:'inherit',opacity:busy?.6:1}}>{busy?'儲存中...':'💾 儲存'}</button>
        </div>
      </div>
    </div>
  );
}

function AdminModal({ onClose }) {
  const [tab, setTab] = useStateA('overview');
  const [users, setUsers] = useStateA([]);
  const [modal, setModal] = useStateA(false);
  const [editU, setEditU] = useStateA(null);
  const [isCreate, setIsCreate] = useStateA(false);
  const [stats, setStats] = useStateA({ orders:0, anomalies:0, equipment:0, ipa:0 });

  useEffectA(() => {
    if (!window._db) return;
    window._db.collection('users').get().then(snap => {
      setUsers(snap.docs.map(d=>Object.assign({_id:d.id},d.data())));
    });
    Promise.all([
      window._db.collection('orders').get(),
      window._db.collection('anomalies').get(),
      window._db.collection('equipment').get(),
      window._db.collection('ipa_purchases').get(),
    ]).then(([o,a,e,i]) => setStats({orders:o.size, anomalies:a.size, equipment:e.size, ipa:i.size}));
  }, []);

  const reload = () => {
    window._db.collection('users').get().then(snap=>{setUsers(snap.docs.map(d=>Object.assign({_id:d.id},d.data())));});
  };

  const handleSave = async form => {
    if (isCreate) {
      // 建立 Firebase Auth 帳號 (使用次要 app 避免影響目前登入)
      const app2 = firebase.initializeApp(window._fbConfig, 'create_' + Date.now());
      try {
        const cred = await app2.auth().createUserWithEmailAndPassword(form.email, form.password);
        await app2.auth().signOut();
        const uid = cred.user.uid;
        await window._db.collection('users').doc(uid).set({
          displayName: form.displayName,
          email:       form.email,
          permissions: form.permissions || [],
          active:      form.active !== false,
          createdAt:   firebase.firestore.FieldValue.serverTimestamp(),
        });
        toast('使用者「' + form.displayName + '」已建立 ✓');
      } catch(e) {
        if (e.code === 'auth/email-already-in-use') throw new Error('此 Email 已被使用');
        throw e;
      } finally {
        app2.delete();
      }
    } else {
      await window._db.collection('users').doc(editU._id).update({
        displayName: form.displayName,
        permissions: form.permissions || [],
        active:      form.active !== false,
        updatedAt:   firebase.firestore.FieldValue.serverTimestamp(),
      });
      toast('「' + form.displayName + '」已更新 ✓');
    }
    reload();
  };

  const toggleActive = async u => {
    await window._db.collection('users').doc(u._id).update({ active: !u.active });
    toast(u.active ? '已停用「'+u.displayName+'」' : '已啟用「'+u.displayName+'」', u.active?'inf':'ok');
    reload();
  };

  const delUser = async u => {
    if (u._id === window.currentUser.uid) { toast('不可刪除自己','err'); return; }
    if (!confirm('確定要刪除「' + u.displayName + '」？')) return;
    await window._db.collection('users').doc(u._id).delete();
    toast('已刪除','inf');
    reload();
  };

  const roleOf = u => {
    const p = u.permissions||[];
    if(p.includes('admin'))        return {l:'管理員', c:'admin'};
    if(p.includes('edit_board')&&p.includes('edit_issues')) return {l:'主管', c:'manager'};
    if(p.includes('edit_board'))   return {l:'工程師', c:'operator'};
    return {l:'檢視者', c:'viewer'};
  };

  return (
    <div className="adm-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="adm-modal" onClick={e=>e.stopPropagation()}>
        <div className="adm-mh">
          <div style={{display:'flex',gap:16,alignItems:'center'}}>
            <h3>⚙️ 管理員後台</h3>
            <div className="seg">
              {[['overview','📊 總覽'],['users','👥 使用者']].map(([k,l])=>(
                <button key={k} className={'seg-btn'+(tab===k?' active':'')} onClick={()=>setTab(k)}>{l}</button>
              ))}
            </div>
          </div>
          <button className="adm-close" onClick={onClose}>×</button>
        </div>
        <div className="adm-mb" style={{paddingBottom:0}}>
          {tab==='overview' && (
            <div>
              <div className="adm-stats">
                {[['👥','使用者',users.length],['📋','訂單',stats.orders],['⚠️','異常',stats.anomalies],['🔧','設備',stats.equipment]].map(([ic,l,v])=>(
                  <div key={l} className="adm-stat"><div className="adm-stat-icon">{ic}</div><div className="adm-stat-val">{v}</div><div className="adm-stat-lbl">{l}</div></div>
                ))}
              </div>
              <div style={{background:'#fafbfc',border:'1px solid #e6e8ec',borderRadius:8,padding:'16px 18px',fontSize:13,lineHeight:1.9,color:'#5a6270',marginBottom:20}}>
                <strong style={{color:'#0a0e14',display:'block',marginBottom:6}}>🚀 Firebase 部署說明</strong>
                1. 填寫 <code style={{background:'#f0f4ff',padding:'1px 6px',borderRadius:3}}>firebase-config.js</code><br/>
                2. Firebase Console → Authentication → 啟用 Email/密碼<br/>
                3. Firestore → 建立 Collections: <code>users / orders / anomalies / ipa_purchases / equipment</code><br/>
                4. Authentication → 手動建立第一個管理員帳號，UID 對應 users 文件並加入 <code>permissions: ["admin"]</code><br/>
                5. 設定 Firestore Security Rules（見 README.md）
              </div>
            </div>
          )}
          {tab==='users' && (
            <div>
              <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
                <div style={{fontSize:13,fontWeight:700,color:'#0a0e14'}}>使用者管理</div>
                <span style={{fontSize:11.5,color:'#8a93a3',fontFamily:'monospace'}}>{users.length} 個帳號</span>
                <button style={{marginLeft:'auto',height:32,padding:'0 14px',border:'none',background:'#0a0e14',color:'#fff',fontSize:13,fontWeight:600,borderRadius:6,cursor:'pointer',fontFamily:'inherit'}}
                  onClick={()=>{setEditU(null);setIsCreate(true);setModal(true);}}>+ 新增使用者</button>
              </div>
              <div style={{overflowX:'auto'}}>
                <table className="users-tbl">
                  <thead><tr><th>使用者</th><th>Email</th><th>角色</th><th>權限</th><th>狀態</th><th>操作</th></tr></thead>
                  <tbody>
                    {users.map(u=>{
                      const r=roleOf(u);
                      return(
                        <tr key={u._id}>
                          <td>
                            <div style={{display:'flex',alignItems:'center',gap:10}}>
                              <div className="u-avatar">{(u.displayName||u.email||'?')[0].toUpperCase()}</div>
                              <div>
                                <div style={{fontWeight:600,fontSize:13}}>{u.displayName}{u._id===window.currentUser?.uid&&<span style={{fontSize:10,color:'#8a93a3',marginLeft:6}}>(你)</span>}</div>
                              </div>
                            </div>
                          </td>
                          <td style={{fontSize:12,color:'#8a93a3'}}>{u.email}</td>
                          <td><span className={'role-chip '+r.c}>{r.l}</span></td>
                          <td style={{maxWidth:200}}>
                            <div style={{display:'flex',flexWrap:'wrap',gap:2}}>
                              {(u.permissions||[]).slice(0,3).map(p=><span key={p} style={{background:'#f0f4f8',padding:'1px 7px',borderRadius:10,fontSize:10,color:'#5a6270'}}>{PERMISSIONS[p]||p}</span>)}
                              {(u.permissions||[]).length>3&&<span style={{fontSize:10,color:'#8a93a3'}}>+{(u.permissions||[]).length-3}</span>}
                            </div>
                          </td>
                          <td><span className={'st-dot '+(u.active?'on':'off')}>{u.active?'● 啟用':'○ 停用'}</span></td>
                          <td>
                            <div style={{display:'flex',gap:4}}>
                              <button style={{border:'1px solid #e6e8ec',background:'#fff',borderRadius:5,cursor:'pointer',padding:'3px 8px',fontSize:12,color:'#3b4250',fontFamily:'inherit'}} onClick={()=>{setEditU(u);setIsCreate(false);setModal(true);}}>✎</button>
                              <button style={{border:'1px solid #e6e8ec',background:'#fff',borderRadius:5,cursor:'pointer',padding:'3px 8px',fontSize:12,color:'#3b4250',fontFamily:'inherit'}} onClick={()=>toggleActive(u)}>{u.active?'⏸':'▶'}</button>
                              {u._id!==window.currentUser?.uid&&<button style={{border:'1px solid #ffc9c9',background:'#fff5f5',borderRadius:5,cursor:'pointer',padding:'3px 8px',fontSize:12,color:'#c0392b',fontFamily:'inherit'}} onClick={()=>delUser(u)}>✕</button>}
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                    {users.length===0&&<tr><td colSpan="6" style={{textAlign:'center',padding:'40px',color:'#8a93a3',fontSize:13}}>尚無使用者資料</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
        <div className="adm-mf"><button onClick={onClose} style={{height:34,padding:'0 16px',border:'1px solid #e6e8ec',background:'#fff',color:'#3b4250',fontSize:13,fontWeight:500,borderRadius:6,cursor:'pointer',fontFamily:'inherit'}}>關閉</button></div>
      </div>
      {modal && <UserModal item={editU} isCreate={isCreate} onClose={()=>setModal(false)} onSave={handleSave}/>}
    </div>
  );
}

// 全域函式：由 JS 呼叫
let _adminRoot = null;
window.openAdminModal = function() {
  var el = document.getElementById('admin-modal-root');
  if (!_adminRoot) _adminRoot = ReactDOM.createRoot(el);
  _adminRoot.render(<AdminModal onClose={window.closeAdminModal}/>);
};
window.closeAdminModal = function() {
  if (_adminRoot) _adminRoot.render(null);
  // 回到上一個 app
  navigate(currentApp === 'admin' ? 'board' : currentApp);
};
</script>

</body>
</html>
