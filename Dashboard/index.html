<!-- ② KanbanView -->
<script type="text/babel" data-presets="react">
const { useState: useStateK, useMemo: useMemoK } = React;

function KanbanView({ data, setData }) {
  const K = window.K;
  const [search, setSearch] = useStateK('');
  const [engF, setEngF] = useStateK('');
  const [machF, setMachF] = useStateK('');
  const [groupBy, setGroupBy] = useStateK('status');
  const [density, setDensity] = useStateK('comfortable');
  const [open, setOpen] = useStateK(null);
  const [dragItem, setDragItem] = useStateK(null);

  const STATUS_COLUMNS = [
    { key:'todo',     title:'待開始',  hint:'0%, 尚未排程',    tone:'#5a6270' },
    { key:'blocked',  title:'等待材料', hint:'需調撥 / 待客戶', tone:'#c79b2a' },
    { key:'progress', title:'進行中',  hint:'已排程, 列印中',  tone:'#0c7a99' },
    { key:'done',     title:'已完成',  hint:'100% / 出貨',     tone:'#1d6f43' },
    { key:'cancelled',title:'已取消',  hint:'備註含「取消」',  tone:'#9aa3b2' },
  ];
  const PROGRESS_COLUMNS = [
    { key:'0',   title:'0%',   hint:'尚未開始', tone:'#9aa3b2' },
    { key:'25',  title:'25%',  hint:'備料/起印', tone:'#c79b2a' },
    { key:'50',  title:'50%',  hint:'列印中',    tone:'#c79b2a' },
    { key:'75',  title:'75%',  hint:'後處理',    tone:'#0c7a99' },
    { key:'100', title:'100%', hint:'完成',       tone:'#1d6f43' },
  ];
  const ENGINEER_COLUMNS = K.ENG_ORDER.map(k => ({ key:k, title:K.ENG_LABEL[k], hint:k, tone:K.ENG_TONE[k].fg }));
  const MACHINE_COLUMNS  = K.MACHINES.map(k => ({ key:k, title:k, hint:'機台', tone:'#0c7a99' }));

  const cols = groupBy==='status' ? STATUS_COLUMNS : groupBy==='progress' ? PROGRESS_COLUMNS : groupBy==='engineer' ? ENGINEER_COLUMNS : MACHINE_COLUMNS;

  function columnKeyFor(item) {
    if (groupBy==='status')   return K.statusOf(item);
    if (groupBy==='progress') return String(item.progress);
    if (groupBy==='engineer') return item.engineer;
    if (groupBy==='machine')  return item.machine||'—';
    return K.statusOf(item);
  }

  const filtered = useMemoK(() => K.applyFilters(data, { search, engineer:engF, machine:machF }), [data, search, engF, machF]);
  const grouped  = useMemoK(() => {
    const m = {}; cols.forEach(c => { m[c.key] = []; });
    filtered.forEach(it => { const k = columnKeyFor(it); if (m[k]) m[k].push(it); });
    return m;
  }, [filtered, cols, groupBy]);

  const stats = {
    total:   data.length,
    wip:     data.filter(d=>K.statusOf(d)==='progress').length,
    blocked: data.filter(d=>K.statusOf(d)==='blocked').length,
    due7:    data.filter(d=>{ const s=K.statusOf(d); if(s==='done'||s==='cancelled')return false; const du=K.daysUntil(d.dueDate); return du!==null&&du<=7; }).length,
    done:    data.filter(d=>K.statusOf(d)==='done').length,
  };

  function handleDrop(colKey) {
    if (!dragItem) return;
    setData(prev => prev.map(d => {
      if (d.seq !== dragItem.seq) return d;
      const u = {...d};
      if (groupBy==='status') {
        if      (colKey==='done')     { u.progress=100; u.complete='是'; u.remark=(u.remark||'').replace('已取消','').trim(); }
        else if (colKey==='todo')     { u.progress=0;   u.complete='否'; u.remark=(u.remark||'').replace('已取消','').trim(); }
        else if (colKey==='progress') { if(u.progress===0||u.progress===100)u.progress=50; u.complete='否'; u.remark=(u.remark||'').replace('已取消','').trim(); }
        else if (colKey==='blocked')  { u.material='需調撥'; u.complete='否'; }
        else if (colKey==='cancelled'){ u.remark=u.remark?`${u.remark} · 已取消`:'已取消'; }
      } else if (groupBy==='progress') { u.progress=parseInt(colKey,10); u.complete=u.progress===100?'是':'否'; }
      else if (groupBy==='engineer') { u.engineer=colKey; }
      else if (groupBy==='machine')  { u.machine=colKey; }
      return u;
    }));
    setDragItem(null);
  }

  function Avatar({ engineer }) {
    const tone = K.ENG_TONE[engineer]||{fg:'#5a6270',bg:'#eef0f3'};
    return <span className="avatar" style={{color:tone.fg,background:tone.bg}} title={K.ENG_LABEL[engineer]||engineer}>{K.ENG_INIT[engineer]||engineer.slice(0,2)}</span>;
  }

  function DueChip({ dateStr, isDone }) {
    if (!dateStr) return <span className="chip chip-muted">未訂期</span>;
    const d = K.daysUntil(dateStr);
    if (isDone) return <span className="chip chip-muted">{dateStr.slice(5)}</span>;
    let cls='chip', label=dateStr.slice(5);
    if      (d<0)  { cls+=' chip-red';   label=`逾期 ${-d}d`; }
    else if (d<=3) { cls+=' chip-red';   label=`${dateStr.slice(5)} · ${d}d`; }
    else if (d<=7) { cls+=' chip-amber'; label=`${dateStr.slice(5)} · ${d}d`; }
    else           { cls+=' chip-muted'; label=`${dateStr.slice(5)} · ${d}d`; }
    return <span className={cls}>{label}</span>;
  }

  function Card({ item }) {
    const st = K.statusOf(item);
    const done = st==='done', cancelled = st==='cancelled';
    return (
      <div className={`card${density==='compact'?' card-compact':''}${dragItem&&dragItem.seq===item.seq?' card-dragging':''}${cancelled?' card-cancelled':''}`}
        draggable onDragStart={()=>setDragItem(item)} onDragEnd={()=>setDragItem(null)} onClick={()=>setOpen(item)}>
        <div className="card-top">
          <span className="card-id">EF · {item.id ? item.id.slice(-7) : '—'}</span>
          <div className="card-top-right">
            {item.material==='需調撥'&&<span className="dot dot-amber"/>}
            <Avatar engineer={item.engineer}/>
          </div>
        </div>
        <div className="card-title">{item.customer}</div>
        {density!=='compact'&&(
          <div className="card-meta">
            <span className="meta-machine">{item.machine||'未指派機台'}</span>
            {item.remark&&<span className="meta-remark" title={item.remark}>· {item.remark}</span>}
          </div>
        )}
        <div className="card-progress">
          <div className="progress-track"><div className="progress-fill" style={{width:`${item.progress}%`,background:done?'#1d6f43':cancelled?'#cbd0d8':'#0c7a99'}}/></div>
          <span className="progress-num">{item.progress}%</span>
        </div>
        <div className="card-foot">
          <DueChip dateStr={item.dueDate} isDone={done}/>
          <span className="seq-num">#{String(item.seq).padStart(3,'0')}</span>
        </div>
      </div>
    );
  }

  function Column({ col, items }) {
    const [over, setOver] = useStateK(false);
    return (
      <div className={`col${over?' col-over':''}`}
        onDragOver={e=>{e.preventDefault();setOver(true);}}
        onDragLeave={()=>setOver(false)}
        onDrop={()=>{setOver(false);handleDrop(col.key);}}>
        <div className="col-head">
          <div className="col-head-left">
            <span className="col-dot" style={{background:col.tone}}/>
            <span className="col-title">{col.title}</span>
            <span className="col-count">{items.length}</span>
          </div>
          <span className="col-hint">{col.hint}</span>
        </div>
        <div className="col-body">
          {items.map(it=><Card key={it.seq} item={it}/>)}
          {items.length===0&&<div className="col-empty">—</div>}
        </div>
      </div>
    );
  }

  function Drawer() {
    if (!open) return null;
    const tone = K.ENG_TONE[open.engineer]||{fg:'#5a6270',bg:'#eef0f3'};
    return (
      <div className="drawer-wrap" onClick={()=>setOpen(null)}>
        <aside className="drawer" onClick={e=>e.stopPropagation()}>
          <header className="drawer-head">
            <div>
              <div className="drawer-eyebrow">EF 訂單詳情</div>
              <div className="drawer-id">{open.id||'—'}</div>
            </div>
            <button className="icon-btn" onClick={()=>setOpen(null)}>×</button>
          </header>
          <div className="drawer-customer">{open.customer}</div>
          <div className="drawer-row">
            <div className="drawer-field">
              <div className="field-label">執行工程師</div>
              <div className="field-value">
                <span className="avatar" style={{color:tone.fg,background:tone.bg,marginRight:8}}>{K.ENG_INIT[open.engineer]||open.engineer.slice(0,2)}</span>
                {K.ENG_LABEL[open.engineer]||open.engineer}
              </div>
            </div>
            <div className="drawer-field">
              <div className="field-label">機台</div>
              <div className="field-value mono">{open.machine||'—'}</div>
            </div>
          </div>
          <div className="drawer-row">
            <div className="drawer-field">
              <div className="field-label">期望交期</div>
              <div className="field-value mono">{open.dueDate||'—'}</div>
            </div>
            <div className="drawer-field">
              <div className="field-label">材料庫存</div>
              <div className="field-value">
                <span className={open.material==='足夠'?'pill pill-ok':'pill pill-amber'}>{open.material}</span>
              </div>
            </div>
          </div>
          <div className="drawer-row">
            <div className="drawer-field">
              <div className="field-label">開始日</div>
              <div className="field-value mono">{open.startDate||'—'}</div>
            </div>
            <div className="drawer-field">
              <div className="field-label">預計完成日</div>
              <div className="field-value mono">{open.endDate||'—'}</div>
            </div>
          </div>
          <div style={{marginBottom:16}}>
            <div className="field-label">進度</div>
            <div className="card-progress" style={{marginTop:8}}>
              <div className="progress-track" style={{height:6}}>
                <div className="progress-fill" style={{width:`${open.progress}%`}}/>
              </div>
              <span className="progress-num">{open.progress}%</span>
            </div>
          </div>
          {open.remark&&(
            <div>
              <div className="field-label">備註</div>
              <div className="remark-box" style={{marginTop:6}}>{open.remark}</div>
            </div>
          )}
          <div className="drawer-foot">
            <span>#{String(open.seq).padStart(3,'0')}</span>
            <span>{open.complete==='是'?'✅ 已完成':'未完成'}</span>
          </div>
        </aside>
      </div>
    );
  }

  const engineers = window._settings_engineers||K.ENG_ORDER;
  const machines  = window._settings_machines||K.MACHINES;

  return (
    <div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0}}>
      <div className="kpi-strip">
        {[
          {label:'總訂單',   value:stats.total},
          {label:'進行中',   value:stats.wip},
          {label:'等待材料', value:stats.blocked},
          {label:'7天內到期',value:stats.due7},
          {label:'已完成',   value:stats.done},
        ].map(k=>(
          <div key={k.label} className="kpi-cell">
            <div className="kpi-label">{k.label}</div>
            <div className="kpi-value">{k.value}</div>
          </div>
        ))}
      </div>
      <div className="toolbar">
        <div className="t-search">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" strokeWidth="1.5"/><path d="M11 11l3 3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜尋 EF / 客戶"/>
        </div>
        <select className="t-sel" value={engF} onChange={e=>setEngF(e.target.value)}>
          <option value="">所有工程師</option>
          {engineers.map(k=><option key={k} value={k}>{K.ENG_LABEL[k]||k}</option>)}
        </select>
        <select className="t-sel" value={machF} onChange={e=>setMachF(e.target.value)}>
          <option value="">所有機台</option>
          {machines.map(m=><option key={m} value={m}>{m}</option>)}
        </select>
        <div className="seg">
          {[['status','狀態'],['progress','進度'],['engineer','工程師'],['machine','機台']].map(([g,l])=>(
            <button key={g} className={`seg-btn${groupBy===g?' active':''}`} onClick={()=>setGroupBy(g)}>{l}</button>
          ))}
        </div>
        <div className="seg">
          {[['comfortable','標準'],['compact','緊湊']].map(([d,l])=>(
            <button key={d} className={`seg-btn${density===d?' active':''}`} onClick={()=>setDensity(d)}>{l}</button>
          ))}
        </div>
      </div>
      <div className="board">
        {cols.map(col=><Column key={col.key} col={col} items={grouped[col.key]||[]}/>)}
      </div>
      <Drawer/>
    </div>
  );
}
window.KanbanView = KanbanView;
</script>

<!-- ③ GanttView -->
<script type="text/babel" data-presets="react">
function GanttView({ data }) {
  const K = window.K;
  const { useState: useStateG, useMemo: useMemoG } = React;
  const [engF, setEngF] = useStateG('');
  const filtered = useMemoG(() => engF ? data.filter(d=>d.engineer===engF) : data, [data, engF]);
  const today = K.TODAY;
  const DAY = K.DAY;
  const DAY_W = 22;

  const { startD, days } = useMemoG(() => {
    const all = [];
    filtered.forEach(d => {
      if (d.startDate) all.push(new Date(d.startDate));
      if (d.endDate)   all.push(new Date(d.endDate));
      if (d.dueDate)   all.push(new Date(d.dueDate));
    });
    all.push(today);
    if (!all.length) return { startD: today, days: 60 };
    const min = new Date(Math.min(...all.map(d=>d.getTime())));
    const max = new Date(Math.max(...all.map(d=>d.getTime())));
    min.setDate(min.getDate()-7);
    max.setDate(max.getDate()+14);
    const days = Math.round((max-min)/DAY)+1;
    return { startD: min, days };
  }, [filtered]);

  const todayOffset = Math.round((today-startD)/DAY);

  function dayOffset(dateStr) {
    if (!dateStr) return null;
    return Math.round((new Date(dateStr)-startD)/DAY);
  }

  const months = useMemoG(() => {
    const m = []; let cur=null, count=0, startIdx=0;
    for (let i=0; i<days; i++) {
      const d = new Date(startD.getTime()+i*DAY);
      const key = `${d.getFullYear()}-${d.getMonth()}`;
      if (key!==cur) { if(cur!==null)m.push({label:cur,count,startIdx}); cur=key; count=1; startIdx=i; }
      else count++;
    }
    if (cur!==null) m.push({label:cur,count,startIdx});
    return m.map(m2 => {
      const d = new Date(startD.getTime()+m2.startIdx*DAY);
      return {...m2, label:`${d.getFullYear()}/${d.getMonth()+1}`};
    });
  }, [startD, days]);

  const engineers = window._settings_engineers||K.ENG_ORDER;

  return (
    <div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0,overflow:'hidden'}}>
      <div className="toolbar">
        <span className="toolbar-title">時間軸</span>
        <span className="toolbar-sub">{filtered.length} 筆工作</span>
        <select className="t-sel" value={engF} onChange={e=>setEngF(e.target.value)}>
          <option value="">所有工程師</option>
          {engineers.map(k=><option key={k} value={k}>{K.ENG_LABEL[k]||k}</option>)}
        </select>
      </div>
      <div className="gantt">
        <div className="gantt-left">
          <div className="lane-head-sticky">工作 / 客戶</div>
          {filtered.map((d,i)=>{
            const tone=K.ENG_TONE[d.engineer]||{fg:'#5a6270',bg:'#eef0f3'};
            return (
              <div key={d._id||d.seq} className="lane" style={{background:i%2?'var(--bg-soft)':'var(--bg)'}}>
                <span className="lane-avatar" style={{color:tone.fg,background:tone.bg}}>{K.ENG_INIT[d.engineer]||d.engineer.slice(0,2)}</span>
                <div className="lane-meta">
                  <span className="lane-name" style={{fontSize:12}}>{d.customer}</span>
                  <span className="lane-sub">{d.dueDate}</span>
                </div>
              </div>
            );
          })}
        </div>
        <div className="gantt-right" style={{position:'relative',minWidth:days*DAY_W}}>
          <div className="scale" style={{height:48}}>
            <div className="scale-months">
              {months.map((m,i)=>(
                <div key={i} className="scale-month" style={{width:m.count*DAY_W,flexShrink:0}}>{m.label}</div>
              ))}
            </div>
            <div className="scale-days">
              {Array.from({length:days}).map((_,i)=>{
                const d=new Date(startD.getTime()+i*DAY);
                const dow=d.getDay();
                const isWeekend=dow===0||dow===6;
                const isToday=i===todayOffset;
                return <div key={i} className={`scale-day${isWeekend?' weekend':''}${isToday?' is-today':''}`} style={{width:DAY_W,flexShrink:0}}>{d.getDate()}</div>;
              })}
            </div>
          </div>
          {filtered.map((item,rowIdx)=>{
            const st=K.statusOf(item);
            const s=dayOffset(item.startDate);
            const e=dayOffset(item.endDate||item.dueDate);
            const due=dayOffset(item.dueDate);
            const hasBar=s!==null&&e!==null&&e>=s;
            return (
              <div key={item._id||item.seq} className={`row${rowIdx%2?' alt':''}`} style={{height:56,position:'relative'}}>
                {Array.from({length:days}).map((_,i)=>{
                  const d=new Date(startD.getTime()+i*DAY);
                  const isWeekend=d.getDay()===0||d.getDay()===6;
                  return <div key={i} style={{position:'absolute',left:i*DAY_W,top:0,bottom:0,width:DAY_W,borderRight:'1px solid var(--line-soft)',background:isWeekend?'rgba(10,14,20,0.018)':'transparent'}}/>;
                })}
                <div className="today-line" style={{left:todayOffset*DAY_W+DAY_W/2}}/>
                {hasBar&&(
                  <div className={`bar ${st}`} style={{left:s*DAY_W,width:Math.max(1,(e-s+1))*DAY_W-2,top:'50%',transform:'translateY(-50%)'}}>
                    <div className="bar-fill" style={{width:`${item.progress}%`}}/>
                    <span className="bar-text">{item.customer}</span>
                    {due!==null&&due>e&&<div className="bar-due-marker"/>}
                  </div>
                )}
                {!hasBar&&due!==null&&(
                  <div className={`bar todo`} style={{left:due*DAY_W,width:DAY_W-2,top:'50%',transform:'translateY(-50%)',fontSize:9,justifyContent:'center'}}>▼</div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}
window.GanttView = GanttView;
</script>

<!-- ④ DashboardView -->
<script type="text/babel" data-presets="react">
function DashboardView({ data }) {
  const K = window.K;
  const { useMemo, useState } = React;

  const STATUS_COLORS = { todo:'#cbd0d8', blocked:'#c79b2a', progress:'#0c7a99', done:'#1d6f43', cancelled:'#b0b5bf' };
  const ENG_COLORS = ['#0c7a99','#6b3fa0','#1d6f43','#a05a00','#c0392b','#2471a3'];
  const MACH_COLORS = ['#0c7a99','#1d6f43','#c79b2a','#6b3fa0'];

  // ── KPI 統計 ──
  const stats = useMemo(() => {
    const total    = data.length;
    const wip      = data.filter(d=>K.statusOf(d)==='progress').length;
    const blocked  = data.filter(d=>K.statusOf(d)==='blocked').length;
    const done     = data.filter(d=>K.statusOf(d)==='done').length;
    const due7     = data.filter(d=>{ const s=K.statusOf(d); if(s==='done'||s==='cancelled')return false; const v=K.daysUntil(d.dueDate); return v!==null&&v<=7&&v>=0; }).length;
    const statusDist = {
      todo:      data.filter(d=>K.statusOf(d)==='todo').length,
      blocked,
      progress:  wip,
      done,
      cancelled: data.filter(d=>K.statusOf(d)==='cancelled').length,
    };
    const engineers = window._settings_engineers||K.ENG_ORDER;
    const machines  = window._settings_machines||K.MACHINES;
    const byEng={}, byMach={}, byProg={0:0,25:0,50:0,75:0,100:0}, byMat={};
    engineers.forEach(k=>{byEng[k]=0;}); machines.forEach(m=>{byMach[m]=0;});
    data.forEach(d=>{
      if(d.engineer) byEng[d.engineer]=(byEng[d.engineer]||0)+1;
      if(d.machine)  byMach[d.machine]=(byMach[d.machine]||0)+1;
      const p = K.PROGRESS_VALUES.includes(d.progress)?d.progress:0;
      byProg[p]=(byProg[p]||0)+1;
      const mat=d.material||'足夠'; byMat[mat]=(byMat[mat]||0)+1;
    });
    const byCustomer={};
    data.forEach(d=>{ const c=d.customer||'—'; byCustomer[c]=(byCustomer[c]||0)+1; });
    return { total,wip,blocked,done,due7,statusDist,byEng,byMach,byProg,byMat,byCustomer,engineers,machines };
  }, [data]);

  // ── 圖表元件 ──
  function DonutChart({ slices, centerLabel }) {
    const total = slices.reduce((s,x)=>s+x.value,0);
    if (!total) return <div className="chart-empty">無資料</div>;
    const R=68, cx=90, cy=90, thick=20;
    let acc=0;
    const paths=slices.filter(s=>s.value>0).map(sl=>{
      const pct=sl.value/total;
      const s0=acc*2*Math.PI-Math.PI/2; acc+=pct; const s1=acc*2*Math.PI-Math.PI/2;
      const large=pct>0.5?1:0;
      const x1=cx+R*Math.cos(s0),y1=cy+R*Math.sin(s0),x2=cx+R*Math.cos(s1),y2=cy+R*Math.sin(s1);
      return <path key={sl.label} d={`M${cx} ${cy} L${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2}Z`} fill={sl.color} stroke="#fff" strokeWidth="2"/>;
    });
    return (
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12,width:'100%'}}>
        <div style={{position:'relative',display:'inline-flex',alignItems:'center',justifyContent:'center'}}>
          <svg width="180" height="180" viewBox="0 0 180 180">
            {paths}
            <circle cx={cx} cy={cy} r={R-thick} fill="#fff"/>
          </svg>
          <div style={{position:'absolute',textAlign:'center',pointerEvents:'none'}}>
            <div style={{fontSize:28,fontWeight:700,fontFamily:'var(--font-mono)',letterSpacing:'-0.02em',color:'var(--ink)',lineHeight:1}}>{total}</div>
            <div style={{fontSize:10,color:'var(--ink-4)',fontFamily:'var(--font-mono)',marginTop:3,letterSpacing:'0.06em',textTransform:'uppercase'}}>{centerLabel||'總計'}</div>
          </div>
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:'4px 10px',justifyContent:'center',fontSize:10.5,color:'var(--ink-3)',fontFamily:'var(--font-mono)'}}>
          {slices.filter(s=>s.value>0).map(s=>(
            <span key={s.label} style={{display:'inline-flex',alignItems:'center',gap:4}}>
              <span style={{width:8,height:8,borderRadius:2,background:s.color,flexShrink:0}}/>
              {s.label} · {s.value}
            </span>
          ))}
        </div>
      </div>
    );
  }

  function HBarChart({ items, colorFn }) {
    const max = Math.max(1,...items.map(i=>i.value));
    return (
      <div style={{display:'flex',flexDirection:'column',gap:10,width:'100%',padding:'4px 0'}}>
        {items.filter(i=>i.value>0).map((item,idx)=>(
          <div key={item.label} style={{display:'grid',gridTemplateColumns:'90px 1fr 28px',gap:10,alignItems:'center'}}>
            <span style={{fontSize:11.5,color:'var(--ink-2)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.label}</span>
            <div style={{height:14,background:'var(--bg-soft)',borderRadius:4,overflow:'hidden',position:'relative'}}>
              <div style={{position:'absolute',inset:'0 auto 0 0',borderRadius:4,transition:'width .3s',background:colorFn?colorFn(item,idx):'var(--accent)',width:`${Math.round(item.value/max*100)}%`}}/>
            </div>
            <span style={{fontSize:11,fontFamily:'var(--font-mono)',color:'var(--ink-2)',textAlign:'right'}}>{item.value}</span>
          </div>
        ))}
        {items.every(i=>i.value===0)&&<div className="chart-empty">無資料</div>}
      </div>
    );
  }

  function VBarChart({ items, colorFn }) {
    const max = Math.max(1,...items.map(i=>i.value));
    const H = 140;
    return (
      <div style={{width:'100%',display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
        <svg width="100%" height={H+30} viewBox={`0 0 ${items.length*56} ${H+30}`} preserveAspectRatio="xMidYMid meet">
          {[0,Math.ceil(max/2),max].map((v,i)=>{
            const y=H-Math.round(v/max*H);
            return <g key={i}><line x1={0} y1={y} x2={items.length*56} y2={y} stroke="var(--line-soft)" strokeWidth="1"/><text x={-2} y={y+4} fontSize="9" fill="var(--ink-4)" textAnchor="end">{v}</text></g>;
          })}
          {items.map((item,idx)=>{
            const bw=34, bx=idx*56+11;
            const bh=max>0?Math.max(2,Math.round(item.value/max*H)):0;
            const by=H-bh;
            const fill=colorFn?colorFn(item,idx):'var(--accent)';
            return (
              <g key={item.label}>
                <rect x={bx} y={by} width={bw} height={bh} fill={fill} rx="3"/>
                {item.value>0&&<text x={bx+bw/2} y={by-4} fontSize="9" fill="var(--ink-3)" textAnchor="middle">{item.value}</text>}
                <text x={bx+bw/2} y={H+14} fontSize="9" fill="var(--ink-4)" textAnchor="middle">{item.label}</text>
              </g>
            );
          })}
        </svg>
      </div>
    );
  }

  // ── 自由分析 ──
  const DIM_OPTIONS = [
    { key:'status',   label:'依 狀態' },
    { key:'engineer', label:'依 工程師' },
    { key:'progress', label:'依 進度' },
    { key:'machine',  label:'依 機台' },
    { key:'material', label:'依 材料' },
    { key:'customer', label:'依 客戶（Top 8）' },
  ];
  const CHART_OPTIONS = [
    { key:'donut', label:'環狀圖' },
    { key:'hbar',  label:'橫條圖' },
    { key:'vbar',  label:'直條圖' },
  ];

  function buildSlices(dim) {
    switch(dim) {
      case 'status': return Object.entries(stats.statusDist).map(([k,v],i)=>({ label:K.STATUS_TONE[k]?.label||k, value:v, color:STATUS_COLORS[k] }));
      case 'engineer': return stats.engineers.map((k,i)=>({ label:K.ENG_LABEL[k]||k, value:stats.byEng[k]||0, color:ENG_COLORS[i%ENG_COLORS.length] }));
      case 'progress': return K.PROGRESS_VALUES.map((p,i)=>({ label:`${p}%`, value:stats.byProg[p]||0, color:MACH_COLORS[i%MACH_COLORS.length] }));
      case 'machine':  return stats.machines.map((m,i)=>({ label:m, value:stats.byMach[m]||0, color:MACH_COLORS[i%MACH_COLORS.length] }));
      case 'material': return Object.entries(stats.byMat).map(([k,v],i)=>({ label:k, value:v, color:i===0?'#1d6f43':'#c79b2a' }));
      case 'customer': {
        const sorted=Object.entries(stats.byCustomer).sort((a,b)=>b[1]-a[1]).slice(0,8);
        return sorted.map(([k,v],i)=>({ label:k, value:v, color:'#0c7a99' }));
      }
      default: return [];
    }
  }

  function CustomChart({ idx }) {
    const [dim,   setDim]   = useState(idx===0?'machine':idx===1?'material':'customer');
    const [chart, setChart] = useState(idx===2?'hbar':'donut');
    const slices = buildSlices(dim);
    const colorFn = (item, i) => slices[i]?.color || 'var(--accent)';
    const centerLabel = DIM_OPTIONS.find(d=>d.key===dim)?.label.replace('依 ','');

    const SEL = { height:32, padding:'0 26px 0 10px', border:'1px solid var(--line)', borderRadius:6, background:'var(--bg)', color:'var(--ink-2)', font:'inherit', fontSize:12.5, cursor:'pointer', WebkitAppearance:'none', appearance:'none', backgroundImage:"url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' fill='none' stroke='%235a6270' stroke-width='1.4'/></svg>\")", backgroundRepeat:'no-repeat', backgroundPosition:'right 7px center', flex:1, minWidth:0 };

    return (
      <div style={{border:'1px solid var(--line)',borderRadius:8,background:'var(--bg)',padding:'14px 16px 18px',display:'flex',flexDirection:'column',gap:14}}>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <span style={{fontSize:11,color:'var(--accent)',marginRight:2}}>⊕</span>
          <span style={{fontSize:12.5,fontWeight:600,color:'var(--ink)'}}>自由分析 #{idx+1}</span>
        </div>
        <div style={{display:'flex',gap:8}}>
          <select style={SEL} value={dim} onChange={e=>setDim(e.target.value)}>
            {DIM_OPTIONS.map(d=><option key={d.key} value={d.key}>{d.label}</option>)}
          </select>
          <select style={SEL} value={chart} onChange={e=>setChart(e.target.value)}>
            {CHART_OPTIONS.map(c=><option key={c.key} value={c.key}>{c.label}</option>)}
          </select>
        </div>
        <div style={{display:'flex',justifyContent:'center',alignItems:'center',minHeight:200}}>
          {chart==='donut' && <DonutChart slices={slices} centerLabel={centerLabel}/>}
          {chart==='hbar'  && <HBarChart  items={slices} colorFn={colorFn}/>}
          {chart==='vbar'  && <VBarChart  items={slices} colorFn={colorFn}/>}
        </div>
      </div>
    );
  }

  // ── 預設固定圖表 ──
  const statusSlices  = Object.entries(stats.statusDist).map(([k,v])=>({ label:K.STATUS_TONE[k]?.label||k, value:v, color:STATUS_COLORS[k] }));
  const engItems      = stats.engineers.map((k,i)=>({ label:K.ENG_LABEL[k]||k, value:stats.byEng[k]||0, color:ENG_COLORS[i%ENG_COLORS.length] }));
  const progItems     = K.PROGRESS_VALUES.map((p,i)=>({ label:`${p}%`, value:stats.byProg[p]||0, color:MACH_COLORS[i%MACH_COLORS.length] }));

  const CARD = { border:'1px solid var(--line)', borderRadius:8, background:'var(--bg)', padding:'14px 16px 18px', display:'flex', flexDirection:'column', gap:12 };
  const CARD_HEAD = { display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:4 };
  const CARD_TITLE = { fontSize:12.5, fontWeight:600, color:'var(--ink)' };
  const CARD_BADGE = { fontSize:10, fontFamily:'var(--font-mono)', color:'var(--ink-4)', letterSpacing:'0.06em', textTransform:'uppercase' };

  return (
    <div style={{flex:1,overflow:'auto',padding:'0 28px 32px',background:'var(--bg)'}}>

      {/* KPI */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:0,borderBottom:'1px solid var(--line)',margin:'0 -28px 0',padding:'0 28px'}}>
        {[
          { label:'總訂單',    value:stats.total,  sub:'全部資料筆數',          color:'var(--ink)' },
          { label:'進行中',    value:stats.wip,    sub:'已開工未完成',          color:'var(--ink)' },
          { label:'等待材料',  value:stats.blocked,sub:'需調撥 / 待備料',       color:'#c79b2a'    },
          { label:'7 天內到期',value:stats.due7,   sub:'未完成且交期 ≤ 7 天',  color:'#c0392b'    },
          { label:'已完成',    value:stats.done,   sub:'100% / 完成',          color:'#1d6f43'    },
        ].map((k,i)=>(
          <div key={k.label} style={{padding:'18px 24px 20px',borderRight:i<4?'1px solid var(--line-soft)':'none'}}>
            <div style={{fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:'var(--ink-4)',fontWeight:600,fontFamily:'var(--font-mono)'}}>{k.label}</div>
            <div style={{fontSize:32,fontWeight:700,fontFamily:'var(--font-mono)',letterSpacing:'-0.02em',color:k.color,marginTop:4,lineHeight:1.1}}>{k.value}</div>
            <div style={{fontSize:11,color:'var(--ink-4)',marginTop:4,fontFamily:'var(--font-mono)'}}>{k.sub}</div>
          </div>
        ))}
      </div>

      {/* 預設分析 */}
      <div style={{display:'flex',alignItems:'baseline',gap:10,padding:'20px 0 14px'}}>
        <span style={{fontSize:14,fontWeight:700,color:'var(--ink)'}}>預設分析</span>
        <span style={{fontSize:10.5,color:'var(--ink-4)',fontFamily:'var(--font-mono)',letterSpacing:'0.06em',textTransform:'uppercase'}}>DEFAULT VIEWS</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16,marginBottom:32}}>

        {/* 狀態分布 Donut */}
        <div style={CARD}>
          <div style={CARD_HEAD}>
            <span style={CARD_TITLE}>狀態分布</span>
            <span style={CARD_BADGE}>DONUT</span>
          </div>
          <div style={{display:'flex',justifyContent:'center',alignItems:'center',flex:1,minHeight:220}}>
            <DonutChart slices={statusSlices} centerLabel="總訂單"/>
          </div>
        </div>

        {/* 工程師負荷 HBar */}
        <div style={CARD}>
          <div style={CARD_HEAD}>
            <span style={CARD_TITLE}>工程師負荷</span>
            <span style={CARD_BADGE}>HORIZONTAL BAR</span>
          </div>
          <div style={{display:'flex',alignItems:'center',flex:1,minHeight:220}}>
            <HBarChart items={engItems} colorFn={(item,i)=>ENG_COLORS[i%ENG_COLORS.length]}/>
          </div>
        </div>

        {/* 進度分布 VBar */}
        <div style={CARD}>
          <div style={CARD_HEAD}>
            <span style={CARD_TITLE}>進度分布</span>
            <span style={CARD_BADGE}>VERTICAL BAR</span>
          </div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',flex:1,minHeight:220}}>
            <VBarChart items={progItems} colorFn={(item,i)=>MACH_COLORS[i%MACH_COLORS.length]}/>
          </div>
        </div>
      </div>

      {/* 自由分析 */}
      <div style={{display:'flex',alignItems:'baseline',gap:10,padding:'4px 0 14px'}}>
        <span style={{fontSize:14,fontWeight:700,color:'var(--ink)'}}>自由分析</span>
        <span style={{fontSize:10.5,color:'var(--ink-4)',fontFamily:'var(--font-mono)',letterSpacing:'0.06em',textTransform:'uppercase'}}>CUSTOM — 選擇維度與圖表類型</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16}}>
        <CustomChart idx={0}/>
        <CustomChart idx={1}/>
        <CustomChart idx={2}/>
      </div>
    </div>
  );
}
window.DashboardView = DashboardView;
</script>

<!-- ⑦ 主 App -->
<script type="text/babel" data-presets="react">
const { useState: useStateApp, useEffect: useEffectApp } = React;

function LoginPage({ onLogin }) {
  const [email, setEmail] = useStateApp('');
  const [pw, setPw] = useStateApp('');
  const [err, setErr] = useStateApp('');
  const [busy, setBusy] = useStateApp(false);

  const submit = async (e) => {
    e.preventDefault();
    if (!email || !pw) { setErr('請填寫帳號與密碼'); return; }
    setBusy(true); setErr('');
    try {
      const cred = await FBAuth.signIn(email, pw);
      const user = await FBAuth.getUser(cred.user.uid);
      if (!user || !user.active) { await FBAuth.signOut(); setErr('帳號未啟用，請聯絡管理員'); setBusy(false); return; }
      onLogin(user);
    } catch(ex) {
      setErr('帳號或密碼錯誤');
      setBusy(false);
    }
  };

  return (
    <div className="login-page">
      <div className="login-card">
        <div className="login-brand">
          <div className="login-brand-mark"/>
          <h1>3D 列印管理平台</h1>
          <p>SWTC · PORTAL v3</p>
        </div>
        {err && <div className="login-err show">{err}</div>}
        <form onSubmit={submit}>
          <div className="login-fg"><label>電子郵件</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com" autoFocus/></div>
          <div className="login-fg"><label>密碼</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••"/></div>
          <button className="login-submit" type="submit" disabled={busy}>{busy?'登入中...':'登入'}</button>
        </form>
      </div>
    </div>
  );
}

/* 使用者 Modal — 獨立元件，使用 React.useState 避免 Hooks alias 問題 */
function UserModal({ item, onClose, onSaved }) {
  const PERMS   = window.PERMS_MAP   || {};
  const PRESETS = window.ROLE_PRESETS || {};
  const INP = { width:'100%', padding:'8px 11px', border:'1.5px solid #e6e8ec', borderRadius:6, fontSize:13, fontFamily:'inherit', outline:'none' };
  const LBL = { display:'block', fontSize:11.5, fontWeight:600, color:'#5a6270', marginBottom:5 };

  const empty = { displayName:'', email:'', password:'', permissions:['view_board','view_issues'], active:true };
  const [form, setForm] = React.useState(item ? {...item, password:''} : empty);
  const [busy, setBusy] = React.useState(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const togglePerm = p => set('permissions', form.permissions.includes(p) ? form.permissions.filter(x=>x!==p) : [...form.permissions,p]);
  const applyPreset = role => set('permissions', PRESETS[role]||[]);

  const save = async () => {
    if (!form.displayName || !form.email) { showToast('請填姓名與 Email','err'); return; }
    if (!item && !form.password) { showToast('請設定密碼','err'); return; }
    setBusy(true);
    try {
      if (item) {
        await FBAuth.updateUser(item._id, { displayName:form.displayName, permissions:form.permissions, active:form.active });
        showToast('已更新 ✓');
      } else {
        await FBAuth.createUser(form.email, form.password, { displayName:form.displayName, email:form.email, permissions:form.permissions, active:form.active });
        showToast('已新增 ✓');
      }
      onSaved && onSaved();
      onClose();
    } catch(e) { showToast(e.message||'失敗','err'); }
    finally { setBusy(false); }
  };

  return (
    <div className="m-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="m-box" style={{width:560}}>
        <div className="m-hd"><h3>{item?'✏️ 編輯使用者':'➕ 新增使用者'}</h3><button className="m-close" onClick={onClose}>×</button></div>
        <div className="m-body">
          <div className="m-row">

          </div>

            <label style={LBL}>啟用狀態</label>
            <div className="seg" style={{marginTop:4}}>
              {[true,false].map(v=><button key={String(v)} className={`seg-btn${form.active===v?' active':''}`} onClick={()=>set('active',v)}>{v?'✅ 啟用':'⛔ 停用'}</button>)}
            </div>
          </div>
          <div className="m-field">
            <label style={LBL}>角色快速套用</label>
            <div className="preset-row">
              {[['admin','p-admin','管理員'],['manager','p-mgr','主管'],['operator','p-eng','工程師'],['viewer','p-view','查閱']].map(([r,cls,l])=>(
                <button key={r} className={`preset-chip ${cls}`} onClick={()=>applyPreset(r)}>{l}</button>
              ))}
            </div>
          </div>
          <div className="m-field">
            <label style={LBL}>個別權限</label>
            <div className="perm-grid">
              {Object.entries(PERMS).map(([p,label])=>(
                <label key={p} className={`perm-chip${form.permissions.includes(p)?' on':''}`}>
                  <input type="checkbox" checked={form.permissions.includes(p)} onChange={()=>togglePerm(p)}/>{label}
                </label>
              ))}
            </div>
          </div>
        </div>
        <div className="m-foot">
          <button className="btn-cancel" onClick={onClose}>取消</button>
          <button className="btn-save" onClick={save} disabled={busy}>{busy?'儲存中...':'💾 儲存'}</button>
        </div>
      </div>
    </div>
  );
}

/* 管理員後台 */
function AdminPanel({ user }) {
  const K = window.K;
  const [sub, setSub] = React.useState('users');
  const [users, setUsers] = React.useState([]);
  const [settings, setSettings] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [userModal, setUserModal] = React.useState(false);
  const [editUser, setEditUser] = React.useState(null);
  const [engList, setEngList] = React.useState(null);
  const [machList, setMachList] = React.useState(null);

  const INP = { width:'100%', padding:'8px 11px', border:'1.5px solid #e6e8ec', borderRadius:6, fontSize:13, fontFamily:'inherit', outline:'none' };
  const LBL = { display:'block', fontSize:11.5, fontWeight:600, color:'#5a6270', marginBottom:5 };

  React.useEffect(() => {
    (async () => {
      const [us, st] = await Promise.all([FBAuth.getUsers(), FBSettings.get()]);
      setUsers(us);
      const s = st || { engineers: K.ENG_ORDER.map(k=>({key:k,label:K.ENG_LABEL[k]})), machines: K.MACHINES.map(m=>({name:m})) };
      setSettings(s);
      setEngList(s.engineers || K.ENG_ORDER.map(k=>({key:k,label:K.ENG_LABEL[k]})));
      setMachList(s.machines  || K.MACHINES.map(m=>({name:m})));
      setLoading(false);
    })();
  }, []);

  const refreshUsers = async () => { const us = await FBAuth.getUsers(); setUsers(us); };

  const saveSettings = async () => {
    const s = { engineers: engList, machines: machList };
    await FBSettings.save(s);
    window.applySettings(s);
    showToast('設定已儲存 ✓');
  };

  if (loading) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:300,color:'#8a93a3',fontSize:14}}>⏳ 載入中...</div>;

  return (
    <div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0}}>
      <div className="shell-top">
        <nav className="shell-tabs" role="tablist">
          {[['users','👥 使用者'],['settings','⚙️ 設定']].map(([k,l])=>(
            <button key={k} role="tab" aria-selected={sub===k} className="shell-tab" onClick={()=>setSub(k)}>{l}</button>
          ))}
        </nav>
        <div className="shell-spacer"/>
        <div className="shell-aux">ADMIN</div>
      </div>
      <div className="shell-body" style={{flex:1,minHeight:0,overflowY:'auto',padding:'20px 28px'}}>
        {sub==='users'&&(
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <h2 style={{fontSize:16,fontWeight:700}}>使用者管理</h2>
              <button className="btn-add" onClick={()=>{setEditUser(null);setUserModal(true);}}>+ 新增使用者</button>
            </div>
            <table className="u-tbl">
              <thead><tr><th>使用者</th><th>Email</th><th>權限</th><th>狀態</th><th>操作</th></tr></thead>
              <tbody>
                {users.map(u=>(
                  <tr key={u._id}>
                    <td><div style={{display:'flex',alignItems:'center',gap:10}}><div className="u-avatar">{(u.displayName||'?').slice(0,1)}</div>{u.displayName}</div></td>
                    <td style={{color:'#5a6270',fontSize:12}}>{u.email}</td>
                    <td>
                      {u.permissions?.includes('admin')
                        ? <span className="role-chip admin">管理員</span>
                        : u.permissions?.includes('edit_board')
                          ? <span className="role-chip operator">工程師</span>
                          : <span className="role-chip viewer">查閱</span>
                      }
                    </td>
                    <td><span className={`st-dot${u.active?' on':' off'}`}>{u.active?'● 啟用':'● 停用'}</span></td>
                    <td>
                      <span className="kt-act">
                        <button className="kt-actbtn" onClick={()=>{setEditUser(u);setUserModal(true);}}>✎</button>
                        <button className="kt-actbtn danger" onClick={async()=>{ if(!confirm('確定刪除？'))return; await FBAuth.deleteUser(u._id); await refreshUsers(); showToast('已刪除','inf'); }}>✕</button>
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
        {sub==='settings'&&engList&&machList&&(
          <div style={{maxWidth:600}}>
            <h2 style={{fontSize:16,fontWeight:700,marginBottom:20}}>系統設定</h2>
            <div style={{marginBottom:24}}>
              <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>工程師清單</div>
              {engList.map((e,i)=>(
                <div key={i} style={{display:'flex',gap:8,marginBottom:8,alignItems:'center'}}>
                  <input style={{...INP,width:120}} placeholder="Key (英文)" value={e.key} onChange={ev=>{const l=[...engList];l[i]={...l[i],key:ev.target.value};setEngList(l);}}/>
                  <input style={{...INP,flex:1}} placeholder="顯示名稱" value={e.label} onChange={ev=>{const l=[...engList];l[i]={...l[i],label:ev.target.value};setEngList(l);}}/>
                  <button className="kt-actbtn danger" onClick={()=>setEngList(engList.filter((_,j)=>j!==i))}>✕</button>
                </div>
              ))}
              <button className="btn-cancel" style={{marginTop:4}} onClick={()=>setEngList([...engList,{key:'',label:''}])}>+ 新增工程師</button>
            </div>
            <div style={{marginBottom:24}}>
              <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>機台清單</div>
              {machList.map((m,i)=>(
                <div key={i} style={{display:'flex',gap:8,marginBottom:8,alignItems:'center'}}>
                  <input style={{...INP,flex:1}} placeholder="機台名稱" value={m.name} onChange={ev=>{const l=[...machList];l[i]={...l[i],name:ev.target.value};setMachList(l);}}/>
                  <button className="kt-actbtn danger" onClick={()=>setMachList(machList.filter((_,j)=>j!==i))}>✕</button>
                </div>
              ))}
              <button className="btn-cancel" style={{marginTop:4}} onClick={()=>setMachList([...machList,{name:''}])}>+ 新增機台</button>
            </div>
            <button className="btn-save" style={{padding:'0 24px',height:38}} onClick={saveSettings}>💾 儲存設定</button>
          </div>
        )}
      </div>
      {userModal&&<UserModal item={editUser} onClose={()=>setUserModal(false)} onSaved={refreshUsers}/>}
    </div>
  );
}

      icon:<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="6" r="3" stroke="currentColor" strokeWidth="1.4"/><path d="M3 15c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>,
      show: true },
  ].filter(n => n.show);

  return (
    <div className="shell">
      <aside className="shell-sidebar">
        <div className="sidebar-brand">
          <div className="shell-brand-mark"/>
          <div>
            <div className="shell-brand-title">3D 列印平台</div>
            <div className="shell-brand-sub">SWTC · PORTAL</div>
          </div>
        </div>
        <nav className="sidebar-nav">
          {NAV.map(n=>(
            <button key={n.key} className="sidebar-item" aria-selected={page===n.key} onClick={()=>setPage(n.key)}>
              <span className="sidebar-item-icon">{n.icon}</span>
              <div className="sidebar-item-text">
                <span className="sidebar-item-label">{n.label}</span>
                <span className="sidebar-item-sub">{n.sub}</span>
              </div>
            </button>
          ))}
        </nav>
        <div className="sidebar-foot">
          <span style={{color:'var(--ink-2)',fontWeight:600}}>{user.displayName}</span>
          <span className="sidebar-foot-date">{dateStr}</span>
          <span style={{fontSize:9,color:'#8a93a3',wordBreak:'break-all',fontFamily:'monospace'}}>
            perms: {JSON.stringify(user.permissions)}
          </span>
          <button onClick={onLogout} style={{marginTop:6,background:'none',border:'1px solid var(--line)',borderRadius:5,padding:'4px 10px',fontSize:11,cursor:'pointer',color:'var(--ink-3)',fontFamily:'inherit'}}>登出</button>
        </div>
      </aside>
      <main className="shell-main">
        {page==='workboard' && <window.WorkBoardApp user={user}/>}
        {page==='issues'    && <window.IssuesApp    user={user}/>}
        {page==='samples'   && <SamplesPanel/>}
        {page==='admin'     && <AdminPanel          user={user}/>}
      </main>
    </div>
  );
}

/* Root App */
function App() {
  const [user, setUser] = useStateApp(null);
  const [checking, setChecking] = useStateApp(true);

  useEffectApp(() => {
    // 監聽設定
    const unsubSettings = FBSettings.onSnapshot(s => {
      if (s) window.applySettings(s);
    });
    // 監聽登入狀態
    const unsubAuth = FBAuth.onStateChanged(async fbUser => {
      if (fbUser) {
        const u = await FBAuth.getUser(fbUser.uid);
        if (u && u.active) { setUser(u); }
        else { await FBAuth.signOut(); setUser(null); }
      } else { setUser(null); }
      setChecking(false);
    });
    return () => { unsubAuth(); unsubSettings(); };
  }, []);

  if (checking) return (
    <div style={{position:'fixed',inset:0,background:'linear-gradient(135deg,#0a0e14,#131c2e)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:14,fontFamily:'JetBrains Mono,monospace'}}>
      載入中...
    </div>
  );

  if (!user) return <LoginPage onLogin={setUser}/>;
  return <Shell user={user} onLogout={async()=>{ await FBAuth.signOut(); setUser(null); }}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
(function(){
'use strict';
// ── GitHub config ──
const GH_USER = 'Coffee-Who';
const GH_REPO = '3dprinter';
const GH_PATH_DATA = 'image/samples.json';
const GH_PATH_IMG  = 'image/';
const GH_RAW = `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/${GH_PATH_DATA}`;
const LS_DATA  = 'sw_samples_v3';
const LS_TOKEN = 'sw_gh_token_v3';
const LS_BORROW = 'sw_borrowers_v3';

let GH_TOKEN = localStorage.getItem(LS_TOKEN) || '';
let samples = [];
let returnHistory = [];
let borrowers = JSON.parse(localStorage.getItem(LS_BORROW) || '[]') || ['王小明','李美華','張大偉','陳怡君','林志豪'];
let nid = 1;
let currentPeriod = 'month';
let colWidths = [2,1.4,1.2,0.8,1];  // fr units for borrow table

const today = () => new Date().toISOString().slice(0,10);
const daysBetween = (d1,d2) => {
  if(!d1) return 0;
  const end = d2 ? new Date(d2) : new Date();
  return Math.max(0, Math.round((end - new Date(d1)) / 86400000));
};

// ── Sync indicator ──
function setSyncState(state, txt) {
  const pill = document.getElementById('sync-pill');
  pill.className = 'sync-pill ' + state;
  document.getElementById('sync-txt').textContent = txt;
}

// ── Load from GitHub ──
async window.smLoad = async function() {
  setSyncState('spin','連線中…');
  try {
    const r = await fetch(GH_RAW + '?t=' + Date.now(), {cache:'no-store'});
    if (r.ok) {
      const d = await r.json();
      applyData(d);
      localStorage.setItem(LS_DATA, JSON.stringify(d));
      setSyncState('ok','已同步 GitHub');
      return;
    }
  } catch(e) {}
  const cache = localStorage.getItem(LS_DATA);
  if (cache) {
    try { applyData(JSON.parse(cache)); setSyncState('err','使用本機快取'); return; } catch(e) {}
  }
  setSyncState('err','無法載入');
}

function applyData(d) {
  samples = d.samples || [];
  returnHistory = d.returnHistory || [];
  borrowers = d.borrowers || borrowers;
  nid = samples.length ? Math.max(...samples.map(s=>s.id||0)) + 1 : 1;
  localStorage.setItem(LS_BORROW, JSON.stringify(borrowers));
  smRenderAll();
}

// ── Save to GitHub ──
async function saveToGH() {
  const payload = { samples, returnHistory, borrowers, updatedAt: new Date().toISOString() };
  localStorage.setItem(LS_DATA, JSON.stringify(payload));
  if (!GH_TOKEN) { setSyncState('err','未設定 Token，已存本機'); return; }
  setSyncState('spin','儲存中…');
  const json = JSON.stringify(payload, null, 2);
  let sha = '';
  try {
    const r = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${GH_PATH_DATA}`,
      { headers: { Authorization:`token ${GH_TOKEN}`, Accept:'application/vnd.github.v3+json' }});
    if (r.ok) { sha = (await r.json()).sha; }
  } catch(e) {}
  try {
    const r = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${GH_PATH_DATA}`, {
      method:'PUT',
      headers:{ Authorization:`token ${GH_TOKEN}`, 'Content-Type':'application/json', Accept:'application/vnd.github.v3+json' },
      body: JSON.stringify({ message:`Samples update ${new Date().toISOString().slice(0,19)}`, content: btoa(unescape(encodeURIComponent(json))), ...(sha?{sha}:{}) })
    });
    if (r.ok) { setSyncState('ok','已同步 GitHub ✓'); return; }
  } catch(e) {}
  setSyncState('err','GitHub 失敗，已存本機');
}

// ── Upload image to GitHub ──
async function uploadImageToGH(filename, base64data) {
  if (!GH_TOKEN) { smToast('請先設定 GitHub Token','err'); return null; }
  const mediaType = base64data.split(';')[0].split(':')[1];
  const b64 = base64data.split(',')[1];
  const path = GH_PATH_IMG + filename;
  let sha = '';
  try {
    const r = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${path}`,
      { headers:{ Authorization:`token ${GH_TOKEN}`, Accept:'application/vnd.github.v3+json' }});
    if (r.ok) sha = (await r.json()).sha;
  } catch(e) {}
  try {
    const r = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${path}`, {
      method:'PUT',
      headers:{ Authorization:`token ${GH_TOKEN}`, 'Content-Type':'application/json', Accept:'application/vnd.github.v3+json' },
      body: JSON.stringify({ message:`Upload ${filename}`, content: b64, ...(sha?{sha}:{}) })
    });
    if (r.ok) {
      return `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/${path}`;
    }
  } catch(e) {}
  return null;
}

// ── Render all ──
function smRenderAll() {
  renderCards();
  renderBorrowTable();
  renderReturnTable();
  renderDashboard();
  updateStats();
  updateSubtitle();
}

function updateStats() {
  const bw = samples.filter(s=>s.st==='borrowed').length;
  const av = samples.filter(s=>s.st==='available').length;
  document.getElementById('stat-bw').textContent = bw;
  document.getElementById('stat-av').textContent = av;
  document.getElementById('stat-tot').textContent = samples.length;
}

function updateSubtitle() {
  document.querySelector('.pg-sub').textContent =
    `實威國際 · 統一管理借用紀錄，同步至 GitHub · ${samples.length} 樣品`;
}

// ── Render cards ──
function renderCards() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const sf = document.getElementById('status-filter').value;
  const cg = document.getElementById('cg');
  const filtered = samples.filter(s => {
    if (q && !s.name.toLowerCase().includes(q)) return false;
    if (sf && s.st !== sf) return false;
    return true;
  });
  if (!filtered.length) {
    cg.innerHTML = '<div style="padding:32px 0;text-align:center;color:var(--t4);font-size:13px">沒有符合條件的樣品</div>';
    return;
  }
  cg.innerHTML = filtered.map(s => cardHTML(s)).join('');
}

function cardHTML(s) {
  const isBw = s.st === 'borrowed';
  const img = s.img
    ? `<img src="${s.img}" alt="${s.name}" onclick="openLB('${s.img}')" loading="lazy">`
    : `<span class="ph">🖨️</span>`;
  const foot = isBw
    ? `<div class="footrow">
        <span style="font-size:10px;font-weight:700;color:var(--t1)">👤 ${s.bw||''}</span>
        <button class="cfbtn" style="background:var(--teal-bg);border-color:var(--teal);color:var(--teal)" onclick="openEdit(${s.id})">✏️ 編輯</button>
        <button class="cfbtn ret" onclick="openReturn(${s.id})">📥 歸還</button>
       </div>`
    : `<div class="footrow">
        <select class="fsel" id="sel-${s.id}"><option value="">選擇借用人</option>${borrowers.map(b=>`<option>${b}</option>`).join('')}</select>
        <input type="date" class="fdate" id="bd-${s.id}" value="${today()}">
        <button class="cfbtn" onclick="openBorrow(${s.id})">借出</button>
        <button class="cfbtn" style="background:var(--line-soft);border-color:var(--line);color:var(--t3);padding:4px 7px" onclick="openEdit(${s.id})" title="編輯樣品資料">✏️</button>
       </div>`;
  return `<div class="card" id="card-${s.id}">
    <div class="card-img">
      ${img}
      <div class="sp-pill ${isBw?'sp-bw':'sp-av'}">${isBw?'借出中':'在庫'}</div>
      <label class="upload-btn" title="上傳照片">📷<input type="file" accept="image/*" onchange="uploadCardImg(event,${s.id})"></label>
    </div>
    <div class="card-body">
      <div class="card-name" onclick="openEdit(${s.id})" style="cursor:pointer" title="點擊編輯">${s.name}</div>
      <div class="card-desc">${s.desc||''}</div>
      ${isBw?`<div class="mrow"><span class="ml">借出人</span><span class="mv rd">${s.bw}</span></div>
              <div class="mrow"><span class="ml">借出日</span><span class="mv">${s.bd||''}</span></div>
              ${s.rd?`<div class="mrow"><span class="ml">歸還日</span><span class="mv" style="color:var(--green)">${s.rd}</span></div>`:''}
             `
             :`<div class="mrow"><span class="ml">借出人</span><span class="mv">—</span></div>`}
      ${s.note?`<div class="note-box">📝 ${s.note}</div>`:''}
    </div>
    <div class="card-foot">${foot}</div>
  </div>`;
}

// ── Borrow table ──
function renderBorrowTable() {
  const borrowed = samples.filter(s => s.st === 'borrowed');
  const fw = colWidths.map(w=>w+'fr').join(' ') + ' 80px';
  document.getElementById('borrow-head').style.gridTemplateColumns = fw;
  document.getElementById('borrow-head').innerHTML =
    ['樣品名稱','借用人','借出日期','天數','操作'].map((h,i) =>
      i < 4
        ? `<div>${h}<span class="ri">⠿</span><div class="resize-handle" data-col="${i}" onmousedown="startResize(event,${i})"></div></div>`
        : `<div>${h}</div>`
    ).join('');
  const body = document.getElementById('borrow-body');
  if (!borrowed.length) {
    body.innerHTML = '<div style="padding:18px;text-align:center;color:var(--t4);font-size:12px">目前無借出中樣品</div>';
    return;
  }
  body.innerHTML = borrowed.map(s => {
    const d = daysBetween(s.bd, '');
    return `<div class="at-row" style="grid-template-columns:${fw}">
      <div class="at-name">${s.name} <span class="chip chip-bw">借出中</span></div>
      <div style="font-weight:700">${s.bw||'—'}</div>
      <div style="color:var(--t3)">${s.bd||'—'}</div>
      <div class="${d>30?'days-red':''}">${d} 天</div>
      <div style="display:flex;gap:4px;align-items:center">
        <button class="tbl-edit-btn" onclick="openEdit(${s.id})">✏️ 編輯</button>
      </div>
    </div>`;
  }).join('');
}

// ── Return history table ──
function renderReturnTable() {
  const body = document.getElementById('return-body');
  if (!returnHistory.length) {
    body.innerHTML = '<div style="padding:18px;text-align:center;color:var(--t4);font-size:12px">尚無歸還紀錄</div>';
    return;
  }
  body.innerHTML = [...returnHistory].reverse().map(r => `
    <div class="at-row th5" style="min-width:500px">
      <div style="font-weight:700">${r.name}</div>
      <div>${r.bw}</div>
      <div style="color:var(--t3)">${r.bd}</div>
      <div style="color:var(--green);font-weight:600">${r.rd}</div>
      <div style="color:var(--t3)">${daysBetween(r.bd,r.rd)} 天</div>
    </div>`).join('');
}

// ── Column resize ──
let resizeState = null;
function startResize(e, colIdx) {
  e.preventDefault();
  resizeState = { colIdx, startX: e.clientX, startWidths: [...colWidths] };
  document.addEventListener('mousemove', doResize);
  document.addEventListener('mouseup', endResize);
  e.currentTarget.classList.add('active');
}
function doResize(e) {
  if (!resizeState) return;
  const dx = e.clientX - resizeState.startX;
  const totalW = document.querySelector('.at-head').offsetWidth;
  const frUnit = totalW / resizeState.startWidths.reduce((a,b)=>a+b,0);
  const delta = dx / frUnit;
  const newWidths = [...resizeState.startWidths];
  newWidths[resizeState.colIdx] = Math.max(0.4, newWidths[resizeState.colIdx] + delta);
  if (resizeState.colIdx + 1 < newWidths.length) {
    newWidths[resizeState.colIdx+1] = Math.max(0.4, resizeState.startWidths[resizeState.colIdx+1] - delta);
  }
  colWidths = newWidths;
  const fw = colWidths.map(w=>w+'fr').join(' ');
  document.getElementById('borrow-head').style.gridTemplateColumns = fw;
  document.querySelectorAll('#borrow-body .at-row').forEach(r => r.style.gridTemplateColumns = fw);
}
function endResize() {
  resizeState = null;
  document.removeEventListener('mousemove', doResize);
  document.removeEventListener('mouseup', endResize);
  document.querySelectorAll('.resize-handle').forEach(h => h.classList.remove('active'));
}

// ── Tab switch ──
function switchTab(name) {
  document.getElementById('tab-samples').classList.toggle('on', name==='samples');
  document.getElementById('tab-dashboard').classList.toggle('on', name==='dashboard');
  document.getElementById('panel-samples').style.display = name==='samples' ? '' : 'none';
  document.getElementById('panel-dashboard').style.display = name==='dashboard' ? '' : 'none';
  if (name === 'dashboard') renderDashboard();
}

// ── Card size ──
function setSize(sz, btn) {
  document.querySelectorAll('.sbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('cg').className = 'cg sz-' + sz;
}

// ── Add / Edit modal ──
function openAdd() {
  document.getElementById('edit-id').value = '';
  document.getElementById('modal-title').textContent = '➕ 新增樣品';
  document.getElementById('f-name').value = '';
  document.getElementById('f-desc').value = '';
  document.getElementById('f-note').value = '';
  document.getElementById('f-imgurl').value = '';
  document.getElementById('f-imgprev').style.display = 'none';
  document.getElementById('btn-del').style.display = 'none';
  document.getElementById('borrow-edit-section').style.display = 'none';
  const fi = document.getElementById('f-imgfile');
  if (fi) fi._b64 = null;
  document.getElementById('mo-add').classList.add('on');
}

function openEdit(id) {
  const s = samples.find(x => x.id === id);
  if (!s) return;
  document.getElementById('edit-id').value = id;
  document.getElementById('modal-title').textContent = '✏️ 編輯樣品';
  document.getElementById('f-name').value = s.name;
  document.getElementById('f-desc').value = s.desc || '';
  document.getElementById('f-note').value = s.note || '';
  document.getElementById('f-imgurl').value = s.img || '';
  const prev = document.getElementById('f-imgprev');
  if (s.img) { prev.src = s.img; prev.style.display = 'block'; } else { prev.style.display = 'none'; }
  document.getElementById('btn-del').style.display = 'block';
  const fi = document.getElementById('f-imgfile');
  if (fi) fi._b64 = null;

  // ── 借用狀態欄位 ──
  document.getElementById('borrow-edit-section').style.display = 'block';
  document.getElementById('f-status').value = s.st || 'available';

  // 填充借用人選單
  const bwSel = document.getElementById('f-bw');
  bwSel.innerHTML = '<option value="">選擇借用人</option>' +
    borrowers.map(b => `<option value="${b}"${s.bw===b?' selected':''}>${b}</option>`).join('');
  document.getElementById('f-bw-manual').value = '';
  document.getElementById('f-bd').value = s.bd || '';
  document.getElementById('f-rd').value = s.rd || '';

  // 顯示/隱藏借用欄位
  document.getElementById('f-borrow-fields').style.display =
    (s.st === 'borrowed') ? 'block' : 'none';

  document.getElementById('mo-add').classList.add('on');
}

function onStatusChange() {
  const st = document.getElementById('f-status').value;
  document.getElementById('f-borrow-fields').style.display =
    st === 'borrowed' ? 'block' : 'none';
}

function closeAdd() {
  document.getElementById('mo-add').classList.remove('on');
}

function previewImg(url) {
  const p = document.getElementById('f-imgprev');
  if (url) { p.src = url; p.style.display = 'block'; } else { p.style.display = 'none'; }
}

function handleImgUpload(inp) {
  if (!inp.files[0]) return;
  const r = new FileReader();
  r.onload = e => {
    inp._b64 = e.target.result;
    previewImg(e.target.result);
    document.getElementById('f-imgurl').value = '';
  };
  r.readAsDataURL(inp.files[0]);
}

async function saveCard() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { smToast('請填寫樣品名稱','err'); return; }
  const desc  = document.getElementById('f-desc').value.trim();
  const note  = document.getElementById('f-note').value.trim();
  let   img   = document.getElementById('f-imgurl').value.trim();
  const fileInp = document.getElementById('f-imgfile');

  // 上傳照片
  if (fileInp._b64 && !img) {
    smToast('上傳照片中…','inf');
    const ext  = fileInp._b64.split(';')[0].split('/')[1];
    const fname = `sample_${Date.now()}.${ext}`;
    const url   = await uploadImageToGH(fname, fileInp._b64);
    img = url || fileInp._b64;
    fileInp._b64 = null;
    if (url) smToast('照片已上傳','ok');
  }

  const editId = document.getElementById('edit-id').value;

  if (editId) {
    // ── 編輯既有樣品 ──
    const s = samples.find(x => x.id === +editId);
    if (!s) return;

    const newSt = document.getElementById('f-status').value;
    const manualBw = document.getElementById('f-bw-manual').value.trim();
    const selBw    = document.getElementById('f-bw').value;
    const newBw    = manualBw || selBw;
    const newBd    = document.getElementById('f-bd').value;
    const newRd    = document.getElementById('f-rd').value;

    // 若狀態從借出 → 在庫，且填了歸還日期，自動寫入歷史
    if (s.st === 'borrowed' && newSt === 'available' && s.bw) {
      const rd = newRd || today();
      const already = returnHistory.some(r => r.name===s.name && r.bd===s.bd && r.bw===s.bw);
      if (!already) {
        returnHistory.push({ name:s.name, bw:s.bw, bd:s.bd, rd });
      }
    }

    // 更新樣品資料
    s.name = name; s.desc = desc; s.note = note; s.img = img;
    s.st   = newSt;

    if (newSt === 'borrowed') {
      if (!newBw) { smToast('請選擇或輸入借用人','err'); return; }
      s.bw = newBw;
      s.bd = newBd || today();
      s.rd = newRd || '';
    } else {
      // 在庫：清空借用欄（歸還日期保留記錄）
      s.bw = ''; s.bd = ''; s.rd = newRd || '';
    }

  } else {
    // ── 新增樣品 ──
    samples.push({ id:nid++, name, desc, note, img, st:'available', bw:'', bd:'', rd:'' });
  }

  closeAdd();
  smRenderAll();
  await saveToGH();
  smToast(editId ? '已更新 ✓' : '已新增 ✓', 'ok');
}

async function deleteCard() {
  const id = +document.getElementById('edit-id').value;
  if (!confirm('確定刪除此樣品？')) return;
  samples = samples.filter(s => s.id !== id);
  closeAdd();
  smRenderAll();
  await saveToGH();
  smToast('已刪除','ok');
}

// ── Upload image from card hover button ──
async function uploadCardImg(e, id) {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = async ev => {
    const b64 = ev.target.result;
    smToast('上傳照片中…','inf');
    const ext = b64.split(';')[0].split('/')[1];
    const fname = `sample_${id}_${Date.now()}.${ext}`;
    let url = await uploadImageToGH(fname, b64);
    if (!url) url = b64;
    const s = samples.find(x => x.id === id);
    if (s) { s.img = url; }
    renderCards();
    await saveToGH();
    smToast('照片已更新 ✓','ok');
  };
  r.readAsDataURL(file);
}

// ── Borrow modal ──
function openBorrow(id) {
  document.getElementById('borrow-sample-id').value = id;
  const sel = document.getElementById('borrow-person');
  sel.innerHTML = '<option value="">選擇借用人</option>' + borrowers.map(b=>`<option>${b}</option>`).join('');
  const card = document.getElementById(`bd-${id}`);
  document.getElementById('borrow-date').value = card ? card.value : today();
  document.getElementById('mo-borrow').classList.add('on');
}
function closeBorrow() { document.getElementById('mo-borrow').classList.remove('on'); }
async function confirmBorrow() {
  const id = +document.getElementById('borrow-sample-id').value;
  const bw = document.getElementById('borrow-person').value;
  const bd = document.getElementById('borrow-date').value;
  if (!bw) { smToast('請選擇借用人','err'); return; }
  if (!bd) { smToast('請選擇借出日期','err'); return; }
  const s = samples.find(x => x.id === id);
  if (s) { s.st = 'borrowed'; s.bw = bw; s.bd = bd; s.rd = ''; }
  closeBorrow();
  smRenderAll();
  await saveToGH();
  smToast(`✅ ${s?.name} 已借出給 ${bw}`,'ok');
}

// ── Return modal ──
function openReturn(id) {
  document.getElementById('return-sample-id').value = id;
  document.getElementById('return-date').value = today();
  document.getElementById('mo-return').classList.add('on');
}
function closeReturn() { document.getElementById('mo-return').classList.remove('on'); }
async function confirmReturn() {
  const id = +document.getElementById('return-sample-id').value;
  const rd = document.getElementById('return-date').value;
  if (!rd) { smToast('請選擇歸還日期','err'); return; }
  const s = samples.find(x => x.id === id);
  if (s) {
    returnHistory.push({ name:s.name, bw:s.bw, bd:s.bd, rd });
    s.st = 'available'; s.rd = rd; s.bw = ''; s.bd = '';
  }
  closeReturn();
  smRenderAll();
  await saveToGH();
  smToast(`✅ ${s?.name} 已歸還`,'ok');
}

// ── Lightbox ──
function openLB(src) { document.getElementById('lb-img').src = src; document.getElementById('lb').classList.add('on'); }
function closeLB() { document.getElementById('lb').classList.remove('on'); }

// ── Token ──
function saveToken() {
  const t = document.getElementById('token-inp').value.trim();
  if (!t) return;
  GH_TOKEN = t;
  localStorage.setItem(LS_TOKEN, t);
  document.getElementById('mo-token').classList.remove('on');
  smToast('Token 已儲存','ok');
  window.smLoad();
}

// ── Toast ──
function smToast(msg, type='ok') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ── Export Excel ──
function exportExcel() {
  const rows = [['樣品名稱','借用人','借出日期','歸還日期','借用天數']];
  returnHistory.forEach(r => rows.push([r.name, r.bw, r.bd, r.rd, daysBetween(r.bd,r.rd)]));
  samples.filter(s=>s.st==='borrowed').forEach(s => rows.push([s.name, s.bw, s.bd, '（借出中）', daysBetween(s.bd,'')]));
  const ws = rows.map(r => r.join('\t')).join('\n');
  const blob = new Blob(['\ufeff' + ws], {type:'text/tab-separated-values;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `借用紀錄_${today()}.xls`;
  a.click();
  smToast('Excel 已下載','ok');
}

// ── Dashboard ──
function setPeriod(p) {
  currentPeriod = p;
  ['month','quarter','year'].forEach(k => {
    document.getElementById('pb-'+k).classList.toggle('on', k===p);
  });
  renderDashboard();
}

function renderDashboard() {
  const now = new Date();
  const allEvents = [
    ...returnHistory.map(r => ({date:r.bd, type:'borrow', days:daysBetween(r.bd,r.rd)})),
    ...samples.filter(s=>s.st==='borrowed').map(s => ({date:s.bd, type:'borrow', days:daysBetween(s.bd,'')}))
  ];

  // KPIs
  const outstanding = samples.filter(s=>s.st==='borrowed').length;
  const totalBorrow = allEvents.length;
  const totalReturn = returnHistory.length;
  const avgDays = returnHistory.length
    ? Math.round(returnHistory.reduce((a,r)=>a+daysBetween(r.bd,r.rd),0)/returnHistory.length)
    : 0;

  let trendLabels=[], trendValues=[], kpiLabel='', trendColor='var(--blue)';

  if (currentPeriod === 'month') {
    kpiLabel = '本月';
    trendColor = 'var(--blue)';
    const months = [];
    for (let i=5; i>=0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      months.push({ label: `${d.getMonth()+1}月`, year:d.getFullYear(), month:d.getMonth() });
    }
    trendLabels = months.map(m=>m.label);
    trendValues = months.map(m => allEvents.filter(e=>{
      if(!e.date) return false;
      const d = new Date(e.date);
      return d.getFullYear()===m.year && d.getMonth()===m.month;
    }).length);
    document.getElementById('kpi-total-lbl').textContent = '本月借出次數';
    document.getElementById('kpi-ret-lbl').textContent = '本月已歸還';
    document.getElementById('kpi-out-lbl').textContent = '累計未歸還';
    document.getElementById('kpi-avg-lbl').textContent = '平均借用天數';
    document.getElementById('trend-title').textContent = '📅 每月借出次數趨勢';
    const thisMon = trendValues[trendValues.length-1];
    const prevMon = trendValues[trendValues.length-2] || 0;
    document.getElementById('kpi-total').textContent = thisMon;
    setTrend('kpi-total-trend', thisMon - prevMon, '較上月');
    const thisRetMon = returnHistory.filter(r=>{const d=new Date(r.rd);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();}).length;
    document.getElementById('kpi-ret').textContent = thisRetMon;
    document.getElementById('kpi-ret-trend').textContent = '';
  } else if (currentPeriod === 'quarter') {
    trendColor = 'var(--teal)';
    const quarters = [];
    for (let i=3; i>=0; i--) {
      const qNum = Math.floor(now.getMonth()/3) - i;
      const y = now.getFullYear() + Math.floor(qNum/4);
      const q = ((qNum % 4) + 4) % 4;
      quarters.push({ label:`Q${q+1}`, year:y, q });
    }
    trendLabels = quarters.map(q=>q.label);
    trendValues = quarters.map(q => allEvents.filter(e=>{
      if(!e.date) return false;
      const d = new Date(e.date);
      return d.getFullYear()===q.year && Math.floor(d.getMonth()/3)===q.q;
    }).length);
    document.getElementById('kpi-total-lbl').textContent = '本季借出次數';
    document.getElementById('kpi-ret-lbl').textContent = '本季已歸還';
    document.getElementById('kpi-out-lbl').textContent = '季末未歸還';
    document.getElementById('kpi-avg-lbl').textContent = '平均借用天數';
    document.getElementById('trend-title').textContent = '📅 季度借出次數趨勢';
    const thisQ = trendValues[trendValues.length-1];
    const prevQ = trendValues[trendValues.length-2] || 0;
    document.getElementById('kpi-total').textContent = thisQ;
    setTrend('kpi-total-trend', thisQ - prevQ, '較上季');
    const curQ = Math.floor(now.getMonth()/3);
    const qRet = returnHistory.filter(r=>{const d=new Date(r.rd);return d.getFullYear()===now.getFullYear()&&Math.floor(d.getMonth()/3)===curQ;}).length;
    document.getElementById('kpi-ret').textContent = qRet;
    document.getElementById('kpi-ret-trend').textContent = '';
  } else {
    trendColor = 'var(--amber)';
    const years = [now.getFullYear()-3, now.getFullYear()-2, now.getFullYear()-1, now.getFullYear()];
    trendLabels = years.map(y=>String(y));
    trendValues = years.map(y => allEvents.filter(e=>{if(!e.date)return false;return new Date(e.date).getFullYear()===y;}).length);
    document.getElementById('kpi-total-lbl').textContent = '今年借出次數';
    document.getElementById('kpi-ret-lbl').textContent = '今年已歸還';
    document.getElementById('kpi-out-lbl').textContent = '年末未歸還';
    document.getElementById('kpi-avg-lbl').textContent = '平均借用天數';
    document.getElementById('trend-title').textContent = '📅 年度借出次數趨勢';
    const thisY = trendValues[trendValues.length-1];
    const prevY = trendValues[trendValues.length-2] || 0;
    document.getElementById('kpi-total').textContent = thisY;
    setTrend('kpi-total-trend', thisY - prevY, '較去年');
    const yRet = returnHistory.filter(r=>{const d=new Date(r.rd);return d.getFullYear()===now.getFullYear();}).length;
    document.getElementById('kpi-ret').textContent = yRet;
    document.getElementById('kpi-ret-trend').textContent = '';
  }

  document.getElementById('kpi-out').textContent = outstanding;
  document.getElementById('kpi-out-trend').textContent = outstanding > 3 ? '⚠️ 偏多' : '正常';
  document.getElementById('kpi-out-trend').className = 'kpi-trend ' + (outstanding > 3 ? 'trend-dn' : 'trend-up');
  document.getElementById('kpi-avg').textContent = avgDays;
  document.getElementById('kpi-avg-trend').textContent = avgDays > 30 ? '⚠️ 偏長' : avgDays ? '正常' : '—';

  // Trend chart
  const maxV = Math.max(...trendValues, 1);
  document.getElementById('trend-chart').innerHTML = trendLabels.map((lbl,i) => {
    const h = Math.round((trendValues[i]/maxV)*84);
    return `<div class="bar-col">
      <div class="bar-col-val">${trendValues[i]}</div>
      <div class="bar-col-fill" style="height:${h}px;background:${trendColor}"></div>
      <div class="bar-col-lbl">${lbl}</div>
    </div>`;
  }).join('');

  // Person chart
  const personCount = {};
  allEvents.forEach(e => {
    const bw = samples.find(s=>s.bd===e.date)?.bw || returnHistory.find(r=>r.bd===e.date)?.bw || '';
    if (bw) personCount[bw] = (personCount[bw]||0) + 1;
  });
  // direct count from data
  const pCount = {};
  returnHistory.forEach(r => { pCount[r.bw] = (pCount[r.bw]||0)+1; });
  samples.filter(s=>s.st==='borrowed').forEach(s => { pCount[s.bw] = (pCount[s.bw]||0)+1; });
  const pMax = Math.max(...Object.values(pCount),1);
  const COLORS = ['#c0392b','#e67e22','var(--blue)','var(--teal)','var(--green)'];
  document.getElementById('person-chart').innerHTML = Object.entries(pCount)
    .sort((a,b)=>b[1]-a[1]).slice(0,6)
    .map(([name,cnt],i) => `<div class="bar-row">
      <span class="bar-lbl">${name}</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(cnt/pMax*100)}%;background:${COLORS[i%COLORS.length]}"></div></div>
      <span class="bar-val">${cnt} 次</span>
    </div>`).join('') || '<div style="padding:12px;color:var(--t4);font-size:12px">尚無資料</div>';

  // Item chart
  const iCount = {};
  returnHistory.forEach(r => { iCount[r.name] = (iCount[r.name]||0)+1; });
  samples.filter(s=>s.st==='borrowed').forEach(s => { iCount[s.name] = (iCount[s.name]||0)+1; });
  const iMax = Math.max(...Object.values(iCount),1);
  document.getElementById('item-chart').innerHTML = Object.entries(iCount)
    .sort((a,b)=>b[1]-a[1]).slice(0,6)
    .map(([name,cnt]) => `<div class="bar-row">
      <span class="bar-lbl">${name}</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(cnt/iMax*100)}%;background:var(--teal)"></div></div>
      <span class="bar-val">${cnt} 次</span>
    </div>`).join('') || '<div style="padding:12px;color:var(--t4);font-size:12px">尚無資料</div>';

  // Warning table
  const warnItems = samples.filter(s=>s.st==='borrowed' && daysBetween(s.bd,'')>30);
  document.getElementById('warn-body').innerHTML = warnItems.length
    ? warnItems.map(s => `<div class="at-row th5" style="min-width:400px">
        <div style="font-weight:700">${s.name}</div>
        <div>${s.bw}</div>
        <div style="color:var(--t3)">${s.bd}</div>
        <div class="days-red">${daysBetween(s.bd,'')} 天</div>
        <div><span class="chip chip-bw">借出中</span></div>
      </div>`).join('')
    : '<div style="padding:16px;text-align:center;color:var(--t4);font-size:12px">目前無長期借用樣品 ✓</div>';
}

function setTrend(elId, diff, label) {
  const el = document.getElementById(elId);
  if (diff > 0) { el.textContent = `↑ ${label} +${diff}`; el.className = 'kpi-trend trend-up'; }
  else if (diff < 0) { el.textContent = `↓ ${label} ${diff}`; el.className = 'kpi-trend trend-dn'; }
  else { el.textContent = `→ 與${label.replace('較','')}持平`; el.className = 'kpi-trend'; }
}
