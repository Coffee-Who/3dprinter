<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 列印 · 工作看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg-soft:#fafbfc;--bg-panel:#f5f7f9;
  --line:#e6e8ec;--line-soft:#eef0f3;
  --ink:#0a0e14;--ink-2:#3b4250;--ink-3:#5a6270;--ink-4:#8a93a3;
  --accent:#0c7a99;--accent-soft:#e6f1f6;
  --ok:#1d6f43;--ok-soft:#e6f1ea;
  --warn:#c79b2a;--warn-soft:#fbf3dc;
  --danger:#c0392b;--danger-soft:#fbe7e3;
  --radius:10px;--radius-sm:6px;
  --shadow-card:0 1px 0 rgba(10,14,20,.04),0 1px 2px rgba(10,14,20,.04);
  --shadow-card-hover:0 2px 0 rgba(10,14,20,.04),0 4px 12px rgba(10,14,20,.06);
  --font-ui:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
  --sidebar-w:224px;--row-h:56px;--day-w:22px;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(10,14,20,.035) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0;mask-image:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.15));-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.15))}
.shell{height:100vh;background:var(--bg);display:flex;position:relative;z-index:1;overflow:hidden}

/* Sidebar */
.shell-sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--bg-soft);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 16px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.shell-brand-mark{width:28px;height:28px;background:#0a0e14;border-radius:7px;position:relative;flex-shrink:0}
.shell-brand-mark::before{content:'';position:absolute;top:6px;left:6px;width:6px;height:6px;background:var(--accent);border-radius:1px}
.shell-brand-mark::after{content:'';position:absolute;bottom:6px;right:6px;width:10px;height:2px;background:var(--accent);border-radius:1px}
.shell-brand-title{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.1;color:var(--ink)}
.shell-brand-sub{font-size:9.5px;color:var(--ink-4);font-family:var(--font-mono);letter-spacing:.1em;margin-top:3px}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:10px 8px;overflow-y:auto}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;background:transparent;border-radius:6px;cursor:pointer;text-align:left;font:inherit;color:var(--ink-3);transition:background .12s,color .12s;width:100%}
.sidebar-item:hover{background:var(--bg);color:var(--ink)}
.sidebar-item[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.sidebar-item[aria-selected="true"] .sidebar-item-icon{color:var(--accent)}
.sidebar-item-icon{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-4);flex-shrink:0}
.sidebar-item-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.sidebar-item-label{font-size:13px;font-weight:600;letter-spacing:-.005em;line-height:1.1}
.sidebar-item-sub{font-size:9.5px;font-family:var(--font-mono);color:var(--ink-4);letter-spacing:.08em}
.sb-divider{height:1px;background:var(--line);margin:8px 12px}
.sb-section-lbl{font-size:9.5px;color:var(--ink-4);font-family:var(--font-mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 12px 2px}
.sidebar-foot{padding:14px 16px;border-top:1px solid var(--line);font-family:var(--font-mono);font-size:10.5px;color:var(--ink-4);display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.sidebar-foot-date{color:var(--ink-2);font-feature-settings:'tnum'}

/* Main */
.shell-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.shell-top{display:flex;align-items:center;gap:18px;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;min-height:48px}
.shell-tabs{display:flex;gap:2px}
.shell-tab{position:relative;border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;color:var(--ink-3);padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:color .15s}
.shell-tab:hover{color:var(--ink)}
.shell-tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.shell-tab[aria-selected="true"]::after{content:'';position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--accent);border-radius:1px}
.shell-tab-icon{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;color:currentColor;flex-shrink:0}
.shell-spacer{flex:1}
.shell-aux{font-size:10.5px;color:var(--ink-4);font-family:var(--font-mono);letter-spacing:.08em}
.shell-body{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto;background:var(--bg)}

/* Table */
.table-view{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--bg);overflow:hidden}
.toolbar{display:flex;align-items:center;gap:10px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap;flex-shrink:0}
.toolbar-title{font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin-right:8px}
.toolbar-sub{font-size:11.5px;color:var(--ink-4);font-family:var(--font-mono);margin-right:auto}
.table-wrap{flex:1;overflow:auto;padding:0 28px 24px}
.kt{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kt thead{background:#fafbfc}
.kt th{text-align:left;font-weight:600;font-size:10.5px;font-family:var(--font-mono);color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:#fafbfc;z-index:1;user-select:none}
.kt th.sortable{cursor:pointer}.kt th.sortable:hover{color:var(--ink)}
.kt th .sort-indicator{display:inline-block;margin-left:4px;color:var(--ink-4);font-size:9px}
.kt th.sorted{color:var(--accent)}.kt th.sorted .sort-indicator{color:var(--accent)}
.kt td{padding:10px 12px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);vertical-align:middle}
.kt tbody tr:hover{background:var(--bg-soft)}
.kt tbody tr:last-child td{border-bottom:0}
.kt .col-seq{text-align:right;font-family:var(--font-mono);color:var(--ink-4);width:56px;font-feature-settings:'tnum'}
.kt .col-id{font-family:var(--font-mono);color:var(--accent);font-weight:500;font-size:11.5px}
.kt .col-date{font-family:var(--font-mono);font-feature-settings:'tnum';color:var(--ink-3);font-size:11.5px;white-space:nowrap}
.kt .col-prog{width:130px}
.kt .col-machine{font-family:var(--font-mono);color:var(--ink-2);font-size:11.5px}
.kt .col-actions{width:90px;text-align:right}
.kt .col-customer{font-weight:500;color:var(--ink)}
.kt-pill{display:inline-flex;align-items:center;height:18px;padding:0 8px;font-size:10.5px;border-radius:999px;font-family:var(--font-mono);font-weight:600;white-space:nowrap}
.kt-pill-todo{background:#eef0f3;color:#5a6270}.kt-pill-blocked{background:#fbf3dc;color:#8b6b13}
.kt-pill-progress{background:#e6f1f6;color:#0c7a99}.kt-pill-done{background:#e6f1ea;color:#1d6f43}.kt-pill-cancelled{background:#f0f1f4;color:#8a93a3}
.kt-mat-ok{color:#1d6f43;font-weight:500}.kt-mat-need{color:#8b6b13;font-weight:500}
.kt-eng{display:inline-flex;align-items:center;gap:6px}
.kt-eng-dot{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:var(--font-mono)}
.kt-prog{display:flex;align-items:center;gap:8px}
.kt-prog-bar{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;min-width:60px}
.kt-prog-fill{height:100%;background:var(--accent)}
.kt-prog-num{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);font-feature-settings:'tnum';min-width:32px;text-align:right}
.kt-due{display:inline-block;font-family:var(--font-mono);font-size:11.5px;font-feature-settings:'tnum';white-space:nowrap}
.kt-due-red{color:#c0392b;font-weight:600}.kt-due-amber{color:#c79b2a;font-weight:600}
.kt-act{display:inline-flex;gap:4px}
.kt-actbtn{width:24px;height:24px;border:1px solid var(--line);background:var(--bg);border-radius:5px;cursor:pointer;color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center;transition:all .12s;font-size:11px}
.kt-actbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.kt-actbtn.danger:hover{border-color:#c0392b;color:#c0392b;background:#fbe7e3}
.kt-empty{padding:60px 0;text-align:center;color:var(--ink-4);font-family:var(--font-mono);font-size:12px}
.kt-pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 28px;border-top:1px solid var(--line);background:var(--bg);font-size:12px;color:var(--ink-3);font-family:var(--font-mono);flex-wrap:wrap;gap:12px}
.kt-pagination-pages{display:flex;gap:3px;align-items:center}
.kt-page{min-width:28px;height:28px;padding:0 8px;border:1px solid var(--line);background:var(--bg);border-radius:5px;font:inherit;font-size:11.5px;cursor:pointer;color:var(--ink-3);font-family:var(--font-mono);font-feature-settings:'tnum'}
.kt-page:hover{border-color:var(--accent);color:var(--accent)}
.kt-page[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.kt-page:disabled{opacity:.4;cursor:not-allowed}

/* Kanban */
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-bottom:1px solid var(--line);background:var(--bg)}
.kpi-cell{padding:16px 24px 18px;border-right:1px solid var(--line-soft)}
.kpi-cell:last-child{border-right:0}
.kpi-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4);font-weight:600;font-family:var(--font-mono)}
.kpi-value{font-size:30px;font-weight:600;font-family:var(--font-mono);letter-spacing:-.02em;color:var(--ink);margin-top:4px;line-height:1.1;font-feature-settings:'tnum'}
.board{flex:1;display:flex;gap:14px;padding:20px 28px 24px;overflow-x:auto;align-items:flex-start;min-height:0}
.col{flex:0 0 296px;width:296px;background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 220px);transition:border-color .15s,background .15s}
.col-over{border-color:var(--accent);background:var(--accent-soft)}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;border-bottom:1px solid var(--line-soft)}
.col-head-left{display:flex;align-items:center;gap:8px}
.col-dot{width:6px;height:6px;border-radius:50%}
.col-title{font-weight:600;font-size:13.5px;color:var(--ink)}
.col-count{font-size:11px;font-family:var(--font-mono);color:var(--ink-3);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 7px;min-width:22px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-feature-settings:'tnum'}
.col-hint{font-size:10.5px;color:var(--ink-4);font-family:var(--font-mono);letter-spacing:.02em}
.col-body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;min-height:80px}
.col-empty{text-align:center;color:var(--ink-4);font-size:12px;padding:24px 0;font-family:var(--font-mono)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px 10px;cursor:grab;box-shadow:var(--shadow-card);transition:box-shadow .15s,border-color .15s;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:#d2d6dd;box-shadow:var(--shadow-card-hover)}
.card:active{cursor:grabbing}
.card-dragging{opacity:.4}.card-cancelled{opacity:.62}
.card-cancelled .card-title{text-decoration:line-through;text-decoration-color:var(--ink-4)}
.card-compact{padding:9px 11px;gap:6px}
.card-top{display:flex;align-items:center;justify-content:space-between}
.card-top-right{display:flex;align-items:center;gap:6px}
.card-id{font-size:11px;font-family:var(--font-mono);color:var(--ink-4);letter-spacing:.02em}
.card-title{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35;letter-spacing:-.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-compact .card-title{font-size:12.5px;-webkit-line-clamp:1}
.card-meta{font-size:11.5px;color:var(--ink-3);display:flex;gap:4px;align-items:baseline;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.meta-machine{font-family:var(--font-mono);color:var(--ink-2)}
.meta-remark{color:var(--ink-4);text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.card-progress{display:flex;align-items:center;gap:8px}
.progress-track{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);transition:width .25s}
.progress-num{font-size:10.5px;color:var(--ink-3);font-family:var(--font-mono);font-feature-settings:'tnum';min-width:30px;text-align:right}
.card-foot{display:flex;align-items:center;justify-content:space-between}
.seq-num{font-size:10.5px;font-family:var(--font-mono);color:var(--ink-4);font-feature-settings:'tnum'}
.avatar{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:var(--font-mono);letter-spacing:.02em;border:1px solid transparent;flex-shrink:0}
.chip{display:inline-flex;align-items:center;height:18px;padding:0 7px;font-size:10.5px;font-family:var(--font-mono);border-radius:4px;letter-spacing:.01em;white-space:nowrap}
.chip-muted{color:var(--ink-3);background:var(--bg-panel);border:1px solid var(--line)}
.chip-amber{color:#8b6b13;background:var(--warn-soft);border:1px solid #f0e4b8}
.chip-red{color:#8a1d12;background:var(--danger-soft);border:1px solid #f3c8c0}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}.dot-amber{background:var(--warn)}

/* Drawer */
.drawer-wrap{position:fixed;inset:0;background:rgba(10,14,20,.18);z-index:50;display:flex;justify-content:flex-end;animation:fade .12s ease}
.drawer{width:min(440px,92vw);height:100%;background:var(--bg);border-left:1px solid var(--line);box-shadow:-16px 0 30px rgba(10,14,20,.08);padding:22px 24px 24px;overflow-y:auto;animation:slidein .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.drawer-eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);font-weight:600;font-family:var(--font-mono)}
.drawer-id{font-size:18px;font-weight:600;font-family:var(--font-mono);margin-top:4px;letter-spacing:-.01em}
.icon-btn{width:28px;height:28px;border:1px solid var(--line);background:var(--bg);border-radius:6px;cursor:pointer;font-size:16px;line-height:1;color:var(--ink-3)}
.icon-btn:hover{background:var(--bg-panel);color:var(--ink)}
.drawer-customer{font-size:18px;font-weight:600;letter-spacing:-.01em;padding:14px 0 18px;border-bottom:1px solid var(--line-soft);margin-bottom:18px}
.drawer-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:16px}
.field-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4);font-family:var(--font-mono);margin-bottom:6px}
.field-value{font-size:13.5px;color:var(--ink);display:flex;align-items:center}
.field-value.mono{font-family:var(--font-mono)}
.pill{display:inline-flex;align-items:center;font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:600;font-family:var(--font-mono)}
.pill-ok{background:var(--ok-soft);color:var(--ok)}.pill-amber{background:var(--warn-soft);color:#8b6b13}
.remark-box{display:block;padding:10px 12px;background:var(--bg-panel);border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--ink-2);min-height:44px}
.drawer-foot{display:flex;justify-content:space-between;margin-top:24px;padding-top:16px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--ink-4);font-family:var(--font-mono)}

/* Gantt */
.gantt{flex:1;display:flex;overflow:auto;background:var(--bg)}
.gantt-left{flex:0 0 200px;width:200px;position:sticky;left:0;background:var(--bg);z-index:5;border-right:1px solid var(--line)}
.gantt-right{flex:1;position:relative;min-width:0}
.scale{position:sticky;top:0;background:var(--bg);z-index:4;border-bottom:1px solid var(--line);height:48px;display:flex}
.scale-months{position:absolute;top:0;left:0;right:0;height:22px;display:flex;border-bottom:1px solid var(--line-soft)}
.scale-month{border-right:1px solid var(--line-soft);font-size:11px;font-family:var(--font-mono);color:var(--ink-2);font-weight:600;letter-spacing:.02em;padding:4px 8px;white-space:nowrap;overflow:hidden}
.scale-days{position:absolute;top:22px;left:0;right:0;height:26px;display:flex}
.scale-day{width:var(--day-w);border-right:1px solid var(--line-soft);font-size:9.5px;font-family:var(--font-mono);color:var(--ink-4);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-feature-settings:'tnum'}
.scale-day.weekend{background:var(--bg-soft)}.scale-day.is-today{background:#fff3ec;color:var(--danger);font-weight:700}
.lane-head-sticky{position:sticky;top:0;background:var(--bg);z-index:6;height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;font-size:11px;font-family:var(--font-mono);color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.lane{height:var(--row-h);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;padding:0 14px;gap:10px}
.lane:last-child{border-bottom:0}
.lane-avatar{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--font-mono);flex-shrink:0}
.lane-meta{display:flex;flex-direction:column;gap:1px;min-width:0}
.lane-name{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-.005em}
.lane-sub{font-size:10.5px;color:var(--ink-4);font-family:var(--font-mono);font-feature-settings:'tnum'}
.row{height:var(--row-h);border-bottom:1px solid var(--line-soft);position:relative}
.row:last-child{border-bottom:0}.row.alt{background:var(--bg-soft)}
.today-line{position:absolute;top:0;bottom:0;width:1.5px;background:var(--danger);opacity:.7;z-index:3;pointer-events:none}
.today-line::before{content:'';position:absolute;top:-3px;left:-3px;width:7.5px;height:7px;background:var(--danger);border-radius:50%}
.bar{position:absolute;top:50%;transform:translateY(-50%);height:26px;border-radius:4px;display:flex;align-items:center;padding:0 8px;cursor:pointer;overflow:hidden;transition:box-shadow .15s;font-size:10.5px;font-family:var(--font-mono);font-weight:500;color:var(--ink);z-index:2}
.bar:hover{box-shadow:0 2px 8px rgba(10,14,20,.12);z-index:4}
.bar.progress{background:var(--accent-soft);border:1px solid #b8d3df;color:#054a60}
.bar.done{background:var(--ok);border:1px solid var(--ok);color:#fff}
.bar.blocked{background:var(--warn-soft);border:1px solid #f0e4b8;color:#6b4f0e}
.bar.todo{background:var(--bg);border:1px dashed #cbd0d8;color:var(--ink-3)}
.bar.cancelled{background:repeating-linear-gradient(45deg,var(--bg-soft) 0 4px,#f0f1f4 4px 8px);border:1px solid var(--line);color:var(--ink-4)}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.85;z-index:0}

<!-- ── Helpers / Constants ── -->
<script>
(function(){
  const K={};
  K.TODAY=new Date();K.DAY=86400000;
  K.ENG_ORDER=['Jimmy','Jaylen','Bill','Barry'];
  K.ENG_LABEL={Jimmy:'廖璟程',Jaylen:'何哲綸',Bill:'陳柏元',Barry:'Barry'};
  K.ENG_INIT={Jimmy:'JC',Jaylen:'JL',Bill:'BL',Barry:'BR'};
  K.ENG_TONE={Jimmy:{fg:'#0c7a99',bg:'#e6f1f6'},Jaylen:{fg:'#6b3fa0',bg:'#efe9f7'},Bill:{fg:'#1d6f43',bg:'#e6f1ea'},Barry:{fg:'#a05a00',bg:'#f7eed8'}};
  K.MACHINES=['Form4','Form4L','Fuse1+','Mark2'];
  K.MATERIALS=['足夠','需調撥'];
  K.PROGRESS_VALUES=[0,25,50,75,100];
  K.STATUS_TONE={
    todo:{fg:'#5a6270',bg:'#eef0f3',label:'待開始'},
    blocked:{fg:'#8b6b13',bg:'#fbf3dc',label:'等待材料'},
    progress:{fg:'#0c7a99',bg:'#e6f1f6',label:'進行中'},
    done:{fg:'#1d6f43',bg:'#e6f1ea',label:'已完成'},
    cancelled:{fg:'#8a93a3',bg:'#f0f1f4',label:'已取消'}
  };
  K.daysUntil=function(dateStr){if(!dateStr)return null;const d=new Date(dateStr);if(isNaN(d))return null;return Math.round((d-K.TODAY)/K.DAY);};
  K.statusOf=function(item){if(/取消/.test(item.remark||''))return'cancelled';if(item.complete==='是'||item.progress===100)return'done';if(item.material==='需調撥')return'blocked';if(item.progress>0)return'progress';return'todo';};
  K.fmtYmd=function(d){if(!d)return'—';const x=d instanceof Date?d:new Date(d);if(isNaN(x))return'—';return`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;};
  K.applyFilters=function(data,{search='',engineer='',machine='',status=''}={}){
    const s=(search||'').trim().toLowerCase();
    return data.filter(d=>{
      if(s&&!d.id.toLowerCase().includes(s)&&!d.customer.toLowerCase().includes(s))return false;
      if(engineer&&d.engineer!==engineer)return false;
      if(machine&&d.machine!==machine)return false;
      if(status&&K.statusOf(d)!==status)return false;
      return true;
    });
  };
  window.K=K;
  window.applySettings=function(settings){
    if(!settings)return;
    const eng=settings.engineers,mch=settings.machines;
    if(eng&&Array.isArray(eng)){
      window._settings_engineers=eng.map(e=>e.key);
      eng.forEach(e=>{
        K.ENG_LABEL[e.key]=e.label;
        if(!K.ENG_TONE[e.key])K.ENG_TONE[e.key]={fg:'#5a6270',bg:'#eef0f3'};
        if(!K.ENG_INIT[e.key])K.ENG_INIT[e.key]=e.key.slice(0,2).toUpperCase();
      });
    }
    if(mch&&Array.isArray(mch))window._settings_machines=mch.map(m=>m.name);
    if(window._onSettingsUpdated)window._onSettingsUpdated();
  };
  window.hasPerm=function(user,perm){
    if(!user)return false;
    const uid=user.uid||user;
    const p=(window._userPerms||{})[uid]||{};
    return p.admin===true||p[perm]===true;
  };
  window.showToast=function(msg,type='ok'){
    const tc=document.getElementById('toasts');if(!tc)return;
    const el=document.createElement('div');
    el.className='toast-item '+(type==='err'?'err':type==='inf'?'inf':'ok');
    el.textContent=msg;tc.appendChild(el);
    setTimeout(()=>el.remove(),3200);
  };
})();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

function App() {
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [tab, setTab] = useState('kanban');
  const [sidebarTab, setSidebarTab] = useState('workboard');
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(false);
  const [editO, setEditO] = useState(null);
  const [editMode, setEditMode] = useState(false);
  const [confirmDel, setConfirmDel] = useState(null);
  const [labelVer, setLabelVer] = useState(0);

  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged(async u => {
      if (u) {
        window._currentUser = u;
        try {
          const snap = await firebase.firestore().collection('settings').doc('permissions').get();
          if (snap.exists) window._userPerms = snap.data();
        } catch(e) {}
        try {
          const ts = await firebase.firestore().collection('userSettings').doc(u.uid).get();
          if (ts.exists && ts.data().ghToken) {
            window._ghToken = ts.data().ghToken;
            localStorage.setItem('sw_gh_token_v3', ts.data().ghToken);
          }
        } catch(e) {}
        try {
          const ss = await firebase.firestore().collection('settings').doc('app').get();
          if (ss.exists) window.applySettings(ss.data());
        } catch(e) {}
        setUser(u);
      } else {
        setUser(null);
        window._currentUser = null;
      }
      setAuthLoading(false);
    });
    window._onSettingsUpdated = () => setLabelVer(v => v + 1);
    return () => { unsub(); window._onSettingsUpdated = null; };
  }, []);

  useEffect(() => {
    if (!user) return;
    const unsub = FBOrders.onSnapshot(rows => { setData(rows); setLoading(false); });
    return () => unsub();
  }, [user]);

  function switchSidebar(t) {
    setSidebarTab(t);
    if (t === 'samples') setTimeout(() => { if (window.smLoad) window.smLoad(); }, 80);
  }

  const canEdit = window.hasPerm(user, 'edit_board');
  const canDel  = window.hasPerm(user, 'delete_board');

  const nextSeq = () => data.length ? Math.max(...data.map(d => d.seq || 0)) + 1 : 1;
  const handleSave = async form => {
    if (editO) { await FBOrders.update(editO._id, form); showToast('已更新 ✓'); }
    else { await FBOrders.add({ ...form, seq: nextSeq() }); showToast('已新增 ✓'); }
  };

  const TABS = [
    { key:'table',     label:'總表',       icon:<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1.5" y="2" width="11" height="10" rx="1.2" stroke="currentColor" strokeWidth="1.3"/><line x1="1.5" y1="5.5" x2="12.5" y2="5.5" stroke="currentColor" strokeWidth="1.3"/><line x1="5" y1="2" x2="5" y2="12" stroke="currentColor" strokeWidth="1.3"/></svg> },
    { key:'kanban',    label:'看板',       icon:<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1.5" y="2" width="3" height="10" rx=".8" stroke="currentColor" strokeWidth="1.3"/><rect x="5.5" y="2" width="3" height="6.5" rx=".8" stroke="currentColor" strokeWidth="1.3"/><rect x="9.5" y="2" width="3" height="8.5" rx=".8" stroke="currentColor" strokeWidth="1.3"/></svg> },
    { key:'gantt',     label:'時間軸',     icon:<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><line x1="1.5" y1="3" x2="9.5" y2="3" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><line x1="4" y1="7" x2="12.5" y2="7" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><line x1="2" y1="11" x2="8" y2="11" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg> },
    { key:'dashboard', label:'Dashboard', icon:<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 11.5V8.5M5 11.5V5M8 11.5V7M11 11.5V3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/><line x1="1" y1="12.5" x2="13" y2="12.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg> },
  ];

  if (authLoading) return (
    <div style={{position:'fixed',inset:0,display:'flex',alignItems:'center',justifyContent:'center',background:'#fff',zIndex:9999,flexDirection:'column',gap:12,fontFamily:'var(--font-mono)',fontSize:13,color:'var(--ink-4)'}}>
      <div style={{width:28,height:28,background:'#0a0e14',borderRadius:7,position:'relative'}}>
        <div style={{position:'absolute',top:6,left:6,width:6,height:6,background:'#0c7a99',borderRadius:1}}/>
        <div style={{position:'absolute',bottom:6,right:6,width:10,height:2,background:'#0c7a99',borderRadius:1}}/>

function LoginPage() {
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const login = async () => {
    setBusy(true); setErr('');
    try { await firebase.auth().signInWithEmailAndPassword(email, pass); }
    catch(e) { setErr(e.message || '登入失敗'); }
    finally { setBusy(false); }
  };
  return (
    <div className="login-page">
      <div className="login-card">
        <div className="login-brand">
          <div className="login-brand-mark"/>
          <h1>實威國際</h1>
          <p>3D PRINT STUDIO</p>
        </div>
        {err && <div className="login-err show">{err}</div>}
        <div className="login-fg">
          <label>電子郵件</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()} placeholder="you@example.com"/>
        </div>
        <div className="login-fg">
          <label>密碼</label>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()} placeholder="••••••••"/>
        </div>
        <button className="login-submit" onClick={login} disabled={busy}>{busy?'登入中…':'登入'}</button>
      </div>
    </div>
  );
}

/* ── TableView (inline) ── */
function TableView({ data, editMode, canEdit, canDel, onEdit, onDelete, labelVer }) {
  const K = window.K;
  const [search, setSearch] = React.useState('');
  const [fEng, setFEng] = React.useState('');
  const [fMch, setFMch] = React.useState('');
  const [fSt, setFSt] = React.useState('');
  const [sortKey, setSortKey] = React.useState('seq');
  const [sortDir, setSortDir] = React.useState('asc');
  const [page, setPage] = React.useState(1);
  const PAGE = 20;
  const engs = window._settings_engineers || K.ENG_ORDER;
  const mchs = window._settings_machines || K.MACHINES;

  const filtered = React.useMemo(() => {
    let arr = K.applyFilters(data, { search, engineer: fEng, machine: fMch, status: fSt });
    return [...arr].sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
  }, [data, search, fEng, fMch, fSt, sortKey, sortDir, labelVer]);

  const pages = Math.max(1, Math.ceil(filtered.length / PAGE));
  const safe = Math.min(page, pages);
  const paged = filtered.slice((safe-1)*PAGE, safe*PAGE);
  const sortBy = k => { if (sortKey===k) setSortDir(d=>d==='asc'?'desc':'asc'); else { setSortKey(k); setSortDir('asc'); } setPage(1); };
  const ST = { done:{bg:'#e6f1ea',color:'#1d6f43'}, progress:{bg:'#e6f1f6',color:'#0c7a99'}, blocked:{bg:'#fbf3dc',color:'#8b6b13'}, cancelled:{bg:'#f0f1f4',color:'#8a93a3'}, todo:{bg:'#eef0f3',color:'#5a6270'} };

  return (
    <div className="table-view">
      <div className="toolbar">
        <div className="t-search"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" strokeWidth="1.5"/><path d="M11 11l3 3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg><input value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}} placeholder="搜尋單號 / 客戶"/></div>
        <select className="t-sel" value={fSt} onChange={e=>{setFSt(e.target.value);setPage(1);}}><option value="">所有狀態</option><option value="todo">待開始</option><option value="progress">進行中</option><option value="blocked">等待材料</option><option value="done">已完成</option><option value="cancelled">已取消</option></select>
        <select className="t-sel" value={fEng} onChange={e=>{setFEng(e.target.value);setPage(1);}}><option value="">所有工程師</option>{engs.map(e=><option key={e} value={e}>{K.ENG_LABEL[e]||e}</option>)}</select>
        <select className="t-sel" value={fMch} onChange={e=>{setFMch(e.target.value);setPage(1);}}><option value="">所有機台</option>{mchs.map(m=><option key={m}>{m}</option>)}</select>
        <span style={{fontSize:12,color:'#8a93a3',marginLeft:'auto'}}>共 {filtered.length} 筆</span>
      </div>
      <div className="table-wrap">
        <table className="kt">
          <thead><tr>
            {[['seq','序'],['id','單號'],['customer','客戶'],['engineer','工程師'],['dueDate','交期'],['machine','機台'],['material','材料'],['progress','進度'],['status','狀態'],['remark','備註']].map(([k,lbl])=>(
              <th key={k} className={`sortable${sortKey===k?' sorted':''}`} onClick={()=>sortBy(k)}>{lbl}<span className="sort-indicator">{sortKey===k?(sortDir==='asc'?'↑':'↓'):'↕'}</span></th>
            ))}
            {editMode && <th className="col-actions">操作</th>}
          </tr></thead>
          <tbody>
            {paged.length===0 && <tr><td colSpan={editMode?11:10}><div className="kt-empty">沒有符合條件的資料</div></td></tr>}
            {paged.map(o => {
              const st = K.statusOf(o);
              const tone = K.ENG_TONE[o.engineer] || {fg:'#5a6270',bg:'#eef0f3'};
              const days = K.daysUntil(o.dueDate);
              const sstyle = ST[st] || ST.todo;
              return (
                <tr key={o._id||o.seq}>
                  <td className="col-seq">{o.seq}</td>
                  <td className="col-id">{o.id}</td>
                  <td className="col-customer">{o.customer}</td>
                  <td><span className="kt-eng"><span className="kt-eng-dot" style={{color:tone.fg,background:tone.bg}}>{K.ENG_INIT[o.engineer]||o.engineer?.slice(0,2)}</span>{K.ENG_LABEL[o.engineer]||o.engineer}</span></td>
                  <td className="col-date"><div>{o.dueDate||'—'}</div>{days!==null&&<div style={{fontSize:10.5,color:days<0?'#c0392b':days<=3?'#c79b2a':'#8a93a3'}}>{days<0?`逾 ${-days}d`:days===0?'今日':` ${days}d`}</div>}</td>
                  <td className="col-machine">{o.machine||'—'}</td>
                  <td><span style={{fontSize:11,fontWeight:700,color:o.material==='需調撥'?'#8b6b13':'#1d6f43',background:o.material==='需調撥'?'#fbf3dc':'#e6f1ea',padding:'2px 8px',borderRadius:10}}>{o.material}</span></td>
                  <td className="col-prog"><div className="kt-prog"><div className="kt-prog-bar"><div className="kt-prog-fill" style={{width:`${o.progress}%`,background:st==='done'?'#1d6f43':st==='cancelled'?'#cbd0d8':'#0c7a99'}}/></div><span className="kt-prog-num">{o.progress}%</span></div></td>
                  <td><span className={`kt-pill kt-pill-${st}`}>{K.STATUS_TONE[st]?.label||st}</span></td>
                  <td style={{color:'#8a93a3',fontSize:12,maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{o.remark||'—'}</td>
                  {editMode && <td className="col-actions"><span className="kt-act">{canEdit&&<button className="kt-actbtn" title="編輯" onClick={()=>onEdit(o)}>✎</button>}{canDel&&<button className="kt-actbtn danger" title="刪除" onClick={()=>onDelete(o)}>✕</button>}</span></td>}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {pages>1 && (
        <div className="kt-pagination">
          <span>第 {safe} / {pages} 頁 · 共 {filtered.length} 筆</span>
          <div className="kt-pagination-pages">
            <button className="kt-page" disabled={safe<=1} onClick={()=>setPage(safe-1)}>‹</button>
            {Array.from({length:pages}).map((_,i)=><button key={i} className="kt-page" aria-current={i+1===safe} onClick={()=>setPage(i+1)}>{i+1}</button>)}
            <button className="kt-page" disabled={safe>=pages} onClick={()=>setPage(safe+1)}>›</button>
          </div>
        </div>
      )}
    </div>
  );
}
window.TableView = TableView;
