<script type="text/babel" data-presets="react">
/* 時間軸 / 甘特圖 view */
const { useState: useStateG, useMemo: useMemoG } = React;

function GanttView({ data }) {
  const K = window.K;
  const TODAY = K.TODAY;
  const DAY = K.DAY;

  const [rangeKey, setRangeKey] = useStateG('quarter');
  const [engF, setEngF] = useStateG('');
  const [tip, setTip] = useStateG(null);

  const RANGES = [
    { key:'month',  label:'本月',   spanDays: 30,  startOffset: -14 },
    { key:'quarter',label:'3 個月', spanDays: 92,  startOffset: -30 },
    { key:'half',   label:'半年',   spanDays: 180, startOffset: -60 },
  ];

  const range = RANGES.find(r => r.key === rangeKey);
  const start = new Date(TODAY.getTime() + range.startOffset * DAY);
  start.setHours(0,0,0,0);
  const days = [];
  for (let d = new Date(start); d < new Date(start.getTime() + range.spanDays * DAY); d = new Date(d.getTime() + DAY)) {
    days.push(new Date(d));
  }

  const monthsAgg = [];
  days.forEach(d => {
    const ym = `${d.getFullYear()}-${d.getMonth()}`;
    const last = monthsAgg[monthsAgg.length-1];
    if (last && last.ym === ym) last.count++;
    else monthsAgg.push({ ym, count: 1, year: d.getFullYear(), month: d.getMonth() });
  });

  const items = data.filter(it => !engF || it.engineer === engF);
  const lanes = K.ENG_ORDER.filter(e => !engF || engF === e).map(eng => ({
    eng, items: items.filter(it => it.engineer === eng),
  }));

  function parseDate(s) {
    if (!s) return null;
    const d = new Date(s);
    return Number.isNaN(d.getTime()) ? null : d;
  }
  function barPos(it) {
    const sd = parseDate(it.startDate);
    const dd = parseDate(it.dueDate);
    if (!dd) return null;
    const barStart = sd || new Date(dd.getTime() - 7 * DAY);
    const startIdx = Math.round((barStart - start) / DAY);
    const dueIdx = Math.round((dd - start) / DAY);
    if (dueIdx < 0 || startIdx > days.length) return null;
    const clippedStart = Math.max(0, startIdx);
    const clippedEnd = Math.min(days.length, dueIdx + 1);
    return {
      left: clippedStart * 22,
      width: Math.max(28, (clippedEnd - clippedStart) * 22),
      noStart: !sd,
      overdue: dd < TODAY && K.statusOf(it) !== 'done' && K.statusOf(it) !== 'cancelled',
    };
  }
  function todayPos() {
    const idx = (TODAY - start) / DAY;
    if (idx < 0 || idx > days.length) return null;
    return idx * 22;
  }
  const isWeekend = (d) => { const w = d.getDay(); return w === 0 || w === 6; };
  const isMonday = (d) => d.getDay() === 1;
  const isToday = (d) =>
    d.getFullYear() === TODAY.getFullYear() &&
    d.getMonth() === TODAY.getMonth() &&
    d.getDate() === TODAY.getDate();

  const tpos = todayPos();

  return (
    <div className="gantt-view">
      <div className="toolbar">
        <div className="toolbar-title">時間軸 / 甘特圖</div>
        <span className="toolbar-sub">{items.length} 筆訂單 · 滑鼠移到 bar 顯示詳情</span>
        <span className="today-pill">
          <span className="dot"></span>
          今天 <b>{K.fmtYmd(TODAY)}</b>
        </span>
        <select className="t-sel" value={engF} onChange={e => setEngF(e.target.value)}>
          <option value="">所有工程師</option>
          {K.ENG_ORDER.map(k => <option key={k} value={k}>{K.ENG_FULLLABEL[k]}</option>)}
        </select>
        <div className="seg">
          {RANGES.map(r => (
            <button key={r.key}
              className={`seg-btn ${rangeKey === r.key ? 'seg-btn-active' : ''}`}
              onClick={() => setRangeKey(r.key)}>{r.label}</button>
          ))}
        </div>
      </div>

      <div className="legend">
        <span className="lg"><span className="lg-chip todo"/>待開始</span>
        <span className="lg"><span className="lg-chip blocked"/>等待材料</span>
        <span className="lg"><span className="lg-chip progress"/>進行中</span>
        <span className="lg"><span className="lg-chip done"/>已完成</span>
        <span className="lg"><span className="lg-chip cancelled"/>已取消</span>
        <span className="lg-spacer"/>
        <span className="lg-hint">bar 內填色 = 進度 %</span>
      </div>

      <div className="gantt">
        <div className="gantt-left">
          <div className="lane-head-sticky">工程師</div>
          {lanes.map(l => (
            <div key={l.eng} className="lane">
              <span className="lane-avatar" style={{
                color: K.ENG_TONE[l.eng].fg,
                background: K.ENG_TONE[l.eng].bg,
              }}>{K.ENG_INIT[l.eng]}</span>
              <div className="lane-meta">
                <span className="lane-name">{K.ENG_FULLLABEL[l.eng]}</span>
                <span className="lane-sub">{l.items.length} 訂單</span>
              </div>
            </div>
          ))}
        </div>

        <div className="gantt-right" style={{ minWidth: days.length * 22 + 'px' }}>
          <div className="scale" style={{ width: days.length * 22 + 'px' }}>
            <div className="scale-months">
              {monthsAgg.map((m, i) => (
                <div key={i} className="scale-month" style={{ width: m.count * 22 + 'px' }}>
                  {m.year} · {String(m.month + 1).padStart(2, '0')} 月
                </div>
              ))}
            </div>
            <div className="scale-days">
              {days.map((d, i) => (
                <div key={i} className={[
                  'scale-day',
                  isWeekend(d) ? 'weekend' : '',
                  isMonday(d) ? 'is-monday' : '',
                  isToday(d) ? 'is-today' : '',
                ].filter(Boolean).join(' ')}>
                  {d.getDate()}
                </div>
              ))}
            </div>
          </div>

          {tpos !== null && (
            <div className="today-line" style={{ left: tpos + 'px', top: 48 }}/>
          )}

          {lanes.map((l, li) => (
            <div key={l.eng} className={`row ${li % 2 === 1 ? 'alt' : ''}`} style={{ width: days.length * 22 + 'px' }}>
              <div className="grid-lines">
                {days.map((d, i) => (
                  <div key={i} className={[
                    'grid-cell',
                    isWeekend(d) ? 'weekend' : '',
                    isMonday(d) ? 'is-monday' : '',
                  ].filter(Boolean).join(' ')}/>
                ))}
              </div>

              {l.items.map(it => {
                const pos = barPos(it);
                if (!pos) return null;
                const st = K.statusOf(it);
                const cls = `bar ${st} ${pos.noStart ? 'todo-pending' : ''} ${pos.overdue ? 'overdue' : ''}`;
                return (
                  <div key={it.seq} className={cls}
                    style={{ left: pos.left + 'px', width: pos.width + 'px' }}
                    onMouseEnter={e => setTip({
                      item: it,
                      x: e.currentTarget.offsetLeft + pos.width + 10,
                      y: e.currentTarget.offsetTop - 6,
                    })}
                    onMouseLeave={() => setTip(null)}
                  >
                    {!pos.noStart && st !== 'todo' && (
                      <div className="bar-fill" style={{ width: `${it.progress}%` }}/>
                    )}
                    <span className="bar-text">
                      EF·{it.id.slice(-7)} · {it.customer.length > 10 ? it.customer.slice(0, 10) + '…' : it.customer}
                    </span>
                    {!pos.noStart && st !== 'done' && st !== 'cancelled' && pos.overdue && (
                      <div className="bar-due-marker"/>
                    )}
                  </div>
                );
              })}
            </div>
          ))}

          {tip && (
            <div className="tooltip" style={{ left: tip.x + 'px', top: tip.y + 48 + 'px' }}>
              <div className="tooltip-title">{tip.item.customer}</div>
              <div className="tooltip-row">EF · <b>{tip.item.id}</b></div>
              <div className="tooltip-row">機台 · <b>{tip.item.machine || '—'}</b></div>
              <div className="tooltip-row">進度 · <b>{tip.item.progress}%</b></div>
              <div className="tooltip-row">期望交期 · <b>{tip.item.dueDate || '—'}</b></div>
              <div className="tooltip-row">開始日 · <b>{tip.item.startDate || '未排程'}</b></div>
              <div className="tooltip-row">材料 · <b>{tip.item.material}</b></div>
              {tip.item.remark && <div className="tooltip-row" style={{ marginTop: 4 }}>備註 · <b>{tip.item.remark}</b></div>}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

window.GanttView = GanttView;

</script>
<script type="text/babel" data-presets="react">
/* Dashboard view — 3 預設 + 3 自由選擇 */
const { useState: useStateD, useMemo: useMemoD } = React;

// 維度定義
const DIMENSIONS = {
  status: {
    label: '狀態',
    extract: (it) => window.K.statusOf(it),
    order: ['todo', 'blocked', 'progress', 'done', 'cancelled'],
    label_for: (k) => window.K.STATUS_TONE[k].label,
    color_for: (k) => window.K.STATUS_TONE[k].fg,
  },
  engineer: {
    label: '工程師',
    extract: (it) => it.engineer,
    order: window.K.ENG_ORDER,
    label_for: (k) => window.K.ENG_LABEL[k] || k,
    color_for: (k) => (window.K.ENG_TONE[k] || { fg: '#0c7a99' }).fg,
  },
  progress: {
    label: '進度',
    extract: (it) => String(it.progress),
    order: ['0', '25', '50', '75', '100'],
    label_for: (k) => k + '%',
    color_for: (k) => {
      const n = parseInt(k, 10);
      if (n === 0) return '#9aa3b2';
      if (n === 100) return '#1d6f43';
      return '#0c7a99';
    },
  },
  machine: {
    label: '機台',
    extract: (it) => it.machine || '未指派',
    order: null,
    label_for: (k) => k,
    color_for: () => '#0c7a99',
  },
  material: {
    label: '材料',
    extract: (it) => it.material,
    order: ['足夠', '需調撥'],
    label_for: (k) => k,
    color_for: (k) => k === '足夠' ? '#1d6f43' : '#c79b2a',
  },
  customer: {
    label: '客戶 (Top 8)',
    extract: (it) => it.customer,
    order: null,
    label_for: (k) => k.length > 12 ? k.slice(0, 12) + '…' : k,
    color_for: () => '#0c7a99',
  },
};

function aggregate(data, dimKey) {
  const dim = DIMENSIONS[dimKey];
  const counts = {};
  data.forEach(it => {
    const k = dim.extract(it);
    counts[k] = (counts[k] || 0) + 1;
  });
  let keys;
  if (dim.order) {
    keys = dim.order.filter(k => counts[k] !== undefined);
    // 加入 order 沒有列到的(避免漏掉)
    Object.keys(counts).forEach(k => { if (!keys.includes(k)) keys.push(k); });
  } else {
    keys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    if (dimKey === 'customer') keys = keys.slice(0, 8);
  }
  return keys.map(k => ({
    key: k,
    label: dim.label_for(k),
    value: counts[k] || 0,
    color: dim.color_for(k),
  }));
}

// ─── 圖表元件 ───────────────────

function VerticalBar({ data, height = 200 }) {
  if (data.length === 0) return <div className="chart-empty">無資料</div>;
  const max = Math.max(...data.map(d => d.value), 1);
  const padding = { top: 16, right: 8, bottom: 28, left: 28 };
  const W = 320, H = height;
  const innerW = W - padding.left - padding.right;
  const innerH = H - padding.top - padding.bottom;
  const barW = innerW / data.length;
  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(p => Math.round(max * p));

  return (
    <svg className="svg-chart" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet">
      {/* gridlines */}
      {gridLines.map((v, i) => {
        const y = padding.top + innerH - (v / max) * innerH;
        return (
          <g key={i}>
            <line x1={padding.left} x2={W - padding.right} y1={y} y2={y} className="vbar-grid"/>
            <text x={padding.left - 4} y={y + 3} fontSize="9" textAnchor="end" fill="#8a93a3">{v}</text>
          </g>
        );
      })}
      {/* bars */}
      {data.map((d, i) => {
        const h = (d.value / max) * innerH;
        const x = padding.left + i * barW + barW * 0.2;
        const w = barW * 0.6;
        const y = padding.top + innerH - h;
        return (
          <g key={d.key}>
            <rect x={x} y={padding.top} width={w} height={innerH}
              className="vbar-track" rx="2"/>
            <rect x={x} y={y} width={w} height={h}
              fill={d.color} className="vbar-bar" rx="2"/>
            <text x={x + w/2} y={y - 4} fontSize="10" textAnchor="middle" fill="#0a0e14" fontWeight="600">
              {d.value}
            </text>
            <text x={x + w/2} y={H - padding.bottom + 14} fontSize="9.5" textAnchor="middle" fill="#5a6270">
              {d.label}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function HorizontalBar({ data }) {
  if (data.length === 0) return <div className="chart-empty">無資料</div>;
  const max = Math.max(...data.map(d => d.value), 1);
  return (
    <div className="hbar-list">
      {data.map(d => (
        <div key={d.key} className="hbar-row">
          <div className="hbar-label" title={d.label}>{d.label}</div>
          <div className="hbar-track">
            <div className="hbar-fill" style={{
              width: `${(d.value / max) * 100}%`,
              background: d.color,
            }}/>
          </div>
          <div className="hbar-num">{d.value}</div>
        </div>
      ))}
    </div>
  );
}

function DonutChart({ data, centerLabel = '總計' }) {
  if (data.length === 0) return <div className="chart-empty">無資料</div>;
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const W = 200, R = 78, r = 52, cx = W/2, cy = W/2;
  let cumulative = 0;
  const segments = data.map(d => {
    const start = cumulative / total;
    cumulative += d.value;
    const end = cumulative / total;
    return { ...d, start, end };
  });
  function arcPath(start, end) {
    if (end - start >= 0.9999) {
      // full circle — draw as two arcs
      return [
        `M ${cx + R} ${cy}`,
        `A ${R} ${R} 0 1 1 ${cx - R} ${cy}`,
        `A ${R} ${R} 0 1 1 ${cx + R} ${cy}`,
        `L ${cx + r} ${cy}`,
        `A ${r} ${r} 0 1 0 ${cx - r} ${cy}`,
        `A ${r} ${r} 0 1 0 ${cx + r} ${cy}`,
        'Z',
      ].join(' ');
    }
    const a0 = start * Math.PI * 2 - Math.PI / 2;
    const a1 = end * Math.PI * 2 - Math.PI / 2;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0);
    const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const x2 = cx + r * Math.cos(a1), y2 = cy + r * Math.sin(a1);
    const x3 = cx + r * Math.cos(a0), y3 = cy + r * Math.sin(a0);
    const large = end - start > 0.5 ? 1 : 0;
    return [
      `M ${x0} ${y0}`,
      `A ${R} ${R} 0 ${large} 1 ${x1} ${y1}`,
      `L ${x2} ${y2}`,
      `A ${r} ${r} 0 ${large} 0 ${x3} ${y3}`,
      'Z',
    ].join(' ');
  }
  return (
    <div style={{ position: 'relative', display: 'flex', flexDirection: 'column', alignItems: 'center', width: '100%' }}>
      <div style={{ position: 'relative', width: W, height: W }}>
        <svg width={W} height={W} viewBox={`0 0 ${W} ${W}`}>
          {segments.map(seg => (
            <path key={seg.key} d={arcPath(seg.start, seg.end)} fill={seg.color}
              stroke="#fff" strokeWidth="1.5"/>
          ))}
        </svg>
        <div className="donut-center">
          <div className="donut-center-value">{total}</div>
          <div className="donut-center-label">{centerLabel}</div>
        </div>
      </div>
      <div className="chart-legend" style={{ marginTop: 14, borderTop: 0, paddingTop: 0 }}>
        {segments.map(seg => (
          <span key={seg.key} className="chart-legend-item">
            <span className="chart-legend-dot" style={{ background: seg.color }}/>
            {seg.label} · {seg.value}
          </span>
        ))}
      </div>
    </div>
  );
}

function PieChart({ data, centerLabel = '總計' }) {
  // 跟 Donut 一樣,但內半徑為 0
  if (data.length === 0) return <div className="chart-empty">無資料</div>;
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const W = 200, R = 84, cx = W/2, cy = W/2;
  let cumulative = 0;
  const segments = data.map(d => {
    const start = cumulative / total;
    cumulative += d.value;
    const end = cumulative / total;
    return { ...d, start, end };
  });
  function piePath(start, end) {
    if (end - start >= 0.9999) {
      return [
        `M ${cx + R} ${cy}`,
        `A ${R} ${R} 0 1 1 ${cx - R} ${cy}`,
        `A ${R} ${R} 0 1 1 ${cx + R} ${cy}`,
        'Z',
      ].join(' ');
    }
    const a0 = start * Math.PI * 2 - Math.PI / 2;
    const a1 = end * Math.PI * 2 - Math.PI / 2;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0);
    const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const large = end - start > 0.5 ? 1 : 0;
    return [
      `M ${cx} ${cy}`,
      `L ${x0} ${y0}`,
      `A ${R} ${R} 0 ${large} 1 ${x1} ${y1}`,
      'Z',
    ].join(' ');
  }
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', width: '100%' }}>
      <svg width={W} height={W} viewBox={`0 0 ${W} ${W}`}>
        {segments.map(seg => (
          <path key={seg.key} d={piePath(seg.start, seg.end)} fill={seg.color}
            stroke="#fff" strokeWidth="1.5"/>
        ))}
      </svg>
      <div className="chart-legend" style={{ marginTop: 14, borderTop: 0, paddingTop: 0 }}>
        {segments.map(seg => (
          <span key={seg.key} className="chart-legend-item">
            <span className="chart-legend-dot" style={{ background: seg.color }}/>
            {seg.label} · {seg.value}
          </span>
        ))}
      </div>
    </div>
  );
}

function LineChart({ data, height = 200 }) {
  // 折線適合時序資料 — 把資料當作有順序的時間軸
  if (data.length === 0) return <div className="chart-empty">無資料</div>;
  const max = Math.max(...data.map(d => d.value), 1);
  const padding = { top: 16, right: 12, bottom: 28, left: 28 };
  const W = 320, H = height;
  const innerW = W - padding.left - padding.right;
  const innerH = H - padding.top - padding.bottom;
  const stepX = data.length > 1 ? innerW / (data.length - 1) : 0;
  const points = data.map((d, i) => ({
    x: padding.left + i * stepX,
    y: padding.top + innerH - (d.value / max) * innerH,
    value: d.value,
    label: d.label,
  }));
  const pathD = points.map((p, i) => (i === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ');
  const areaD = points.length > 0
    ? `${pathD} L ${points[points.length-1].x} ${padding.top + innerH} L ${points[0].x} ${padding.top + innerH} Z`
    : '';
  const gridLines = [0, 0.5, 1].map(p => Math.round(max * p));

  return (
    <svg className="svg-chart" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet">
      {gridLines.map((v, i) => {
        const y = padding.top + innerH - (v / max) * innerH;
        return (
          <g key={i}>
            <line x1={padding.left} x2={W - padding.right} y1={y} y2={y} className="line-grid"/>
            <text x={padding.left - 4} y={y + 3} fontSize="9" textAnchor="end" fill="#8a93a3">{v}</text>
          </g>
        );
      })}
      <path d={areaD} className="line-area"/>
      <path d={pathD} className="line-path"/>
      {points.map((p, i) => (
        <g key={i}>
          <circle cx={p.x} cy={p.y} r="3.5" className="line-dot"/>
          <text x={p.x} y={H - padding.bottom + 14} fontSize="9" textAnchor="middle" fill="#5a6270">
            {p.label}
          </text>
        </g>
      ))}
    </svg>
  );
}

function ChartByType({ type, data, centerLabel }) {
  if (type === 'bar') return <VerticalBar data={data}/>;
  if (type === 'hbar') return <HorizontalBar data={data}/>;
  if (type === 'donut') return <DonutChart data={data} centerLabel={centerLabel}/>;
  if (type === 'pie') return <PieChart data={data} centerLabel={centerLabel}/>;
  if (type === 'line') return <LineChart data={data}/>;
  return null;
}

    .filter(k => engineerCounts[k])
    .map(k => ({
      key: k, label: K.ENG_LABEL[k], value: engineerCounts[k],
      color: K.ENG_TONE[k].fg,
    }));

  // 狀態分布
  const statusCounts = { '已完成': 0, '處理中': 0, '暫停': 0 };
  anomalies.forEach(a => { if (statusCounts[a.status] !== undefined) statusCounts[a.status]++; });
  const statusData = [
    { key: '已完成', label: '已完成', value: statusCounts['已完成'], color: '#1d6f43' },
    { key: '處理中', label: '處理中', value: statusCounts['處理中'], color: '#c79b2a' },
    { key: '暫停',   label: '暫停',   value: statusCounts['暫停'],   color: '#c0392b' },
  ].filter(d => d.value > 0);

  // 採購人員 (IPA)
  const personCounts = {};
  ipa.forEach(r => { personCounts[r.person] = (personCounts[r.person] || 0) + r.quantity; });
  const personData = K.ENG_ORDER
    .filter(k => personCounts[k])
    .map(k => ({
      key: k, label: K.ENG_LABEL[k], value: personCounts[k],
      color: K.ENG_TONE[k].fg,
    }));

  // 設備採購方式
  const methodCounts = {};
  tools.forEach(r => { methodCounts[r.method] = (methodCounts[r.method] || 0) + (r.price * r.quantity); });
  const methodData = Object.entries(methodCounts).map(([k, v]) => ({
    key: k, label: k, value: v,
    color: k === 'Easy Flow' ? '#0c7a99' : '#c79b2a',
  }));

  const totalBarrels = ipa.reduce((s, r) => s + r.quantity, 0);
  const totalSpend = tools.reduce((s, r) => s + r.price * r.quantity, 0);

  return (
    <div className="iss-analytic">
      {/* KPI */}
      <div className="dash-kpis" style={{ paddingTop: 0 }}>
        <div className="dash-kpi">
          <div className="dash-kpi-label">總異常</div>
          <div className="dash-kpi-value">{anomalies.length}</div>
          <div className="dash-kpi-sub">累計紀錄</div>
        </div>
        <div className="dash-kpi">
          <div className="dash-kpi-label">處理中</div>
          <div className="dash-kpi-value" style={{ color: '#c79b2a' }}>{statusCounts['處理中']}</div>
          <div className="dash-kpi-sub">待解決</div>
        </div>
        <div className="dash-kpi">
          <div className="dash-kpi-label">已完成</div>
          <div className="dash-kpi-value" style={{ color: '#1d6f43' }}>{statusCounts['已完成']}</div>
          <div className="dash-kpi-sub">結案</div>
        </div>
        <div className="dash-kpi">
          <div className="dash-kpi-label">IPA 採購 (桶)</div>
          <div className="dash-kpi-value">{totalBarrels}</div>
          <div className="dash-kpi-sub">{ipa.length} 筆紀錄</div>
        </div>
        <div className="dash-kpi">
          <div className="dash-kpi-label">設備支出</div>
          <div className="dash-kpi-value" style={{ color: '#0c7a99' }}>NT$ {totalSpend.toLocaleString()}</div>
          <div className="dash-kpi-sub">{tools.length} 項設備</div>
        </div>
      </div>

      <div className="dash-section">
        <div className="dash-section-title">分析圖表</div>
        <div className="dash-section-sub">PIVOT ANALYSIS</div>
      </div>

      <div className="iss-grid">
        <div className="chart-card">
          <div className="chart-card-head">
            <div className="chart-card-title">異常 · 工程師分布</div>
            <div className="chart-card-meta">HORIZONTAL BAR</div>
          </div>
          <div className="chart-body">
            <HorizontalBar data={engineerData}/>
          </div>
        </div>

        <div className="chart-card">
          <div className="chart-card-head">
            <div className="chart-card-title">異常 · 狀態分布</div>
            <div className="chart-card-meta">DONUT</div>
          </div>
          <div className="chart-body">
            <DonutChart data={statusData} centerLabel="異常案件"/>
          </div>
        </div>

        <div className="chart-card">
          <div className="chart-card-head">
            <div className="chart-card-title">IPA 採購 · 人員(桶數)</div>
            <div className="chart-card-meta">VERTICAL BAR</div>
          </div>
          <div className="chart-body">
            <VerticalBar data={personData}/>
          </div>
        </div>

        <div className="chart-card">
          <div className="chart-card-head">
            <div className="chart-card-title">設備支出 · 採購方式</div>
            <div className="chart-card-meta">DONUT</div>
          </div>
          <div className="chart-body">
            <DonutChart data={methodData} centerLabel="NT$"/>
          </div>
        </div>

        <div className="chart-card">
          <div className="chart-card-head">
            <div className="chart-card-title">設備清單 · 金額排行</div>
            <div className="chart-card-meta">HORIZONTAL BAR</div>
          </div>
          <div className="chart-body">
            <HorizontalBar data={
              [...tools]
                .sort((a,b) => b.price*b.quantity - a.price*a.quantity)
                .slice(0, 6)
                .map(t => ({
                  key: t.seq,
                  label: t.product.length > 8 ? t.product.slice(0,8)+'…' : t.product,
                  value: t.price * t.quantity,
                  color: '#0c7a99',
                }))
            }/>
          </div>
        </div>

        <div className="chart-card">
          <div className="chart-card-head">
            <div className="chart-card-title">IPA 採購 · 月份趨勢</div>
            <div className="chart-card-meta">LINE</div>
          </div>
          <div className="chart-body">
            <LineChart data={(() => {
              const monthly = {};
              ipa.forEach(r => {
                const m = (r.purchaseDate || '').slice(0, 7);
                if (!m) return;
                monthly[m] = (monthly[m] || 0) + r.quantity;
              });
              return Object.keys(monthly).sort().map(m => ({
                key: m,
                label: m.slice(2).replace('-', '/'),
                value: monthly[m],
                color: '#0c7a99',
              }));
            })()}/>
          </div>
        </div>
      </div>
    </div>
  );
}

window.IssuesView = IssuesView;

window.IssuesStats = IssuesStats;
</script>

<script type="text/babel" data-presets="react">

const { useState: useStateApp, useEffect: useEffectApp } = React;

// ── Login ──
function LoginPage({ onLogin }) {
  const [email, setEmail] = useStateApp('');
  const [pw,    setPw]    = useStateApp('');
  const [err,   setErr]   = useStateApp('');
  const [busy,  setBusy]  = useStateApp(false);

  const submit = async () => {
    if (!email || !pw) { setErr('請填寫 Email 與密碼'); return; }
    setBusy(true); setErr('');
    try {
      if (!window._fbReady) throw new Error('Firebase 尚未初始化，請確認 firebase-config.js');
      const cred = await FBAuth.signIn(email.trim().toLowerCase(), pw);
      const u    = await FBAuth.getUser(cred.user.uid);
      const user = u || { _id:cred.user.uid, email:cred.user.email, displayName:cred.user.email, permissions:['view_board','view_issues'], active:true };
      if (user.active === false) { await FBAuth.signOut(); throw new Error('此帳號已被停用'); }
      onLogin(user);
    } catch(e) {
      const msg = (e.code==='auth/wrong-password'||e.code==='auth/user-not-found'||e.code==='auth/invalid-credential') ? 'Email 或密碼錯誤' : e.message;
      setErr(msg);
    } finally { setBusy(false); }
  };

  return (
    <div className="login-page">
      <div className="login-card">
        <div className="login-brand">
          <div className="login-brand-mark"/>
          <h1>3D Print Workspace</h1>
          <p>WORK BOARD · ISSUES · RESOURCES</p>
        </div>
        {err && <div className="login-err show">{err}</div>}
        <div className="login-fg"><label>Email</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com"
            onKeyDown={e=>e.key==='Enter'&&document.getElementById('lpw').focus()}/></div>
        <div className="login-fg"><label>密碼</label>
          <input id="lpw" type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••"
            onKeyDown={e=>e.key==='Enter'&&submit()}/></div>
        <button className="login-submit" onClick={submit} disabled={busy}>{busy?'登入中...':'🔐 登入'}</button>
      </div>
    </div>
  );
}

// ── User Modal ──
function UserModal({ item, isCreate, onClose, onSave }) {
  const empty = { displayName:'', email:'', permissions:[...ROLE_PRESETS.operator], active:true, password:'' };
  const [form, setForm] = useStateApp(item?{...item,password:''}:empty);
  const [busy, setBusy] = useStateApp(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const toggle = p => { const ps=form.permissions||[]; set('permissions',ps.includes(p)?ps.filter(x=>x!==p):[...ps,p]); };
  const preset = r => set('permissions',[...ROLE_PRESETS[r]]);
  const save = async () => {
    if (!form.displayName||!form.email) { showToast('請填姓名與Email','err'); return; }
    if (isCreate&&(!form.password||form.password.length<6)) { showToast('密碼至少6字元','err'); return; }
    setBusy(true);
    try { await onSave(form); onClose(); }
    catch(e) { showToast(e.message||'失敗','err'); }
    finally { setBusy(false); }
  };
  return (
    <div className="m-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="m-box m-box-wide">
        <div className="m-hd"><h3>{isCreate?'➕ 新增使用者':'✏️ 編輯使用者'}</h3><button className="m-close" onClick={onClose}>×</button></div>
        <div className="m-body">
          <div className="m-row">
            <div className="m-field"><label style={{display:'block',fontSize:11.5,fontWeight:600,color:'#5a6270',marginBottom:5}}>姓名 *</label>
              <input style={{width:'100%',padding:'8px 11px',border:'1.5px solid #e6e8ec',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none'}} value={form.displayName} onChange={e=>set('displayName',e.target.value)}/></div>
            <div className="m-field"><label style={{display:'block',fontSize:11.5,fontWeight:600,color:'#5a6270',marginBottom:5}}>Email *</label>
              <input style={{width:'100%',padding:'8px 11px',border:'1.5px solid #e6e8ec',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none'}} type="email" value={form.email} onChange={e=>set('email',e.target.value)} disabled={!isCreate}/></div>
          </div>
          {isCreate&&<div className="m-row">
            <div className="m-field"><label style={{display:'block',fontSize:11.5,fontWeight:600,color:'#5a6270',marginBottom:5}}>密碼 *</label>
              <input style={{width:'100%',padding:'8px 11px',border:'1.5px solid #e6e8ec',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none'}} type="password" value={form.password} onChange={e=>set('password',e.target.value)} placeholder="至少6字元"/></div>
            <div className="m-field"><label style={{display:'block',fontSize:11.5,fontWeight:600,color:'#5a6270',marginBottom:5}}>狀態</label>
              <select style={{width:'100%',padding:'8px 11px',border:'1.5px solid #e6e8ec',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none'}} value={form.active?'on':'off'} onChange={e=>set('active',e.target.value==='on')}><option value="on">啟用</option><option value="off">停用</option></select></div>
          </div>}
          {!isCreate&&<div className="m-field"><label style={{display:'block',fontSize:11.5,fontWeight:600,color:'#5a6270',marginBottom:5}}>狀態</label>
            <select style={{width:'100%',padding:'8px 11px',border:'1.5px solid #e6e8ec',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none'}} value={form.active?'on':'off'} onChange={e=>set('active',e.target.value==='on')}><option value="on">啟用</option><option value="off">停用</option></select></div>}
          <div className="m-field"><label style={{display:'block',fontSize:11.5,fontWeight:600,color:'#5a6270',marginBottom:5}}>快速套用角色</label>
            <div className="preset-row">
              <button className="preset-chip p-admin" onClick={()=>preset('admin')}>👑 管理員</button>
              <button className="preset-chip p-mgr"   onClick={()=>preset('manager')}>🔷 主管</button>
              <button className="preset-chip p-eng"   onClick={()=>preset('operator')}>🔩 工程師</button>
              <button className="preset-chip p-view"  onClick={()=>preset('viewer')}>👁 檢視者</button>
            </div>
          </div>
          <div className="m-field"><label style={{display:'block',fontSize:11.5,fontWeight:600,color:'#5a6270',marginBottom:5}}>個別權限</label>
            <div className="perm-grid">
              {Object.entries(PERMS_MAP).map(([k,l])=>{const on=(form.permissions||[]).includes(k);return(
                <div key={k} className={'perm-chip'+(on?' on':'')} onClick={()=>toggle(k)}>
                  <input type="checkbox" checked={on} onChange={()=>{}}/><label>{l}</label>
                </div>);})}
            </div>
          </div>
        </div>
        <div className="m-foot"><button className="btn-cancel" onClick={onClose}>取消</button><button className="btn-save" onClick={save} disabled={busy}>{busy?'儲存中...':'💾 儲存'}</button></div>
      </div>
    </div>
  );
}

// ── Admin Modal ──
function AdminModal({ currentUser, onClose }) {
  const [tab,      setTab]      = useStateApp('overview');
  const [users,    setUsers]    = useStateApp([]);
  const [modal,    setModal]    = useStateApp(false);
  const [editU,    setEditU]    = useStateApp(null);
  const [isCreate, setIsCreate] = useStateApp(false);
  const [stats,    setStats]    = useStateApp({orders:0,anomalies:0,equipment:0,ipa:0});

  useEffectApp(()=>{
    FBAuth.getUsers().then(setUsers);
    Promise.all([
      window._db.collection('orders').get(),
      window._db.collection('anomalies').get(),
      window._db.collection('equipment').get(),
      window._db.collection('ipa_purchases').get(),
    ]).then(([o,a,e,i])=>setStats({orders:o.size,anomalies:a.size,equipment:e.size,ipa:i.size}));
  },[]);

  const reload = () => FBAuth.getUsers().then(setUsers);
  const roleOf = u => {
    const p=u.permissions||[];
    if(p.includes('admin')) return {l:'管理員',c:'admin'};
    if(p.includes('edit_board')&&p.includes('edit_issues')) return {l:'主管',c:'manager'};
    if(p.includes('edit_board')) return {l:'工程師',c:'operator'};
    return {l:'檢視者',c:'viewer'};
  };
  const handleSave = async form => {
    if (isCreate) {
      await FBAuth.createUser(form.email, form.password, {displayName:form.displayName,email:form.email,permissions:form.permissions||[],active:form.active!==false});
      showToast('使用者已建立 ✓');
    } else {
      await FBAuth.updateUser(editU._id, {displayName:form.displayName,permissions:form.permissions||[],active:form.active!==false});
      showToast('已更新 ✓');
    }
    reload();
  };
  const toggleActive = async u => {
    await FBAuth.updateUser(u._id,{active:!u.active});
    showToast(u.active?'已停用':'已啟用',u.active?'inf':'ok'); reload();
  };
  const delUser = async u => {
    if(u._id===currentUser._id){showToast('不可刪除自己','err');return;}
    if(!confirm('刪除「'+u.displayName+'」？'))return;
    await FBAuth.deleteUser(u._id); showToast('已刪除','inf'); reload();
  };
  return (
    <div className="m-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="m-box m-box-wide" onClick={e=>e.stopPropagation()}>
        <div className="m-hd">
          <div style={{display:'flex',gap:16,alignItems:'center'}}>
            <h3>⚙️ 管理員後台</h3>
            <div className="seg">
              {[['overview','📊 總覽'],['users','👥 使用者']].map(([k,l])=>(
                <button key={k} className={'seg-btn'+(tab===k?' active':'')} onClick={()=>setTab(k)}>{l}</button>
              ))}
            </div>
          </div>
          <button className="m-close" onClick={onClose}>×</button>
        </div>
        <div className="m-body" style={{paddingBottom:0}}>
          {tab==='overview'&&<>
            <div className="adm-stats">
              {[['👥','使用者',users.length],['📋','訂單',stats.orders],['⚠️','異常',stats.anomalies],['🔧','設備',stats.equipment]].map(([ic,l,v])=>(
                <div key={l} className="adm-stat"><div className="adm-stat-icon">{ic}</div><div className="adm-stat-val">{v}</div><div className="adm-stat-lbl">{l}</div></div>
              ))}
            </div>
            <div style={{background:'#fafbfc',border:'1px solid #e6e8ec',borderRadius:8,padding:'16px 18px',fontSize:13,lineHeight:1.9,color:'#5a6270',marginBottom:20}}>
              Firebase 專案：<strong style={{color:'#0a0e14'}}>{typeof FIREBASE_CONFIG!=='undefined'?FIREBASE_CONFIG.projectId:'未設定'}</strong>
            </div>
          </>}
          {tab==='users'&&<>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
              <div style={{fontSize:13,fontWeight:700}}>使用者管理</div>
              <span style={{fontSize:11.5,color:'#8a93a3',fontFamily:'monospace'}}>{users.length} 個帳號</span>
              <button className="btn-add" style={{marginLeft:'auto'}} onClick={()=>{setEditU(null);setIsCreate(true);setModal(true);}}>+ 新增使用者</button>
            </div>
            <div style={{overflowX:'auto'}}>
              <table className="u-tbl">
                <thead><tr><th>使用者</th><th>Email</th><th>角色</th><th>狀態</th><th>操作</th></tr></thead>
                <tbody>
                  {users.map(u=>{const r=roleOf(u);return(
                    <tr key={u._id}>
                      <td><div style={{display:'flex',alignItems:'center',gap:10}}>
                        <div className="u-avatar">{(u.displayName||'?')[0].toUpperCase()}</div>
                        <div>
                          <div style={{fontWeight:600,fontSize:13}}>{u.displayName}{u._id===currentUser._id&&<span style={{fontSize:10,color:'#8a93a3',marginLeft:6}}>(你)</span>}</div>
                          <div style={{fontSize:10.5,color:'#8a93a3'}}>{(u.permissions||[]).slice(0,3).map(p=>PERMS_MAP[p]||p).join(' · ')}</div>
                        </div>
                      </div></td>
                      <td style={{fontSize:12,color:'#8a93a3'}}>{u.email}</td>
                      <td><span className={'role-chip '+r.c}>{r.l}</span></td>
                      <td><span className={'st-dot '+(u.active?'on':'off')}>{u.active?'● 啟用':'○ 停用'}</span></td>
                      <td><div style={{display:'flex',gap:4}}>
                        <button className="btn-cancel" style={{padding:'3px 8px',fontSize:12}} onClick={()=>{setEditU(u);setIsCreate(false);setModal(true);}}>✎</button>
                        <button className="btn-cancel" style={{padding:'3px 8px',fontSize:12}} onClick={()=>toggleActive(u)}>{u.active?'⏸':'▶'}</button>
                        {u._id!==currentUser._id&&<button className="btn-cancel" style={{padding:'3px 8px',fontSize:12,borderColor:'#ffc9c9',color:'#c0392b'}} onClick={()=>delUser(u)}>✕</button>}
                      </div></td>
                    </tr>
                  );})}
                  {!users.length&&<tr><td colSpan="5" style={{textAlign:'center',padding:'40px',color:'#8a93a3'}}>無資料</td></tr>}
                </tbody>
              </table>
            </div>
          </>}
        </div>
        <div className="m-foot"><button className="btn-cancel" onClick={onClose}>關閉</button></div>
      </div>
      {modal&&<UserModal item={editU} isCreate={isCreate} onClose={()=>setModal(false)} onSave={handleSave}/>}
    </div>
  );
}

// ── Shell ──
const APPS = [
  { key:'board',  label:'工作看板',  sub:'WORK BOARD',
    icon: <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="3" width="3.5" height="12" rx="1" stroke="currentColor" strokeWidth="1.4"/><rect x="7.25" y="3" width="3.5" height="7.5" rx="1" stroke="currentColor" strokeWidth="1.4"/><rect x="12.5" y="3" width="3.5" height="10" rx="1" stroke="currentColor" strokeWidth="1.4"/></svg> },
  { key:'issues', label:'異常與資源', sub:'ISSUES · RESOURCES',
    icon: <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2L16 14.5H2L9 2Z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/><line x1="9" y1="7" x2="9" y2="10.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/><circle cx="9" cy="12.5" r="0.8" fill="currentColor"/></svg> },
];

function Shell({ user, onLogout }) {
  const K = window.K;
  const [app, setApp] = useStateApp('board');
  const [showAdmin, setShowAdmin] = useStateApp(false);
  const isAdmin = window.hasPerm(user, 'admin');

  useEffectApp(()=>{
    const h=(window.location.hash||'').replace('#','').split('/')[0];
    if(['board','issues'].includes(h)) setApp(h);
  },[]);
  useEffectApp(()=>{ history.replaceState(null,'','#'+app); },[app]);

  return (
    <div className="shell">
      <aside className="shell-sidebar">
        <div className="sidebar-brand">
          <div className="shell-brand-mark"/>
          <div><div className="shell-brand-title">3D Print</div><div className="shell-brand-sub">WORKSPACE</div></div>
        </div>
        <nav className="sidebar-nav" role="tablist">
          {APPS.map(a=>(
            <button key={a.key} role="tab" aria-selected={app===a.key} className="sidebar-item" onClick={()=>setApp(a.key)}>
              <span className="sidebar-item-icon">{a.icon}</span>
              <span className="sidebar-item-text"><span className="sidebar-item-label">{a.label}</span><span className="sidebar-item-sub">{a.sub}</span></span>
            </button>
          ))}
          {isAdmin&&<>
            <div className="sb-divider"/>
            <div className="sb-admin-lbl">ADMIN</div>
            <button className="sidebar-item" onClick={()=>setShowAdmin(true)}>
              <span className="sidebar-item-icon"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="7" r="3" stroke="currentColor" strokeWidth="1.4"/><path d="M3 15c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg></span>
              <span className="sidebar-item-text"><span className="sidebar-item-label">管理員後台</span><span className="sidebar-item-sub">ADMIN PANEL</span></span>
            </button>
          </>}
        </nav>
        <div className="sidebar-foot">
          <div className="sidebar-foot-date">{K.fmtYmd(K.TODAY)}</div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:140,fontSize:10.5,color:'var(--ink-4)',fontFamily:"'JetBrains Mono',monospace"}}>{user.displayName||user.email}</span>
            <button onClick={onLogout} style={{background:'none',border:'none',fontSize:10.5,color:'var(--ink-4)',cursor:'pointer',fontFamily:'inherit'}}>登出</button>
          </div>
        </div>
      </aside>
      <div className="shell-main" style={{display:'flex',flexDirection:'column',flex:1,minWidth:0,height:'100vh',overflow:'hidden'}}>
        {app==='board'  && <window.WorkBoardApp user={user}/>}
        {app==='issues' && <window.IssuesApp    user={user}/>}
      </div>
      {showAdmin&&<AdminModal currentUser={user} onClose={()=>setShowAdmin(false)}/>}
    </div>
  );
}

// ── App Root ──
function App() {
  const [user,     setUser]     = useStateApp(null);
  const [checking, setChecking] = useStateApp(true);

  useEffectApp(()=>{
    if (!window._fbReady) { setChecking(false); return; }
    FBAuth.onStateChanged(async fbUser => {
      if (fbUser) {
        const u = await FBAuth.getUser(fbUser.uid);
        const user = u || { _id:fbUser.uid, email:fbUser.email, displayName:fbUser.email, permissions:['view_board','view_issues'], active:true };
        if (user.active !== false) setUser(user);
      }
      setChecking(false);
    });
  },[]);

  if (checking) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'#8a93a3',fontSize:14}}>⏳</div>;
  if (!user)    return <LoginPage onLogin={setUser}/>;
  return <Shell user={user} onLogout={async()=>{ await FBAuth.signOut(); setUser(null); }}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
