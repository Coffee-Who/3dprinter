<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>異常與資源 · 3D Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#fff}
/* 主外殼 — 左側 sidebar + 上方 tabs */
:root {
  --bg: #ffffff;
  --bg-soft: #fafbfc;
  --line: #e6e8ec;
  --line-soft: #eef0f3;
  --ink: #0a0e14;
  --ink-2: #3b4250;
  --ink-3: #5a6270;
  --ink-4: #8a93a3;
  --accent: #0c7a99;
  --accent-soft: #e6f1f6;

  --sidebar-w: 224px;
}

.shell {
  min-height: 100vh;
  background: var(--bg);
  display: flex;
}

/* ── Sidebar ───────────────────────── */
.shell-sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  background: var(--bg-soft);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}

.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 16px 16px;
  border-bottom: 1px solid var(--line);
}
.shell-brand-mark {
  width: 28px; height: 28px;
  background: #0a0e14;
  border-radius: 7px;
  position: relative;
  flex-shrink: 0;
}
.shell-brand-mark::before, .shell-brand-mark::after {
  content: ''; position: absolute; background: var(--accent);
}
.shell-brand-mark::before {
  top: 6px; left: 6px; width: 6px; height: 6px; border-radius: 1px;
}
.shell-brand-mark::after {
  bottom: 6px; right: 6px; width: 10px; height: 2px; border-radius: 1px;
}
.shell-brand-title {
  font-size: 14px; font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.1;
  color: var(--ink);
}
.shell-brand-sub {
  font-size: 9.5px;
  color: var(--ink-4);
  font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;
  letter-spacing: 0.1em;
  margin-top: 3px;
}

.sidebar-nav {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 8px;
  overflow-y: auto;
}
.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 0;
  background: transparent;
  border-radius: 6px;
  cursor: pointer;
  text-align: left;
  font: inherit;
  color: var(--ink-3);
  transition: background 0.12s, color 0.12s;
  width: 100%;
}
.sidebar-item:hover {
  background: var(--bg);
  color: var(--ink);
}
.sidebar-item[aria-selected="true"] {
  background: var(--bg);
  color: var(--ink);
  box-shadow: 0 0 0 1px var(--line);
}
.sidebar-item[aria-selected="true"] .sidebar-item-icon {
  color: var(--accent);
}
.sidebar-item-icon {
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-4);
  flex-shrink: 0;
}
.sidebar-item-text {
  display: flex; flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.sidebar-item-label {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.005em;
  line-height: 1.1;
}
.sidebar-item-sub {
  font-size: 9.5px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--ink-4);
  letter-spacing: 0.08em;
}

.sidebar-foot {
  padding: 14px 16px;
  border-top: 1px solid var(--line);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: var(--ink-4);
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.sidebar-foot-date {
  color: var(--ink-2);
  font-feature-settings: 'tnum';
}

/* ── Main area ─────────────────────── */
.shell-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.shell-top {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 28px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 20;
  min-height: 48px;
}

.shell-tabs {
  display: flex;
  gap: 2px;
}
.shell-tab {
  position: relative;
  border: 0; background: transparent;
  font: inherit; font-size: 13px; font-weight: 500;
  color: var(--ink-3);
  padding: 14px 16px 14px;
  cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  transition: color 0.15s;
}
.shell-tab:hover { color: var(--ink); }
.shell-tab[aria-selected="true"] {
  color: var(--ink);
  font-weight: 600;
}
.shell-tab[aria-selected="true"]::after {
  content: '';
  position: absolute;
  left: 8px; right: 8px;
  bottom: -1px;
  height: 2px;
  background: var(--accent);
  border-radius: 1px;
}
.shell-tab-icon {
  width: 14px; height: 14px;
  display: inline-flex; align-items: center; justify-content: center;
  color: currentColor;
  flex-shrink: 0;
}

.shell-spacer { flex: 1; }

.shell-aux {
  font-size: 10.5px;
  color: var(--ink-4);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.08em;
}

.shell-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--bg);
}

/* ── 通用 toolbar(view 內共用) ─── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 28px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  flex-wrap: wrap;
}
.toolbar-title {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin-right: 8px;
}
.toolbar-sub {
  font-size: 11.5px;
  color: var(--ink-4);
  font-family: 'JetBrains Mono', monospace;
  margin-right: auto;
}

.t-search {
  display: flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--ink-4);
  min-width: 220px;
}
.t-search:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
  color: var(--ink-2);
}
.t-search input {
  border: 0; outline: 0; background: transparent;
  font: inherit; width: 100%; color: var(--ink);
}
.t-search input::placeholder { color: var(--ink-4); }

.t-sel {
  height: 32px;
  padding: 0 28px 0 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--ink-2);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' fill='none' stroke='%235a6270' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 8px center;
}
.t-sel:hover { border-color: #cdd1d8; }
.t-sel:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.t-btn {
  height: 32px;
  padding: 0 14px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink-2);
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.t-btn:hover { border-color: #cdd1d8; color: var(--ink); }
.t-btn-primary {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}
.t-btn-primary:hover { background: #25303f; color: #fff; }

/* responsive — sidebar 縮成 icon-only */
@media (max-width: 960px) {
  :root { --sidebar-w: 60px; }
  .sidebar-brand > div:not(.shell-brand-mark) { display: none; }
  .sidebar-item-text { display: none; }
  .sidebar-item { justify-content: center; padding: 10px 8px; }
  .sidebar-foot { display: none; }
}
@media (max-width: 600px) {
  .shell-top { padding: 0 14px; gap: 6px; flex-wrap: wrap; }
  .shell-tab { padding: 11px 10px; font-size: 12px; }
  .shell-aux { display: none; }
}

/* 總表 view */
.table-view {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  background: var(--bg);
}

.table-wrap {
  flex: 1;
  overflow: auto;
  padding: 0 28px 24px;
}

.kt {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 12.5px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}

.kt thead {
  background: #fafbfc;
}
.kt th {
  text-align: left;
  font-weight: 600;
  font-size: 10.5px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--ink-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
  position: sticky;
  top: 0;
  background: #fafbfc;
  z-index: 1;
  user-select: none;
}
.kt th.sortable {
  cursor: pointer;
}
.kt th.sortable:hover { color: var(--ink); }
.kt th .sort-indicator {
  display: inline-block;
  margin-left: 4px;
  color: var(--ink-4);
  font-size: 9px;
  font-feature-settings: 'tnum';
}
.kt th.sorted { color: var(--accent); }
.kt th.sorted .sort-indicator { color: var(--accent); }

.kt td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--line-soft);
  color: var(--ink-2);
  vertical-align: middle;
}
.kt tbody tr:hover {
  background: var(--bg-soft);
}
.kt tbody tr:last-child td { border-bottom: 0; }

.kt .col-seq    { text-align: right; font-family: 'JetBrains Mono', monospace; color: var(--ink-4); width: 56px; font-feature-settings:'tnum'; }
.kt .col-id     { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-weight: 500; font-size: 11.5px; }
.kt .col-eng    { white-space: nowrap; }
.kt .col-date   { font-family: 'JetBrains Mono', monospace; font-feature-settings:'tnum'; color: var(--ink-3); font-size: 11.5px; white-space: nowrap; }
.kt .col-prog   { width: 130px; }
.kt .col-machine{ font-family: 'JetBrains Mono', monospace; color: var(--ink-2); font-size: 11.5px; }
.kt .col-actions{ width: 90px; text-align: right; }
.kt .col-customer { font-weight: 500; color: var(--ink); }

/* 表內 chip / badge */
.kt-pill {
  display: inline-flex; align-items: center;
  height: 18px;
  padding: 0 8px;
  font-size: 10.5px;
  border-radius: 999px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  white-space: nowrap;
}
.kt-pill-todo      { background: #eef0f3; color: #5a6270; }
.kt-pill-blocked   { background: #fbf3dc; color: #8b6b13; }
.kt-pill-progress  { background: #e6f1f6; color: #0c7a99; }
.kt-pill-done      { background: #e6f1ea; color: #1d6f43; }
.kt-pill-cancelled { background: #f0f1f4; color: #8a93a3; }

.kt-mat-ok      { color: #1d6f43; font-weight: 500; }
.kt-mat-need    { color: #8b6b13; font-weight: 500; }

.kt-eng {
  display: inline-flex; align-items: center; gap: 6px;
}
.kt-eng-dot {
  width: 18px; height: 18px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
}

.kt-prog {
  display: flex; align-items: center; gap: 8px;
}
.kt-prog-bar {
  flex: 1;
  height: 4px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
  min-width: 60px;
}
.kt-prog-fill {
  height: 100%;
  background: var(--accent);
}
.kt-prog-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-2);
  font-feature-settings:'tnum';
  min-width: 32px;
  text-align: right;
}

.kt-due {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  font-feature-settings:'tnum';
  white-space: nowrap;
}
.kt-due-red { color: #c0392b; font-weight: 600; }
.kt-due-amber { color: #c79b2a; font-weight: 600; }

.kt-act {
  display: inline-flex; gap: 4px;
}
.kt-actbtn {
  width: 24px; height: 24px;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 5px;
  cursor: pointer;
  color: var(--ink-3);
  display: inline-flex; align-items: center; justify-content: center;
  transition: all 0.12s;
  font-size: 11px;
}
.kt-actbtn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.kt-actbtn.danger:hover { border-color: #c0392b; color: #c0392b; background: #fbe7e3; }

/* 空狀態 */
.kt-empty {
  padding: 60px 0;
  text-align: center;
  color: var(--ink-4);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}

/* 分頁 */
.kt-pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 28px;
  border-top: 1px solid var(--line);
  background: var(--bg);
  font-size: 12px;
  color: var(--ink-3);
  font-family: 'JetBrains Mono', monospace;
  flex-wrap: wrap;
  gap: 12px;
}
.kt-pagination-info {
  display: flex; align-items: center; gap: 8px;
}
.kt-pagination-pages {
  display: flex; gap: 3px; align-items: center;
}
.kt-page {
  min-width: 28px; height: 28px;
  padding: 0 8px;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 5px;
  font: inherit; font-size: 11.5px;
  cursor: pointer; color: var(--ink-3);
  font-family: 'JetBrains Mono', monospace;
  font-feature-settings:'tnum';
}
.kt-page:hover { border-color: var(--accent); color: var(--accent); }
.kt-page[aria-current="true"] {
  background: var(--ink); color: #fff; border-color: var(--ink);
}
.kt-page:disabled { opacity: 0.4; cursor: not-allowed; }

/* 工作異常與資源 — 共用樣式
   reuse 大部分 .kt-* (來自 styles-table.css),這裡只加新增的元件 */

/* 子分頁(在 toolbar 內) */
.issues-subtabs {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 2px;
  gap: 2px;
  background: var(--bg);
}
.issues-subtab {
  border: 0; background: transparent;
  font: inherit; font-size: 12.5px;
  padding: 0 12px; height: 26px;
  border-radius: 4px;
  cursor: pointer; color: var(--ink-3);
  font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
}
.issues-subtab:hover { color: var(--ink); }
.issues-subtab[aria-selected="true"] {
  background: var(--ink); color: #fff;
}
.issues-subtab-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 0 5px;
  height: 14px;
  display: inline-flex; align-items: center;
  border-radius: 999px;
  background: rgba(0,0,0,0.06);
  font-feature-settings: 'tnum';
}
.issues-subtab[aria-selected="true"] .issues-subtab-count {
  background: rgba(255,255,255,0.18);
}

/* anomaly 進度子列 */
.kt-anomaly-sub {
  background: var(--bg-soft);
}
.kt-anomaly-sub td {
  font-size: 11.5px;
  color: var(--ink-3);
  padding-top: 6px;
  padding-bottom: 6px;
}
.kt-anomaly-sub-marker {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-4);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
}
.kt-anomaly-sub-marker::before {
  content: '';
  display: inline-block;
  width: 1px; height: 12px;
  background: var(--line);
  margin-left: 8px;
}

/* status pill (中文標籤) */
.kt-pill-完成      { background: #e6f1ea; color: #1d6f43; }
.kt-pill-處理      { background: #fbf3dc; color: #8b6b13; }
.kt-pill-暫停      { background: #fbe7e3; color: #8a1d12; }

/* 數量徽章 */
.kt-num-badge {
  display: inline-flex;
  align-items: center;
  padding: 1px 8px;
  border-radius: 4px;
  background: var(--accent-soft);
  color: var(--accent);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  font-feature-settings: 'tnum';
}

/* 金額欄 */
.kt-money {
  font-family: 'JetBrains Mono', monospace;
  font-feature-settings: 'tnum';
  color: var(--ink);
  font-weight: 600;
  text-align: right;
  white-space: nowrap;
}

/* 分析頁(issues dashboard)*/
.iss-analytic {
  flex: 1;
  overflow: auto;
  padding: 20px 28px 32px;
  background: var(--bg);
}
.iss-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 1100px) {
  .iss-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 720px) {
  .iss-grid { grid-template-columns: 1fr; }
}

/* Dashboard view */
.dash {
  flex: 1;
  overflow: auto;
  padding: 0 28px 32px;
  background: var(--bg);
}

/* KPI 列 */
.dash-kpis {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  padding: 18px 0;
}
.dash-kpi {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px 16px;
  background: var(--bg);
  position: relative;
}
.dash-kpi-label {
  font-size: 10.5px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--ink-4);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.dash-kpi-value {
  font-size: 30px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-top: 4px;
  line-height: 1.1;
  font-feature-settings: 'tnum';
}
.dash-kpi-sub {
  font-size: 10.5px;
  color: var(--ink-4);
  margin-top: 4px;
  font-family: 'JetBrains Mono', monospace;
}

/* 段落標題 */
.dash-section {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 16px 0 12px;
}
.dash-section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.dash-section-sub {
  font-size: 11px;
  color: var(--ink-4);
  font-family: 'JetBrains Mono', monospace;
}

/* 圖表卡片 */
.dash-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.chart-card {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  padding: 14px 16px 16px;
  display: flex;
  flex-direction: column;
  min-height: 280px;
}
.chart-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  gap: 8px;
}
.chart-card-title {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.005em;
}
.chart-card-meta {
  font-size: 10.5px;
  color: var(--ink-4);
  font-family: 'JetBrains Mono', monospace;
}

.chart-card.custom .chart-card-head {
  flex-wrap: wrap;
  gap: 6px;
}
.chart-card.custom .chart-card-title {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.chart-card.custom .chart-card-title::before {
  content: '⊕';
  color: var(--accent);
  font-weight: 400;
}

.chart-mini-sel {
  height: 26px;
  padding: 0 22px 0 8px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--bg);
  color: var(--ink-2);
  font: inherit;
  font-size: 11.5px;
  font-family: 'JetBrains Mono', monospace;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;

  background-repeat: no-repeat;
  background-position: right 6px center;
  flex: 1;
}
.chart-mini-sel:hover { border-color: #cdd1d8; }
.chart-mini-sel:focus { outline: 0; border-color: var(--accent); }

.chart-body {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 200px;
  position: relative;
}

/* SVG charts */
.svg-chart {
  display: block;
  width: 100%;
  height: 200px;
  overflow: visible;
}
.svg-chart text {
  font-family: 'JetBrains Mono', 'Inter', monospace;
  fill: var(--ink-3);
}

/* Vertical bar */
.vbar-bar {
  cursor: default;
  transition: opacity 0.15s;
}
.vbar-bar:hover { opacity: 0.85; }
.vbar-track {
  fill: var(--bg-soft);
}
.vbar-grid {
  stroke: var(--line-soft);
  stroke-width: 1;
}

/* Horizontal bar */
.hbar-row + .hbar-row { margin-top: 8px; }
.hbar-list {
  display: flex; flex-direction: column;
  gap: 6px;
  width: 100%;
  padding: 4px 0;
}
.hbar-row {
  display: grid;
  grid-template-columns: 96px 1fr 36px;
  gap: 10px;
  align-items: center;
}
.hbar-label {
  font-size: 11px;
  color: var(--ink-2);
  font-family: 'Inter', sans-serif;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hbar-track {
  position: relative;
  height: 14px;
  background: var(--bg-soft);
  border-radius: 4px;
  overflow: hidden;
}
.hbar-fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--accent);
  border-radius: 4px;
  transition: width 0.3s;
}
.hbar-num {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--ink-2);
  text-align: right;
  font-feature-settings: 'tnum';
}

/* Donut center label */
.donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.donut-center-value {
  font-size: 24px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
  color: var(--ink);
  letter-spacing: -0.02em;
  line-height: 1;
  font-feature-settings: 'tnum';
}
.donut-center-label {
  font-size: 10px;
  color: var(--ink-4);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 4px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* Chart legend */
.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--line-soft);
  font-size: 10.5px;
  color: var(--ink-3);
  font-family: 'JetBrains Mono', monospace;
}
.chart-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.chart-legend-dot {
  width: 8px; height: 8px;
  border-radius: 2px;
}

/* Line chart */
.line-axis {
  stroke: var(--line);
  stroke-width: 1;
}
.line-grid {
  stroke: var(--line-soft);
  stroke-width: 1;
  stroke-dasharray: 2 2;
}
.line-path {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.line-area {
  fill: var(--accent);
  opacity: 0.08;
}
.line-dot {
  fill: var(--accent);
  stroke: var(--bg);
  stroke-width: 1.5;
}

/* Empty state */
.chart-empty {
  color: var(--ink-4);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 40px 0;
  text-align: center;
}

/* responsive */
@media (max-width: 1100px) {
  .dash-kpis { grid-template-columns: repeat(3, 1fr); }
  .dash-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 720px) {
  .dash-kpis { grid-template-columns: repeat(2, 1fr); }
  .dash-grid { grid-template-columns: 1fr; }
}

  const K = {};

  K.TODAY = new Date('2026-05-14');
  K.DAY = 86400000;

  K.ENG_ORDER = ['Jimmy', 'Jaylen', 'Bill', 'Barry'];
  K.ENG_LABEL = {
    Jimmy:  '廖璟程',

  K.ENG_FULLLABEL = {
    Jimmy:  '廖璟程 (Jimmy)',
    Jaylen: '何哲綸 (Jaylen)',
    Bill:   '陳柏元 (Bill)',
    Barry:  'Barry',
  };
  K.ENG_INIT = { Jimmy: 'JC', Jaylen: 'JL', Bill: 'BL', Barry: 'BR' };
  K.ENG_TONE = {
    Jimmy:  { fg: '#0c7a99', bg: '#e6f1f6' },
    Jaylen: { fg: '#6b3fa0', bg: '#efe9f7' },
    Bill:   { fg: '#1d6f43', bg: '#e6f1ea' },
    Barry:  { fg: '#a05a00', bg: '#f7eed8' },
  };

  K.MACHINES = ['Form4', 'Form4L', 'Fuse1+', 'Mark2'];
  K.MATERIALS = ['足夠', '需調撥'];
  K.PROGRESS_VALUES = [0, 25, 50, 75, 100];

  K.STATUS_TONE = {
    todo:      { fg: '#5a6270', bg: '#eef0f3', label: '待開始' },
    blocked:   { fg: '#8b6b13', bg: '#fbf3dc', label: '等待材料' },
    progress:  { fg: '#0c7a99', bg: '#e6f1f6', label: '進行中' },
    done:      { fg: '#1d6f43', bg: '#e6f1ea', label: '已完成' },
    cancelled: { fg: '#8a93a3', bg: '#f0f1f4', label: '已取消' },
  };

  K.daysUntil = function (dateStr) {
    if (!dateStr) return null;
    const d = new Date(dateStr);
    if (Number.isNaN(d.getTime())) return null;
    return Math.round((d - K.TODAY) / K.DAY);
  };

  K.statusOf = function (item) {
    if (/取消/.test(item.remark)) return 'cancelled';
    if (item.complete === '是' || item.progress === 100) return 'done';
    if (item.material === '需調撥') return 'blocked';
    if (item.progress > 0) return 'progress';
    return 'todo';
  };

  K.fmtYmd = function (d) {
    if (!d) return '—';
    const x = (d instanceof Date) ? d : new Date(d);
    if (Number.isNaN(x.getTime())) return '—';
    return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  };

  // 預設過濾器套用到所有 view 的入口
  K.applyFilters = function (data, { search = '', engineer = '', machine = '', status = '' } = {}) {
    const s = (search || '').trim().toLowerCase();
    return data.filter((d) => {
      if (s && !d.id.toLowerCase().includes(s) && !d.customer.toLowerCase().includes(s)) return false;
      if (engineer && d.engineer !== engineer) return false;
      if (machine && d.machine !== machine) return false;
      if (status && K.statusOf(d) !== status) return false;
      return true;
    });
  };

  window.K = K;
})();

<script>
(function(){
  function init(cfg){
    if(window._fbReady) return;
    firebase.initializeApp(cfg);
    window._fbReady = true;
    window._auth = firebase.auth();
    window._db   = firebase.firestore();
  }
  window.addEventListener('message', function(e){
    if(e.data && e.data.type === 'FB_CONFIG') init(e.data.config);
  });
  if(typeof FIREBASE_CONFIG !== 'undefined') init(FIREBASE_CONFIG);

  // ── 三個 Collections 的 CRUD ──
  function makeService(colName) {
    return {
      col: function(){ return window._db.collection(colName); },
      getAll: async function(){
        var snap = await this.col().orderBy('seq').get();
        return snap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); });
      },
      add: async function(data){
        var ref = await this.col().add(Object.assign({}, data, {_ts:firebase.firestore.FieldValue.serverTimestamp()}));
        return ref.id;
      },
      update: async function(docId, data){
        await this.col().doc(docId).update(Object.assign({}, data, {_ts:firebase.firestore.FieldValue.serverTimestamp()}));
      },
      del: async function(docId){
        await this.col().doc(docId).delete();
      },
      onSnapshot: function(cb){
        return this.col().orderBy('seq').onSnapshot(function(snap){
          cb(snap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); }));
        });
      }
    };
  }
  window.FBAnomalies = makeService('anomalies');
  window.FBIPA       = makeService('ipa_purchases');
  window.FBEquipment = makeService('equipment');
})();
</script>

<!-- 圖表元件 (從 view-dashboard 取 VerticalBar/HorizontalBar/DonutChart/LineChart) -->
<script type="text/babel" data-presets="react">
/* Dashboard view — 3 預設 + 3 自由選擇 */
const { useState: useStateD, useMemo: useMemoD } = React;

// 維度定義
const DIMENSIONS = {
  status: {
    label: '狀態',
    extract: (it) => window.K.statusOf(it),
    order: ['todo', 'blocked', 'progress', 'done', 'cancelled'],
    label_for: (k) => window.K.STATUS_TONE[k].label,
    color_for: (k) => window.K.STATUS_TONE[k].fg,
  },
  engineer: {
    label: '工程師',
    extract: (it) => it.engineer,
    order: window.K.ENG_ORDER,
    label_for: (k) => window.K.ENG_LABEL[k] || k,
    color_for: (k) => (window.K.ENG_TONE[k] || { fg: '#0c7a99' }).fg,
  },
  progress: {
    label: '進度',
    extract: (it) => String(it.progress),
    order: ['0', '25', '50', '75', '100'],
    label_for: (k) => k + '%',
    color_for: (k) => {
      const n = parseInt(k, 10);
      if (n === 0) return '#9aa3b2';
      if (n === 100) return '#1d6f43';
      return '#0c7a99';
    },
  },
  machine: {
    label: '機台',
    extract: (it) => it.machine || '未指派',
    order: null,
    label_for: (k) => k,
    color_for: () => '#0c7a99',
  },
  material: {
    label: '材料',
    extract: (it) => it.material,
    order: ['足夠', '需調撥'],
    label_for: (k) => k,
    color_for: (k) => k === '足夠' ? '#1d6f43' : '#c79b2a',
  },
  customer: {
    label: '客戶 (Top 8)',
    extract: (it) => it.customer,
    order: null,
    label_for: (k) => k.length > 12 ? k.slice(0, 12) + '…' : k,
    color_for: () => '#0c7a99',
  },
};

function aggregate(data, dimKey) {
  const dim = DIMENSIONS[dimKey];
  const counts = {};
  data.forEach(it => {
    const k = dim.extract(it);
    counts[k] = (counts[k] || 0) + 1;
  });
  let keys;
  if (dim.order) {
    keys = dim.order.filter(k => counts[k] !== undefined);
    // 加入 order 沒有列到的(避免漏掉)
    Object.keys(counts).forEach(k => { if (!keys.includes(k)) keys.push(k); });
  } else {
    keys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    if (dimKey === 'customer') keys = keys.slice(0, 8);
  }
  return keys.map(k => ({
    key: k,
    label: dim.label_for(k),
    value: counts[k] || 0,
    color: dim.color_for(k),
  }));
}

// ─── 圖表元件 ───────────────────

function VerticalBar({ data, height = 200 }) {
  if (data.length === 0) return <div className="chart-empty">無資料</div>;
  const max = Math.max(...data.map(d => d.value), 1);
  const padding = { top: 16, right: 8, bottom: 28, left: 28 };
  const W = 320, H = height;
  const innerW = W - padding.left - padding.right;
  const innerH = H - padding.top - padding.bottom;
  const barW = innerW / data.length;
  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(p => Math.round(max * p));

  return (
    <svg className="svg-chart" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet">
      {/* gridlines */}
      {gridLines.map((v, i) => {
        const y = padding.top + innerH - (v / max) * innerH;
        return (
          <g key={i}>
            <line x1={padding.left} x2={W - padding.right} y1={y} y2={y} className="vbar-grid"/>
            <text x={padding.left - 4} y={y + 3} fontSize="9" textAnchor="end" fill="#8a93a3">{v}</text>
          </g>
        );
      })}
      {/* bars */}
      {data.map((d, i) => {
        const h = (d.value / max) * innerH;
        const x = padding.left + i * barW + barW * 0.2;
        const w = barW * 0.6;
        const y = padding.top + innerH - h;
        return (
          <g key={d.key}>
            <rect x={x} y={padding.top} width={w} height={innerH}
              className="vbar-track" rx="2"/>
            <rect x={x} y={y} width={w} height={h}
              fill={d.color} className="vbar-bar" rx="2"/>
            <text x={x + w/2} y={y - 4} fontSize="10" textAnchor="middle" fill="#0a0e14" fontWeight="600">
              {d.value}
            </text>
            <text x={x + w/2} y={H - padding.bottom + 14} fontSize="9.5" textAnchor="middle" fill="#5a6270">
              {d.label}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function HorizontalBar({ data }) {
  if (data.length === 0) return <div className="chart-empty">無資料</div>;
  const max = Math.max(...data.map(d => d.value), 1);
  return (
    <div className="hbar-list">
      {data.map(d => (
        <div key={d.key} className="hbar-row">
          <div className="hbar-label" title={d.label}>{d.label}</div>
          <div className="hbar-track">
            <div className="hbar-fill" style={{
              width: `${(d.value / max) * 100}%`,
              background: d.color,
            }}/>
          </div>
          <div className="hbar-num">{d.value}</div>
        </div>
      ))}
    </div>
  );
}

function DonutChart({ data, centerLabel = '總計' }) {
  if (data.length === 0) return <div className="chart-empty">無資料</div>;
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const W = 200, R = 78, r = 52, cx = W/2, cy = W/2;
  let cumulative = 0;
  const segments = data.map(d => {
    const start = cumulative / total;
    cumulative += d.value;
    const end = cumulative / total;
    return { ...d, start, end };
  });
  function arcPath(start, end) {
    if (end - start >= 0.9999) {
      // full circle — draw as two arcs
      return [
        `M ${cx + R} ${cy}`,
        `A ${R} ${R} 0 1 1 ${cx - R} ${cy}`,
        `A ${R} ${R} 0 1 1 ${cx + R} ${cy}`,
        `L ${cx + r} ${cy}`,
        `A ${r} ${r} 0 1 0 ${cx - r} ${cy}`,
        `A ${r} ${r} 0 1 0 ${cx + r} ${cy}`,
        'Z',
      ].join(' ');
    }
    const a0 = start * Math.PI * 2 - Math.PI / 2;
    const a1 = end * Math.PI * 2 - Math.PI / 2;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0);
    const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const x2 = cx + r * Math.cos(a1), y2 = cy + r * Math.sin(a1);
    const x3 = cx + r * Math.cos(a0), y3 = cy + r * Math.sin(a0);
    const large = end - start > 0.5 ? 1 : 0;
    return [
      `M ${x0} ${y0}`,
      `A ${R} ${R} 0 ${large} 1 ${x1} ${y1}`,
      `L ${x2} ${y2}`,
      `A ${r} ${r} 0 ${large} 0 ${x3} ${y3}`,
      'Z',
    ].join(' ');
  }
  return (
    <div style={{ position: 'relative', display: 'flex', flexDirection: 'column', alignItems: 'center', width: '100%' }}>
      <div style={{ position: 'relative', width: W, height: W }}>
        <svg width={W} height={W} viewBox={`0 0 ${W} ${W}`}>
          {segments.map(seg => (
            <path key={seg.key} d={arcPath(seg.start, seg.end)} fill={seg.color}
              stroke="#fff" strokeWidth="1.5"/>
          ))}
        </svg>
        <div className="donut-center">
          <div className="donut-center-value">{total}</div>
          <div className="donut-center-label">{centerLabel}</div>
        </div>
      </div>
      <div className="chart-legend" style={{ marginTop: 14, borderTop: 0, paddingTop: 0 }}>
        {segments.map(seg => (
          <span key={seg.key} className="chart-legend-item">
            <span className="chart-legend-dot" style={{ background: seg.color }}/>
            {seg.label} · {seg.value}
          </span>
        ))}
      </div>
    </div>
  );
}

function PieChart({ data, centerLabel = '總計' }) {
  // 跟 Donut 一樣,但內半徑為 0
  if (data.length === 0) return <div className="chart-empty">無資料</div>;
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const W = 200, R = 84, cx = W/2, cy = W/2;
  let cumulative = 0;
  const segments = data.map(d => {
    const start = cumulative / total;
    cumulative += d.value;
    const end = cumulative / total;
    return { ...d, start, end };
  });
  function piePath(start, end) {
    if (end - start >= 0.9999) {
      return [
        `M ${cx + R} ${cy}`,
        `A ${R} ${R} 0 1 1 ${cx - R} ${cy}`,
        `A ${R} ${R} 0 1 1 ${cx + R} ${cy}`,
        'Z',
      ].join(' ');
    }
    const a0 = start * Math.PI * 2 - Math.PI / 2;
    const a1 = end * Math.PI * 2 - Math.PI / 2;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0);
    const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const large = end - start > 0.5 ? 1 : 0;
    return [
      `M ${cx} ${cy}`,
      `L ${x0} ${y0}`,
      `A ${R} ${R} 0 ${large} 1 ${x1} ${y1}`,
      'Z',
    ].join(' ');
  }
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', width: '100%' }}>
      <svg width={W} height={W} viewBox={`0 0 ${W} ${W}`}>
        {segments.map(seg => (
          <path key={seg.key} d={piePath(seg.start, seg.end)} fill={seg.color}
            stroke="#fff" strokeWidth="1.5"/>
        ))}
      </svg>
      <div className="chart-legend" style={{ marginTop: 14, borderTop: 0, paddingTop: 0 }}>
        {segments.map(seg => (
          <span key={seg.key} className="chart-legend-item">
            <span className="chart-legend-dot" style={{ background: seg.color }}/>
            {seg.label} · {seg.value}
          </span>
        ))}
      </div>
    </div>
  );
}

function LineChart({ data, height = 200 }) {
  // 折線適合時序資料 — 把資料當作有順序的時間軸
  if (data.length === 0) return <div className="chart-empty">無資料</div>;
  const max = Math.max(...data.map(d => d.value), 1);
  const padding = { top: 16, right: 12, bottom: 28, left: 28 };
  const W = 320, H = height;
  const innerW = W - padding.left - padding.right;
  const innerH = H - padding.top - padding.bottom;
  const stepX = data.length > 1 ? innerW / (data.length - 1) : 0;
  const points = data.map((d, i) => ({
    x: padding.left + i * stepX,
    y: padding.top + innerH - (d.value / max) * innerH,
    value: d.value,
    label: d.label,
  }));
  const pathD = points.map((p, i) => (i === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ');
  const areaD = points.length > 0
    ? `${pathD} L ${points[points.length-1].x} ${padding.top + innerH} L ${points[0].x} ${padding.top + innerH} Z`
    : '';
  const gridLines = [0, 0.5, 1].map(p => Math.round(max * p));

  return (
    <svg className="svg-chart" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet">
      {gridLines.map((v, i) => {
        const y = padding.top + innerH - (v / max) * innerH;
        return (
          <g key={i}>
            <line x1={padding.left} x2={W - padding.right} y1={y} y2={y} className="line-grid"/>
            <text x={padding.left - 4} y={y + 3} fontSize="9" textAnchor="end" fill="#8a93a3">{v}</text>
          </g>
        );
      })}
      <path d={areaD} className="line-area"/>
      <path d={pathD} className="line-path"/>
      {points.map((p, i) => (
        <g key={i}>
          <circle cx={p.x} cy={p.y} r="3.5" className="line-dot"/>
          <text x={p.x} y={H - padding.bottom + 14} fontSize="9" textAnchor="middle" fill="#5a6270">
            {p.label}
          </text>
        </g>
      ))}
    </svg>
  );
}

function ChartByType({ type, data, centerLabel }) {
  if (type === 'bar') return <VerticalBar data={data}/>;
  if (type === 'hbar') return <HorizontalBar data={data}/>;
  if (type === 'donut') return <DonutChart data={data} centerLabel={centerLabel}/>;
  if (type === 'pie') return <PieChart data={data} centerLabel={centerLabel}/>;
  if (type === 'line') return <LineChart data={data}/>;
  return null;
}

// ─── 分析 ──────────────────────────
function IssuesStats({ anomalies, ipa, tools }) {
  const K = window.K;

  // 工程師分布
  const engineerCounts = {};
  anomalies.forEach(a => { engineerCounts[a.engineer] = (engineerCounts[a.engineer] || 0) + 1; });
  const engineerData = K.ENG_ORDER
    .filter(k => engineerCounts[k])
    .map(k => ({
      key: k, label: K.ENG_LABEL[k], value: engineerCounts[k],
      color: K.ENG_TONE[k].fg,
    }));

  // 狀態分布
  const statusCounts = { '已完成': 0, '處理中': 0, '暫停': 0 };
  anomalies.forEach(a => { if (statusCounts[a.status] !== undefined) statusCounts[a.status]++; });
  const statusData = [
    { key: '已完成', label: '已完成', value: statusCounts['已完成'], color: '#1d6f43' },
    { key: '處理中', label: '處理中', value: statusCounts['處理中'], color: '#c79b2a' },
    { key: '暫停',   label: '暫停',   value: statusCounts['暫停'],   color: '#c0392b' },
  ].filter(d => d.value > 0);

  // 採購人員 (IPA)
  const personCounts = {};
  ipa.forEach(r => { personCounts[r.person] = (personCounts[r.person] || 0) + r.quantity; });
  const personData = K.ENG_ORDER
    .filter(k => personCounts[k])
    .map(k => ({
      key: k, label: K.ENG_LABEL[k], value: personCounts[k],
      color: K.ENG_TONE[k].fg,
    }));

  // 設備採購方式
  const methodCounts = {};
  tools.forEach(r => { methodCounts[r.method] = (methodCounts[r.method] || 0) + (r.price * r.quantity); });
  const methodData = Object.entries(methodCounts).map(([k, v]) => ({
    key: k, label: k, value: v,
    color: k === 'Easy Flow' ? '#0c7a99' : '#c79b2a',
  }));

  const totalBarrels = ipa.reduce((s, r) => s + r.quantity, 0);
  const totalSpend = tools.reduce((s, r) => s + r.price * r.quantity, 0);

  return (
    <div className="iss-analytic">
      {/* KPI */}
      <div className="dash-kpis" style={{ paddingTop: 0 }}>
        <div className="dash-kpi">
          <div className="dash-kpi-label">總異常</div>
          <div className="dash-kpi-value">{anomalies.length}</div>
          <div className="dash-kpi-sub">累計紀錄</div>
        </div>
        <div className="dash-kpi">
          <div className="dash-kpi-label">處理中</div>
          <div className="dash-kpi-value" style={{ color: '#c79b2a' }}>{statusCounts['處理中']}</div>
          <div className="dash-kpi-sub">待解決</div>
        </div>
        <div className="dash-kpi">
          <div className="dash-kpi-label">已完成</div>
          <div className="dash-kpi-value" style={{ color: '#1d6f43' }}>{statusCounts['已完成']}</div>
          <div className="dash-kpi-sub">結案</div>
        </div>
        <div className="dash-kpi">
          <div className="dash-kpi-label">IPA 採購 (桶)</div>
          <div className="dash-kpi-value">{totalBarrels}</div>
          <div className="dash-kpi-sub">{ipa.length} 筆紀錄</div>
        </div>
        <div className="dash-kpi">
          <div className="dash-kpi-label">設備支出</div>
          <div className="dash-kpi-value" style={{ color: '#0c7a99' }}>NT$ {totalSpend.toLocaleString()}</div>
          <div className="dash-kpi-sub">{tools.length} 項設備</div>
        </div>
      </div>

      <div className="dash-section">
        <div className="dash-section-title">分析圖表</div>
        <div className="dash-section-sub">PIVOT ANALYSIS</div>
      </div>

      <div className="iss-grid">
        <div className="chart-card">
          <div className="chart-card-head">
            <div className="chart-card-title">異常 · 工程師分布</div>
            <div className="chart-card-meta">HORIZONTAL BAR</div>
          </div>
          <div className="chart-body">
            <HorizontalBar data={engineerData}/>
          </div>
        </div>

        <div className="chart-card">
          <div className="chart-card-head">
            <div className="chart-card-title">異常 · 狀態分布</div>
            <div className="chart-card-meta">DONUT</div>
          </div>
          <div className="chart-body">
            <DonutChart data={statusData} centerLabel="異常案件"/>
          </div>
        </div>

        <div className="chart-card">
          <div className="chart-card-head">
            <div className="chart-card-title">IPA 採購 · 人員(桶數)</div>
            <div className="chart-card-meta">VERTICAL BAR</div>
          </div>
          <div className="chart-body">
            <VerticalBar data={personData}/>
          </div>
        </div>

        <div className="chart-card">
          <div className="chart-card-head">
            <div className="chart-card-title">設備支出 · 採購方式</div>
            <div className="chart-card-meta">DONUT</div>
          </div>
          <div className="chart-body">
            <DonutChart data={methodData} centerLabel="NT$"/>
          </div>
        </div>

        <div className="chart-card">
          <div className="chart-card-head">
            <div className="chart-card-title">設備清單 · 金額排行</div>
            <div className="chart-card-meta">HORIZONTAL BAR</div>
          </div>
          <div className="chart-body">
            <HorizontalBar data={
              [...tools]
                .sort((a,b) => b.price*b.quantity - a.price*a.quantity)
                .slice(0, 6)
                .map(t => ({
                  key: t.seq,
                  label: t.product.length > 8 ? t.product.slice(0,8)+'…' : t.product,
                  value: t.price * t.quantity,
                  color: '#0c7a99',
                }))
            }/>
          </div>
        </div>

        <div className="chart-card">
          <div className="chart-card-head">
            <div className="chart-card-title">IPA 採購 · 月份趨勢</div>
            <div className="chart-card-meta">LINE</div>
          </div>
          <div className="chart-body">
            <LineChart data={(() => {
              const monthly = {};
              ipa.forEach(r => {
                const m = (r.purchaseDate || '').slice(0, 7);
                if (!m) return;
                monthly[m] = (monthly[m] || 0) + r.quantity;
              });
              return Object.keys(monthly).sort().map(m => ({
                key: m,
                label: m.slice(2).replace('-', '/'),
                value: monthly[m],
                color: '#0c7a99',
              }));
            })()}/>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── 客戶異常 Modal ── */

  useEffect(() => {
    if (!window._db) { setError('Firebase 尚未初始化'); setLoading(false); return; }
    let loaded = 0;
    const check = () => { if(++loaded >= 3) setLoading(false); };
    unsubs.current.push(window.FBAnomalies.onSnapshot(rows=>{setAnomalies(rows);check();}));
    unsubs.current.push(window.FBIPA.onSnapshot(      rows=>{setIpa(rows);       check();}));
    unsubs.current.push(window.FBEquipment.onSnapshot( rows=>{setEquipment(rows); check();}));
    return () => unsubs.current.forEach(u=>u());
  }, []);

  const nextSeq = arr => arr.length ? Math.max(...arr.map(d=>d.seq||0))+1 : 1;

  // ── 異常 CRUD ──
  const saveAnomaly = async form => {
    if (editItem) { await window.FBAnomalies.update(editItem._id, form); showMsg('異常已更新 ✓'); }
    else          { await window.FBAnomalies.add({...form, seq:nextSeq(anomalies)}); showMsg('異常已新增 ✓'); }
  };
  const delAnomaly = async item => {
    if (!confirm('刪除「'+item.customer+'」的異常紀錄？')) return;
    await window.FBAnomalies.del(item._id); showMsg('已刪除','inf');
  };

  // ── IPA CRUD ──
  const saveIPA = async form => {
    if (editItem) { await window.FBIPA.update(editItem._id, form); showMsg('採購已更新 ✓'); }
    else          { await window.FBIPA.add({...form, seq:nextSeq(ipa)}); showMsg('採購已新增 ✓'); }
  };
  const delIPA = async item => {
    if (!confirm('刪除此筆採購？')) return;
    await window.FBIPA.del(item._id); showMsg('已刪除','inf');
  };

  // ── 設備 CRUD ──
  const saveEquip = async form => {
    if (editItem) { await window.FBEquipment.update(editItem._id, form); showMsg('設備已更新 ✓'); }
    else          { await window.FBEquipment.add({...form, seq:nextSeq(equipment)}); showMsg('設備已新增 ✓'); }
  };
  const delEquip = async item => {
    if (!confirm('刪除「'+item.product+'」？')) return;
    await window.FBEquipment.del(item._id); showMsg('已刪除','inf');
  };

  const SUBTABS = [
    {key:'anomaly', label:'客戶異常',  count:anomalies.length},
    {key:'ipa',     label:'IPA 採購',  count:ipa.length},
    {key:'tools',   label:'設備清單',  count:equipment.length},
    {key:'stats',   label:'分析',      count:null},
  ];

  if (loading) return <div className="fb-loading">⏳ 從 Firebase 載入資料...</div>;
  if (error)   return <div className="fb-err">⚠️ {error}</div>;

  // 篩選狀態
  const [search1,setSearch1] = useState('');
  const [statusF,setStatusF] = useState('');
  const [engF,   setEngF]    = useState('');
  const [search2,setSearch2] = useState('');
  const [personF,setPersonF] = useState('');
  const [search3,setSearch3] = useState('');
  const [methodF,setMethodF] = useState('');

  const filtA = anomalies.filter(it=>{
    const s=search1.trim().toLowerCase();
    if(s&&!it.customer.toLowerCase().includes(s)&&!it.product.toLowerCase().includes(s)) return false;
    if(statusF&&it.status!==statusF) return false;
    if(engF&&it.engineer!==engF) return false;
    return true;
  });
  const filtI = ipa.filter(it=>{
    const s=search2.trim().toLowerCase();
    if(s&&!it.product.toLowerCase().includes(s)) return false;
    if(personF&&it.person!==personF) return false;
    return true;
  });
  const filtT = equipment.filter(it=>{
    const s=search3.trim().toLowerCase();
    if(s&&!it.product.toLowerCase().includes(s)) return false;
    if(methodF&&it.method!==methodF) return false;
    return true;
  });

  const pillCls = st => st==='已完成'?'kt-pill kt-pill-完成':st==='處理中'?'kt-pill kt-pill-處理':'kt-pill kt-pill-暫停';

  return (
    <div className="table-view">
      {/* 若嵌入模式，顯示頂部 tab bar */}
      {!standalone && (
        <div className="shell-top">
          <nav className="shell-tabs" role="tablist">
            <button role="tab" aria-selected={true} className="shell-tab" style={{fontWeight:600,color:'#0a0e14'}}>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style={{marginRight:6}}><circle cx="7" cy="7" r="5.5" stroke="currentColor" strokeWidth="1.3"/><line x1="7" y1="4.2" x2="7" y2="7.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/><circle cx="7" cy="9.6" r="0.7" fill="currentColor"/></svg>
              異常與資源
            </button>
          </nav>
          <div className="shell-spacer"/>
          <div className="shell-aux">ISSUES · RESOURCES</div>
        </div>
      )}

      <div className="toolbar">
        <div className="toolbar-title">工作異常與資源</div>
        <span className="toolbar-sub">客戶異常 · IPA 採購 · 設備清單 · 統計分析</span>
        <div className="issues-subtabs" role="tablist">
          {SUBTABS.map(t=>(
            <button key={t.key} role="tab" aria-selected={tab===t.key} className="issues-subtab" onClick={()=>setTab(t.key)}>
              {t.label}
              {t.count!==null&&<span className="issues-subtab-count">{t.count}</span>}
            </button>
          ))}
        </div>
      </div>

      {/* ── 客戶異常 ── */}
      {tab==='anomaly' && (
        <>
          <div className="toolbar" style={{borderTop:'1px solid var(--line-soft)',paddingTop:10,paddingBottom:10}}>
            <div className="t-search" style={{marginRight:'auto'}}>
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" strokeWidth="1.5"/><path d="M11 11l3 3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
              <input value={search1} onChange={e=>setSearch1(e.target.value)} placeholder="搜尋客戶 / 品名"/>
            </div>
            <select className="t-sel" value={statusF} onChange={e=>setStatusF(e.target.value)}>
              <option value="">所有狀態</option><option>處理中</option><option>已完成</option><option>暫停</option>
            </select>
            <select className="t-sel" value={engF} onChange={e=>setEngF(e.target.value)}>
              <option value="">所有工程師</option>
              {K.ENG_ORDER.map(k=><option key={k} value={k}>{K.ENG_LABEL[k]}</option>)}
            </select>
            {canEdit && <button className="t-btn t-btn-primary" onClick={()=>{setEditItem(null);setModal('anomaly');}}>+ 新增異常</button>}
          </div>
          <div className="table-wrap">
            <table className="kt">
              <thead><tr>
                <th className="col-seq">序</th><th>客戶</th><th>異常日期</th><th>品名</th>
                <th>窗口工程師</th><th>狀態</th><th>進度日期</th><th>進度狀況</th>
                <th className="col-actions">操作</th>
              </tr></thead>
              <tbody>
                {filtA.map(it=>{
                  const tone=K.ENG_TONE[it.engineer]||{fg:'#5a6270',bg:'#eef0f3'};
                  const first=(it.progresses||[])[0]||{date:'—',status:'—'};
                  const rest=(it.progresses||[]).slice(1);
                  return (
                    <React.Fragment key={it._id||it.seq}>
                      <tr>
                        <td className="col-seq">{it.seq}</td>
                        <td className="col-customer">{it.customer}</td>
                        <td className="col-date">{it.date}</td>
                        <td>{it.product}</td>
                        <td>
                          <span className="kt-eng">
                            <span className="kt-eng-dot" style={{color:tone.fg,background:tone.bg}}>{K.ENG_INIT[it.engineer]||it.engineer.slice(0,2)}</span>
                            {K.ENG_LABEL[it.engineer]||it.engineer}
                          </span>
                        </td>
                        <td><span className={pillCls(it.status)}>{it.status}</span></td>
                        <td className="col-date">{first.date}</td>
                        <td>{first.status}</td>
                        <td className="col-actions">
                          <span className="kt-act">
                            {canEdit   && <button className="kt-actbtn" title="編輯"   onClick={()=>{setEditItem(it);setModal('anomaly');}}>✎</button>}
                            {canDelete && <button className="kt-actbtn danger" title="刪除" onClick={()=>delAnomaly(it)}>✕</button>}
                          </span>
                        </td>
                      </tr>
                      {rest.map((p,i)=>(
                        <tr key={i} className="kt-anomaly-sub">
                          <td colSpan="6"><span className="kt-anomaly-sub-marker">↳ 後續進度 #{i+2}</span></td>
                          <td className="col-date">{p.date}</td>
                          <td>{p.status}</td>
                          <td></td>
                        </tr>
                      ))}
                    </React.Fragment>
                  );
                })}
                {filtA.length===0 && <tr><td colSpan="9"><div className="kt-empty">沒有符合條件的異常紀錄</div></td></tr>}
              </tbody>
            </table>
          </div>
        </>
      )}

      {/* ── IPA 採購 ── */}
      {tab==='ipa' && (
        <>
          <div className="toolbar" style={{borderTop:'1px solid var(--line-soft)',paddingTop:10,paddingBottom:10}}>
            <div className="t-search" style={{marginRight:'auto'}}>
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" strokeWidth="1.5"/><path d="M11 11l3 3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
              <input value={search2} onChange={e=>setSearch2(e.target.value)} placeholder="搜尋品名 / 備註"/>
            </div>
            <span className="toolbar-sub">合計 <b style={{color:'#0a0e14',fontWeight:600}}>{filtI.reduce((s,r)=>s+Number(r.quantity||0),0)}</b> 桶</span>
            <select className="t-sel" value={personF} onChange={e=>setPersonF(e.target.value)}>
              <option value="">所有採購人員</option>
              {K.ENG_ORDER.map(k=><option key={k} value={k}>{K.ENG_LABEL[k]}</option>)}
            </select>
            {canEdit && <button className="t-btn t-btn-primary" onClick={()=>{setEditItem(null);setModal('ipa');}}>+ 新增採購</button>}
          </div>
          <div className="table-wrap">
            <table className="kt">
              <thead><tr>
                <th className="col-seq">序</th><th>採購日期</th><th>使用區間</th><th>品名</th>
                <th>數量</th><th>採購人員</th><th>備註</th><th className="col-actions">操作</th>
              </tr></thead>
              <tbody>
                {filtI.map(it=>{
                  const tone=K.ENG_TONE[it.person]||{fg:'#5a6270',bg:'#eef0f3'};
                  return (
                    <tr key={it._id||it.seq}>
                      <td className="col-seq">{it.seq}</td>
                      <td className="col-date">{it.purchaseDate}</td>
                      <td className="col-date">{it.useDate}</td>
                      <td>{it.product}</td>
                      <td><span className="kt-num-badge">{it.quantity} 桶</span></td>
                      <td>
                        <span className="kt-eng">
                          <span className="kt-eng-dot" style={{color:tone.fg,background:tone.bg}}>{K.ENG_INIT[it.person]||it.person.slice(0,2)}</span>
                          {K.ENG_LABEL[it.person]||it.person}
                        </span>
                      </td>
                      <td style={{color:'#5a6270'}}>{it.remark||'—'}</td>
                      <td className="col-actions">
                        <span className="kt-act">
                          {canEdit   && <button className="kt-actbtn" onClick={()=>{setEditItem(it);setModal('ipa');}}>✎</button>}
                          {canDelete && <button className="kt-actbtn danger" onClick={()=>delIPA(it)}>✕</button>}
                        </span>
                      </td>
                    </tr>
                  );
                })}
                {filtI.length===0 && <tr><td colSpan="8"><div className="kt-empty">沒有符合條件的採購紀錄</div></td></tr>}
              </tbody>
            </table>
          </div>
        </>
      )}

      {/* ── 設備清單 ── */}
      {tab==='tools' && (
        <>
          <div className="toolbar" style={{borderTop:'1px solid var(--line-soft)',paddingTop:10,paddingBottom:10}}>
            <div className="t-search" style={{marginRight:'auto'}}>
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" strokeWidth="1.5"/><path d="M11 11l3 3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
              <input value={search3} onChange={e=>setSearch3(e.target.value)} placeholder="搜尋品名 / 用途"/>
            </div>
            <span className="toolbar-sub">合計金額 <b style={{color:'#0a0e14',fontWeight:600}}>NT$ {filtT.reduce((s,r)=>s+(Number(r.price||0)*Number(r.quantity||1)),0).toLocaleString()}</b></span>
            <select className="t-sel" value={methodF} onChange={e=>setMethodF(e.target.value)}>
              <option value="">所有採購方式</option><option>Easy Flow</option><option>零用金</option>
            </select>
            {canEdit && <button className="t-btn t-btn-primary" onClick={()=>{setEditItem(null);setModal('tools');}}>+ 新增設備</button>}
          </div>
          <div className="table-wrap">
            <table className="kt">
              <thead><tr>
                <th className="col-seq">序</th><th>採購日期</th><th>品名</th><th>數量</th>
                <th>採購方式</th><th>單號</th><th>備註(用途)</th><th style={{textAlign:'right'}}>金額</th>
                <th className="col-actions">操作</th>
              </tr></thead>
              <tbody>
                {filtT.map(it=>(
                  <tr key={it._id||it.seq}>
                    <td className="col-seq">{it.seq}</td>
                    <td className="col-date">{it.purchaseDate||'—'}</td>
                    <td>{it.product}</td>
                    <td><span className="kt-num-badge">{it.quantity}</span></td>
                    <td>{it.method}</td>
                    <td className="col-id">{it.number||'—'}</td>
                    <td style={{color:'#5a6270'}}>{it.remark||'—'}</td>
                    <td className="kt-money">NT$ {(Number(it.price||0)*Number(it.quantity||1)).toLocaleString()}</td>
                    <td className="col-actions">
                      <span className="kt-act">
                        {canEdit   && <button className="kt-actbtn" onClick={()=>{setEditItem(it);setModal('tools');}}>✎</button>}
                        {canDelete && <button className="kt-actbtn danger" onClick={()=>delEquip(it)}>✕</button>}
                      </span>
                    </td>
                  </tr>
                ))}
                {filtT.length===0 && <tr><td colSpan="9"><div className="kt-empty">沒有符合條件的設備</div></td></tr>}
              </tbody>
            </table>
          </div>
        </>
      )}

      {/* ── 分析 ── */}
      {tab==='stats' && <window.IssuesStats anomalies={anomalies} ipa={ipa} tools={equipment}/>}

      {/* Modals */}
      {modal==='anomaly' && <AnomalyModal item={editItem} onClose={()=>setModal(null)} onSave={async f=>{await saveAnomaly(f);setModal(null);}}/>}
      {modal==='ipa'     && <IPAModal     item={editItem} onClose={()=>setModal(null)} onSave={async f=>{await saveIPA(f);   setModal(null);}}/>}
      {modal==='tools'   && <EquipModal   item={editItem} onClose={()=>setModal(null)} onSave={async f=>{await saveEquip(f); setModal(null);}}/>}
    </div>
  );
}

window.mountIssues = function(user) {
  ReactDOM.createRoot(document.getElementById('iss-root')).render(
    <IssuesApp currentUser={user} standalone={false}/>
  );
};

// 獨立開啟模式
(function(){
  const isStandalone = window.self === window.top;
  if (!isStandalone) return;
  var tries = 0;
  var check = setInterval(function(){
    tries++;
    if (window._fbReady) {
      clearInterval(check);
      window._auth.onAuthStateChanged(function(fbUser){
        if (!fbUser) { window.location.href='index.html'; return; }
        window._db.collection('users').doc(fbUser.uid).get().then(function(doc){
          var user = doc.exists ? Object.assign({uid:fbUser.uid}, doc.data()) : {uid:fbUser.uid, email:fbUser.email, permissions:['view_issues']};
          ReactDOM.createRoot(document.getElementById('iss-root')).render(
            <IssuesApp currentUser={user} standalone={true}/>
          );
        });
      });
    }
    if(tries>40){ clearInterval(check); document.getElementById('iss-root').innerHTML='<div class="fb-err">⚠️ 無法載入 Firebase</div>'; }
  }, 250);
})();
</script>

<style>@keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}</style>
</body>
</html>
