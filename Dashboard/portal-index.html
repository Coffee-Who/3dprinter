<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>實威國際 · 3D 列印入口平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{margin:0;}
  body{font-family:'DM Sans',-apple-system,'PingFang TC','Noto Sans TC',sans-serif;color:#16263d;}

  /* ====== 連結改這裡 ======
     四個入口的網址都在下方 .circle 的 href，
     或這份對照表，改完即可。
     1 工作看板   .c-board   href
     2 列印機預約 .c-booking href
     3 材料庫存   .c-stock   href
     4 異常與資源 .c-issue   href
  ========================= */

  .portal{min-height:100vh;width:100%;
    background:linear-gradient(160deg,#f7faff 0%,#edf3fd 55%,#e6effb 100%);
    position:relative;overflow:hidden;}
  .glow{position:absolute;border-radius:50%;pointer-events:none;}
  .glow-1{top:-160px;right:8%;width:480px;height:480px;background:radial-gradient(circle,rgba(37,99,235,0.14),transparent 68%);}
  .glow-2{bottom:-200px;left:-120px;width:520px;height:520px;background:radial-gradient(circle,rgba(96,165,250,0.13),transparent 70%);}

  nav{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:22px 56px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,#2563EB,#1d4ed8);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(37,99,235,0.32);}
  .brand-mark span{width:11px;height:11px;border:2px solid #fff;border-radius:50%;}
  .brand-name{font-size:18px;font-weight:700;color:#16263d;}
  .brand-div{width:1px;height:14px;background:rgba(22,38,61,0.22);}
  .brand-sub{font-size:13px;font-weight:500;color:#6b7a90;}
  .nav-links{display:flex;align-items:center;gap:32px;}
  .nav-links a{font-size:14.5px;font-weight:400;color:#6b7a90;text-decoration:none;}
  .nav-links a.active{font-weight:500;color:#2b3b54;}
  .nav-cta{font-weight:600!important;color:#fff!important;padding:9px 22px;border-radius:999px;background:linear-gradient(145deg,#2563EB,#1d4ed8);box-shadow:0 6px 16px rgba(37,99,235,0.30);}

  main{position:relative;z-index:10;display:flex;align-items:center;max-width:1320px;margin:0 auto;padding:48px 56px 60px;}
  .copy{flex:0 0 44%;max-width:560px;}
  .badge{display:inline-flex;align-items:center;gap:9px;padding:7px 16px;border-radius:999px;background:rgba(37,99,235,0.08);border:1px solid rgba(37,99,235,0.18);margin-bottom:30px;}
  .badge span{width:6px;height:6px;border-radius:50%;background:#2563EB;}
  .badge b{font-size:12px;font-weight:600;letter-spacing:0.14em;color:#1d4ed8;}
  h1{margin:0;font-size:64px;line-height:1.14;font-weight:900;letter-spacing:-0.01em;color:#16263d;font-family:'Noto Sans TC',sans-serif;}
  .hl{position:relative;display:inline-block;color:#1d4ed8;}
  .hl i{position:absolute;left:0;bottom:-10px;width:100%;height:6px;background:repeating-linear-gradient(90deg,#2563EB 0 7px,transparent 7px 14px);border-radius:3px;}
  .lead{margin:40px 0 0;font-size:17px;line-height:1.85;color:#5a6b82;}
  .actions{display:flex;align-items:center;gap:18px;margin-top:44px;}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:16px 38px;border-radius:999px;background:linear-gradient(145deg,#2563EB,#1d4ed8);color:#fff;font-size:16px;font-weight:600;letter-spacing:0.03em;text-decoration:none;box-shadow:0 12px 28px rgba(37,99,235,0.32);transition:transform .2s ease,box-shadow .2s ease;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 18px 38px rgba(37,99,235,0.42);}

  .stage{flex:1;position:relative;height:620px;min-width:560px;}
  .ring{position:absolute;border-radius:50%;border:1px dashed rgba(37,99,235,0.18);}
  .ring-1{top:36px;left:158px;width:330px;height:330px;animation:spin 60s linear infinite;}
  .ring-2{bottom:50px;right:36px;width:210px;height:210px;animation:spin 80s linear infinite reverse;}
  .dot{position:absolute;border-radius:50%;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes floatA{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
  @keyframes floatB{0%,100%{transform:translateY(0);}50%{transform:translateY(-20px);}}
  @keyframes floatC{0%,100%{transform:translateY(0);}50%{transform:translateY(-11px);}}

  .circle{position:absolute;border-radius:50%;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s ease,border-color .28s ease;}
  .circle .label{font-weight:700;color:#16263d;}
  .circle.glass{background:linear-gradient(150deg,rgba(255,255,255,0.95),rgba(222,237,253,0.9));border:1.5px solid rgba(37,99,235,0.22);box-shadow:0 18px 40px rgba(37,99,235,0.15),inset 0 1px 0 rgba(255,255,255,0.9);}
  .circle.glass:hover{transform:scale(1.1);box-shadow:0 30px 58px rgba(37,99,235,0.32);border-color:#2563EB;}

  .c-board{top:56px;left:168px;width:214px;height:214px;gap:13px;background:linear-gradient(150deg,#2563EB,#1d4ed8);border:1px solid rgba(255,255,255,0.45);box-shadow:0 22px 48px rgba(37,99,235,0.34),inset 0 1px 0 rgba(255,255,255,0.45);animation:floatB 7s ease-in-out infinite;}
  .c-board:hover{transform:scale(1.08);box-shadow:0 34px 72px rgba(37,99,235,0.5);}
  .c-board .label{color:#fff;font-size:20px;}
  .c-booking{top:40px;left:412px;width:172px;height:172px;gap:10px;animation:floatA 6.2s ease-in-out infinite;}
  .c-booking .label{font-size:16px;}
  .c-stock{top:300px;left:118px;width:162px;height:162px;gap:10px;animation:floatC 6.8s ease-in-out infinite;}
  .c-stock .label{font-size:16px;}
  .c-issue{top:332px;left:378px;width:152px;height:152px;gap:9px;animation:floatB 6.5s ease-in-out infinite;}
  .c-issue .label{font-size:15px;}

  @media (max-width:1080px){
    main{flex-direction:column;align-items:flex-start;gap:20px;padding:32px 28px 60px;}
    h1{font-size:48px;}
    .stage{min-width:0;width:100%;height:560px;}
    .nav-links a:not(.nav-cta){display:none;}
  }
</style>
</head>
<body>
<div class="portal">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <nav>
    <div class="brand">
      <div class="brand-mark"><span></span></div>
      <div class="brand">
        <span class="brand-name">實威國際</span>
        <span class="brand-div"></span>
        <span class="brand-sub">3D Print Studio</span>
      </div>
    </div>
    <div class="nav-links">
      <a class="active" href="#工作看板連結">工作看板</a>
      <a href="#列印機預約連結">列印機預約</a>
      <a href="#材料庫存連結">材料庫存</a>
      <a href="#異常與資源連結">異常與資源</a>
      <a class="nav-cta" href="#工作看板連結">進入系統</a>
    </div>
  </nav>

  <main>
    <div class="copy">
      <div class="badge"><span></span><b>SOLIDWIZARD · 3D PRINT STUDIO</b></div>
      <h1>實威國際<br>3D 列印<br><span class="hl">入口平台<i></i></span></h1>
      <p class="lead">工作看板、列印機預約、材料庫存、異常與資源，<br>四大模組一處整合，點擊圓形入口即可前往。</p>
      <div class="actions">
        <a class="btn" href="#工作看板連結">進入工作看板
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </div>

    <div class="stage">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <span class="dot" style="top:24px;left:392px;width:9px;height:9px;background:#2563EB;"></span>
      <span class="dot" style="bottom:120px;left:96px;width:7px;height:7px;background:#93c5fd;"></span>
      <span class="dot" style="top:286px;left:330px;width:6px;height:6px;background:#2563EB;"></span>

      <!-- 1 工作看板 -->
      <a class="circle c-board" href="#工作看板連結">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="6" height="13" rx="1.4" stroke="#fff" stroke-width="1.6"/><rect x="3" y="18" width="6" height="3" rx="1.4" stroke="#fff" stroke-width="1.6"/><rect x="15" y="3" width="6" height="6" rx="1.4" stroke="#fff" stroke-width="1.6"/><rect x="15" y="11" width="6" height="10" rx="1.4" stroke="#fff" stroke-width="1.6"/></svg>
        <span class="label">工作看板</span>
      </a>

      <!-- 2 列印機預約 -->
      <a class="circle glass c-booking" href="#列印機預約連結">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2.5" stroke="#1d4ed8" stroke-width="1.6"/><path d="M3 10h18M8 3v4M16 3v4" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="15" r="2.4" stroke="#1d4ed8" stroke-width="1.6"/></svg>
        <span class="label">列印機預約</span>
      </a>

      <!-- 3 材料庫存 -->
      <a class="circle glass c-stock" href="#材料庫存連結">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9Z" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round"/><path d="m3 7.5 9 4.5 9-4.5M12 12v9" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span class="label">材料庫存</span>
      </a>

      <!-- 4 異常與資源 -->
      <a class="circle glass c-issue" href="#異常與資源連結">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#1d4ed8" stroke-width="1.6"/><path d="M12 7.5v5.5M12 16.2h.01" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="label">異常與資源</span>
      </a>
    </div>
  </main>
</div>
</body>
</html>
