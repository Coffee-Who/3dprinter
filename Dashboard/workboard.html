<script>
/* 共用常數 / 工具 — 所有 view 都靠 window.K 取用 */
(function () {
  const K = {};

  K.TODAY = new Date('2026-05-14');
  K.DAY = 86400000;

  K.ENG_ORDER = ['Jimmy', 'Jaylen', 'Bill', 'Barry'];
  K.ENG_LABEL = {
    Jimmy:  '廖璟程',
    Jaylen: '何哲綸',
    Bill:   '陳柏元',
    Barry:  'Barry',
  };
  K.ENG_FULLLABEL = {
    Jimmy:  '廖璟程 (Jimmy)',
    Jaylen: '何哲綸 (Jaylen)',
    Bill:   '陳柏元 (Bill)',
    Barry:  'Barry',
  };
  K.ENG_INIT = { Jimmy: 'JC', Jaylen: 'JL', Bill: 'BL', Barry: 'BR' };
  K.ENG_TONE = {
    Jimmy:  { fg: '#0c7a99', bg: '#e6f1f6' },
    Jaylen: { fg: '#6b3fa0', bg: '#efe9f7' },
    Bill:   { fg: '#1d6f43', bg: '#e6f1ea' },
    Barry:  { fg: '#a05a00', bg: '#f7eed8' },
  };

  K.MACHINES = ['Form4', 'Form4L', 'Fuse1+', 'Mark2'];
  K.MATERIALS = ['足夠', '需調撥'];
  K.PROGRESS_VALUES = [0, 25, 50, 75, 100];

  K.STATUS_TONE = {
    todo:      { fg: '#5a6270', bg: '#eef0f3', label: '待開始' },
    blocked:   { fg: '#8b6b13', bg: '#fbf3dc', label: '等待材料' },
    progress:  { fg: '#0c7a99', bg: '#e6f1f6', label: '進行中' },
    done:      { fg: '#1d6f43', bg: '#e6f1ea', label: '已完成' },
    cancelled: { fg: '#8a93a3', bg: '#f0f1f4', label: '已取消' },
  };

  K.daysUntil = function (dateStr) {
    if (!dateStr) return null;
    const d = new Date(dateStr);
    if (Number.isNaN(d.getTime())) return null;
    return Math.round((d - K.TODAY) / K.DAY);
  };

  K.statusOf = function (item) {
    if (/取消/.test(item.remark)) return 'cancelled';
    if (item.complete === '是' || item.progress === 100) return 'done';
    if (item.material === '需調撥') return 'blocked';
    if (item.progress > 0) return 'progress';
    return 'todo';
  };

  K.fmtYmd = function (d) {
    if (!d) return '—';
    const x = (d instanceof Date) ? d : new Date(d);
    if (Number.isNaN(x.getTime())) return '—';
    return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  };

  // 預設過濾器套用到所有 view 的入口
  K.applyFilters = function (data, { search = '', engineer = '', machine = '', status = '' } = {}) {
    const s = (search || '').trim().toLowerCase();
    return data.filter((d) => {
      if (s && !d.id.toLowerCase().includes(s) && !d.customer.toLowerCase().includes(s)) return false;
      if (engineer && d.engineer !== engineer) return false;
      if (machine && d.machine !== machine) return false;
      if (status && K.statusOf(d) !== status) return false;
      return true;
    });
  };

  window.K = K;
})();

</script>

<!-- Firebase 初始化 + DB service -->
<script>
// 由 index.html iframe 傳入 config，或獨立開啟時讀 firebase-config.js
(function(){
  function init(cfg){
    if(window._fbReady) return;
    firebase.initializeApp(cfg);
    window._fbReady = true;
    window._auth = firebase.auth();
    window._db   = firebase.firestore();
  }

  // 若由 parent frame 注入
  window.addEventListener('message', function(e){
    if(e.data && e.data.type === 'FB_CONFIG') init(e.data.config);
  });

  // 嘗試讀取同目錄 firebase-config.js（獨立開啟時）
  if(typeof FIREBASE_CONFIG !== 'undefined') init(FIREBASE_CONFIG);

  // ── Firestore CRUD ──
  window.FBOrders = {
    col: function(){ return window._db.collection('orders'); },
    getAll: async function(){
      var snap = await this.col().orderBy('seq').get();
      return snap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); });
    },
    add: async function(data){
      var ref = await this.col().add(Object.assign({}, data, {
        _ts: firebase.firestore.FieldValue.serverTimestamp()
      }));
      return ref.id;
    },
    update: async function(docId, data){
      await this.col().doc(docId).update(Object.assign({}, data, {
        _ts: firebase.firestore.FieldValue.serverTimestamp()
      }));
    },
    del: async function(docId){
      await this.col().doc(docId).delete();
    },
    onSnapshot: function(cb){
      return this.col().orderBy('seq').onSnapshot(function(snap){
        cb(snap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); }));
      });
    }
  };
})();
</script>

<!-- Views -->
<script type="text/babel" data-presets="react">
/* 總表 view —— 沿用原始 12 欄位 + 排序篩選 */
const { useState, useMemo } = React;

function TableView({ data, setData }) {
  const K = window.K;
  const [search, setSearch] = useState('');
  const [engF, setEngF] = useState('');
  const [machF, setMachF] = useState('');
  const [statusF, setStatusF] = useState('');
  const [matF, setMatF] = useState('');
  const [sortKey, setSortKey] = useState('seq');
  const [sortDir, setSortDir] = useState('asc');
  const [page, setPage] = useState(1);
  const [pageSize, setPageSize] = useState(20);

  const filtered = useMemo(() => {
    let arr = K.applyFilters(data, { search, engineer: engF, machine: machF, status: statusF });
    if (matF) arr = arr.filter(d => d.material === matF);
    arr = [...arr].sort((a, b) => {
      const dir = sortDir === 'asc' ? 1 : -1;
      const va = a[sortKey], vb = b[sortKey];
      if (typeof va === 'number') return (va - vb) * dir;
      return String(va || '').localeCompare(String(vb || '')) * dir;
    });
    return arr;
  }, [data, search, engF, machF, statusF, matF, sortKey, sortDir]);

  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const safePage = Math.min(page, totalPages);
  const start = (safePage - 1) * pageSize;
  const pageData = filtered.slice(start, start + pageSize);

  function toggleSort(key) {
    if (sortKey === key) {
      setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    } else {
      setSortKey(key);
      setSortDir('asc');
    }
  }

  function clearFilters() {
    setSearch(''); setEngF(''); setMachF(''); setStatusF(''); setMatF('');
    setSortKey('seq'); setSortDir('asc');
  }

  function exportCSV() {
    const headers = ['序列','EF單號','客戶名稱','執行工程師','EF期望交期','開始執行日期','預計完成日期','材料庫存','進度%','機器','完成','備註'];
    const lines = [headers.join(',')];
    filtered.forEach(it => {
      lines.push([
        it.seq, it.id, `"${it.customer}"`, K.ENG_LABEL[it.engineer]||it.engineer,
        it.dueDate, it.startDate, it.endDate, it.material, it.progress,
        it.machine, it.complete, `"${(it.remark||'').replace(/"/g,'""')}"`
      ].join(','));
    });
    const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = '工作進度_總表.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  function SortHeader({ k, children, align }) {
    const isSorted = sortKey === k;
    return (
      <th
        className={`sortable ${isSorted ? 'sorted' : ''}`}
        style={align === 'right' ? { textAlign: 'right' } : null}
        onClick={() => toggleSort(k)}
      >
        {children}
        <span className="sort-indicator">{isSorted ? (sortDir === 'asc' ? '↑' : '↓') : '↕'}</span>
      </th>
    );
  }

  function DueCell({ item }) {
    const st = K.statusOf(item);
    const done = st === 'done' || st === 'cancelled';
    if (!item.dueDate) return <span className="kt-due" style={{ color: '#8a93a3' }}>未訂期</span>;
    const d = K.daysUntil(item.dueDate);
    let cls = 'kt-due';
    let suffix = '';
    if (!done && d !== null) {
      if (d < 0)      { cls += ' kt-due-red'; suffix = ` · 逾${-d}d`; }
      else if (d <= 3){ cls += ' kt-due-red'; suffix = ` · ${d}d`; }
      else if (d <= 7){ cls += ' kt-due-amber'; suffix = ` · ${d}d`; }
      else            { suffix = ` · ${d}d`; }
    }
    return <span className={cls}>{item.dueDate}{suffix}</span>;
  }

  return (
    <div className="table-view">
      <div className="toolbar">
        <div className="toolbar-title">訂單總表</div>
        <span className="toolbar-sub">{total} / {data.length} 筆 · 點欄位標題可排序</span>

        <div className="t-search">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <circle cx="7" cy="7" r="5" stroke="currentColor" strokeWidth="1.5"/>
            <path d="M11 11l3 3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
          </svg>
          <input value={search} onChange={e=>{ setSearch(e.target.value); setPage(1); }} placeholder="搜尋 EF / 客戶"/>
        </div>

        <select className="t-sel" value={statusF} onChange={e=>{setStatusF(e.target.value); setPage(1);}}>
          <option value="">所有狀態</option>
          <option value="todo">待開始</option>
          <option value="blocked">等待材料</option>
          <option value="progress">進行中</option>
          <option value="done">已完成</option>
          <option value="cancelled">已取消</option>
        </select>

        <select className="t-sel" value={engF} onChange={e=>{setEngF(e.target.value); setPage(1);}}>
          <option value="">所有工程師</option>
          {K.ENG_ORDER.map(k=><option key={k} value={k}>{K.ENG_LABEL[k]}</option>)}
        </select>

        <select className="t-sel" value={machF} onChange={e=>{setMachF(e.target.value); setPage(1);}}>
          <option value="">所有機台</option>
          {K.MACHINES.map(m=><option key={m} value={m}>{m}</option>)}
        </select>

        <select className="t-sel" value={matF} onChange={e=>{setMatF(e.target.value); setPage(1);}}>
          <option value="">所有材料狀況</option>
          {K.MATERIALS.map(m=><option key={m} value={m}>{m}</option>)}
        </select>

        <button className="t-btn" onClick={clearFilters} title="清除所有篩選與排序">清除</button>
        <button className="t-btn" onClick={exportCSV}>匯出 CSV</button>
      </div>

      <div className="table-wrap">
        <table className="kt">
          <thead>
            <tr>
              <SortHeader k="seq" align="right">序列</SortHeader>
              <SortHeader k="id">EF 單號</SortHeader>
              <SortHeader k="customer">客戶名稱</SortHeader>
              <SortHeader k="engineer">執行工程師</SortHeader>
              <SortHeader k="dueDate">期望交期</SortHeader>
              <SortHeader k="startDate">開始日</SortHeader>
              <SortHeader k="endDate">完成日</SortHeader>
              <th>材料</th>
              <SortHeader k="progress">進度</SortHeader>
              <SortHeader k="machine">機台</SortHeader>
              <th>狀態</th>
              <th>備註</th>
              <th className="col-actions">操作</th>
            </tr>
          </thead>
          <tbody>
            {pageData.map(it => {
              const st = K.statusOf(it);
              const tone = K.ENG_TONE[it.engineer] || { fg: '#5a6270', bg: '#eef0f3' };
              return (
                <tr key={it.seq}>
                  <td className="col-seq">{it.seq}</td>
                  <td className="col-id">{it.id}</td>
                  <td className="col-customer">{it.customer}</td>
                  <td className="col-eng">
                    <span className="kt-eng">
                      <span className="kt-eng-dot" style={{ color: tone.fg, background: tone.bg }}>
                        {K.ENG_INIT[it.engineer]||it.engineer.slice(0,2)}
                      </span>
                      {K.ENG_LABEL[it.engineer]||it.engineer}
                    </span>
                  </td>
                  <td className="col-date"><DueCell item={it}/></td>
                  <td className="col-date">{it.startDate || '—'}</td>
                  <td className="col-date">{it.endDate || '—'}</td>
                  <td>
                    <span className={it.material==='足夠'?'kt-mat-ok':'kt-mat-need'}>
                      {it.material}
                    </span>
                  </td>
                  <td className="col-prog">
                    <div className="kt-prog">
                      <div className="kt-prog-bar">
                        <div className="kt-prog-fill" style={{
                          width: `${it.progress}%`,
                          background: st==='done' ? '#1d6f43' : st==='cancelled' ? '#cbd0d8' : '#0c7a99',
                        }}/>
                      </div>
                      <span className="kt-prog-num">{it.progress}%</span>
                    </div>
                  </td>
                  <td className="col-machine">{it.machine || '—'}</td>
                  <td>
                    <span className={`kt-pill kt-pill-${st}`}>{K.STATUS_TONE[st].label}</span>
                  </td>
                  <td style={{ color: '#5a6270', maxWidth: 180, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {it.remark || '—'}
                  </td>
                  <td className="col-actions">
                    <span className="kt-act">
                      <button className="kt-actbtn" title="切換完成">✓</button>
                      <button className="kt-actbtn" title="編輯">✎</button>
                      <button className="kt-actbtn danger" title="刪除"
                        onClick={()=>{ if(confirm('確定刪除此筆?')) setData(d=>d.filter(x=>x.seq!==it.seq)); }}>
                        ✕
                      </button>
                    </span>
                  </td>
                </tr>
              );
            })}
            {pageData.length === 0 && (
              <tr><td colSpan="13"><div className="kt-empty">沒有符合條件的訂單</div></td></tr>
            )}
          </tbody>
        </table>
      </div>

      <div className="kt-pagination">
        <div className="kt-pagination-info">
          <span>每頁</span>
          <select className="t-sel" style={{ height: 26, fontSize: 11.5 }} value={pageSize} onChange={e=>{ setPageSize(parseInt(e.target.value,10)); setPage(1); }}>
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <span>筆 · 共 {total} 筆</span>
        </div>

        <div className="kt-pagination-pages">
          <button className="kt-page" disabled={safePage<=1} onClick={()=>setPage(safePage-1)}>‹</button>
          {Array.from({ length: totalPages }).map((_,i)=>(
            <button key={i} className="kt-page" aria-current={i+1===safePage}
              onClick={()=>setPage(i+1)}>{i+1}</button>
          ))}
          <button className="kt-page" disabled={safePage>=totalPages} onClick={()=>setPage(safePage+1)}>›</button>
        </div>
      </div>
    </div>
  );
}

window.TableView = TableView;

</script>
<script type="text/babel" data-presets="react">
/* 看板 view — 經典卡片欄 */
const { useState: useStateK, useMemo: useMemoK } = React;

function KanbanView({ data, setData }) {
  const K = window.K;
  const [search, setSearch] = useStateK('');
  const [engF, setEngF] = useStateK('');
  const [machF, setMachF] = useStateK('');
  const [groupBy, setGroupBy] = useStateK('status');
  const [density, setDensity] = useStateK('comfortable');
  const [showCancelled, setShowCancelled] = useStateK(true);
  const [open, setOpen] = useStateK(null);
  const [dragItem, setDragItem] = useStateK(null);

  // -- 欄位定義 --
  const STATUS_COLUMNS = [
    { key: 'todo',     title: '待開始',  hint: '0%, 尚未排程',         tone: '#5a6270' },
    { key: 'blocked',  title: '等待材料', hint: '需調撥 / 待客戶',      tone: '#c79b2a' },
    { key: 'progress', title: '進行中',  hint: '已排程, 列印中',       tone: '#0c7a99' },
    { key: 'done',     title: '已完成',  hint: '100% / 出貨',          tone: '#1d6f43' },
    { key: 'cancelled',title: '已取消',  hint: '備註含「取消」',       tone: '#9aa3b2' },
  ];
  const PROGRESS_COLUMNS = [
    { key: '0',   title: '0%',   hint: '尚未開始', tone: '#9aa3b2' },
    { key: '25',  title: '25%',  hint: '備料/起印', tone: '#c79b2a' },
    { key: '50',  title: '50%',  hint: '列印中',    tone: '#c79b2a' },
    { key: '75',  title: '75%',  hint: '後處理',    tone: '#0c7a99' },
    { key: '100', title: '100%', hint: '完成',     tone: '#1d6f43' },
  ];
  const ENGINEER_COLUMNS = K.ENG_ORDER.map(k => ({
    key: k, title: K.ENG_LABEL[k], hint: k, tone: K.ENG_TONE[k].fg,
  }));
  const MACHINE_COLUMNS = K.MACHINES.map(k => ({
    key: k, title: k, hint: '機台', tone: '#0c7a99',
  }));

  function columnKeyFor(item) {
    if (groupBy === 'status')   return K.statusOf(item);
    if (groupBy === 'progress') return String(item.progress);
    if (groupBy === 'engineer') return item.engineer;
    if (groupBy === 'machine')  return item.machine || '—';
    return K.statusOf(item);
  }
  let cols =
    groupBy === 'status'   ? STATUS_COLUMNS :
    groupBy === 'progress' ? PROGRESS_COLUMNS :
    groupBy === 'engineer' ? ENGINEER_COLUMNS :
    MACHINE_COLUMNS;
  if (groupBy === 'status' && !showCancelled) {
    cols = cols.filter(c => c.key !== 'cancelled');
  }

  // -- 過濾 / 分組 --
  const filtered = useMemoK(() => K.applyFilters(data, { search, engineer: engF, machine: machF }),
    [data, search, engF, machF]);

  const grouped = useMemoK(() => {
    const m = {}; cols.forEach(c => { m[c.key] = []; });
    filtered.forEach(it => {
      const k = columnKeyFor(it);
      if (m[k]) m[k].push(it);
    });
    return m;
  }, [filtered, cols, groupBy]);

  // -- KPI --
  const stats = {
    total: data.length,
    wip: data.filter(d => K.statusOf(d) === 'progress').length,
    blocked: data.filter(d => K.statusOf(d) === 'blocked').length,
    due7: data.filter(d => {
      const s = K.statusOf(d);
      if (s === 'done' || s === 'cancelled') return false;
      const du = K.daysUntil(d.dueDate);
      return du !== null && du <= 7;
    }).length,
    done: data.filter(d => K.statusOf(d) === 'done').length,
  };

  function handleDrop(colKey) {
    if (!dragItem) return;
    setData(prev => prev.map(d => {
      if (d.seq !== dragItem.seq) return d;
      const u = { ...d };
      if (groupBy === 'status') {
        if (colKey === 'done')         { u.progress = 100; u.complete = '是'; u.remark = u.remark.replace('已取消', '').trim(); }
        else if (colKey === 'todo')    { u.progress = 0;   u.complete = '否'; u.remark = u.remark.replace('已取消', '').trim(); }
        else if (colKey === 'progress'){ if (u.progress === 0 || u.progress === 100) u.progress = 50; u.complete = '否'; u.remark = u.remark.replace('已取消', '').trim(); }
        else if (colKey === 'blocked') { u.material = '需調撥'; u.complete = '否'; }
        else if (colKey === 'cancelled'){ u.remark = u.remark ? `${u.remark} · 已取消` : '已取消'; }
      } else if (groupBy === 'progress') {
        u.progress = parseInt(colKey, 10);
        u.complete = u.progress === 100 ? '是' : '否';
      } else if (groupBy === 'engineer') {
        u.engineer = colKey;
      } else if (groupBy === 'machine') {
        u.machine = colKey;
      }
      return u;
    }));
    setDragItem(null);
  }

  function updateItem(updated) {
    setData(prev => prev.map(d => d.seq === updated.seq ? updated : d));
    setOpen(updated);
  }

  function Avatar({ engineer }) {
    const tone = K.ENG_TONE[engineer] || { fg: '#5a6270', bg: '#eef0f3' };
    return (
      <span className="avatar"
        style={{ color: tone.fg, background: tone.bg }}
        title={K.ENG_LABEL[engineer] || engineer}>
        {K.ENG_INIT[engineer] || engineer.slice(0, 2)}
      </span>
    );
  }

  function DueChip({ dateStr, isDone }) {
    if (!dateStr) return <span className="chip chip-muted">未訂期</span>;
    const d = K.daysUntil(dateStr);
    if (isDone) return <span className="chip chip-muted">{dateStr.slice(5)}</span>;
    let cls = 'chip', label = dateStr.slice(5);
    if (d < 0)        { cls += ' chip-red';    label = `逾期 ${-d}d`; }
    else if (d <= 3)  { cls += ' chip-red';    label = `${dateStr.slice(5)} · ${d}d`; }
    else if (d <= 7)  { cls += ' chip-amber';  label = `${dateStr.slice(5)} · ${d}d`; }
    else              { cls += ' chip-muted';  label = `${dateStr.slice(5)} · ${d}d`; }
    return <span className={cls}>{label}</span>;
  }

  function Card({ item }) {
    const st = K.statusOf(item);
    const done = st === 'done';
    const cancelled = st === 'cancelled';
    return (
      <div
        className={`card ${density === 'compact' ? 'card-compact' : ''} ${dragItem && dragItem.seq === item.seq ? 'card-dragging' : ''} ${cancelled ? 'card-cancelled' : ''}`}
        draggable
        onDragStart={() => setDragItem(item)}
        onDragEnd={() => setDragItem(null)}
        onClick={() => setOpen(item)}
      >
        <div className="card-top">
          <span className="card-id">EF · {item.id.slice(-7)}</span>
          <div className="card-top-right">
            {item.material === '需調撥' && <span className="dot dot-amber" title="需調撥材料"></span>}
            <Avatar engineer={item.engineer}/>
          </div>
        </div>
        <div className="card-title">{item.customer}</div>
        {density !== 'compact' && (
          <div className="card-meta">
            <span className="meta-machine">{item.machine || '未指派機台'}</span>
            {item.remark && <span className="meta-remark" title={item.remark}>· {item.remark}</span>}
          </div>
        )}
        <div className="card-progress">
          <div className="progress-track">
            <div className="progress-fill" style={{
              width: `${item.progress}%`,
              background: done ? '#1d6f43' : cancelled ? '#cbd0d8' : '#0c7a99',
            }}/>
          </div>
          <span className="progress-num">{item.progress}%</span>
        </div>
        <div className="card-foot">
          <DueChip dateStr={item.dueDate} isDone={done}/>
          <span className="seq-num">#{String(item.seq).padStart(3, '0')}</span>
        </div>
      </div>
    );
  }

  function Column({ col, items }) {
    const [over, setOver] = useStateK(false);
    return (
      <div
        className={`col ${over ? 'col-over' : ''}`}
        onDragOver={(e) => { e.preventDefault(); setOver(true); }}
        onDragLeave={() => setOver(false)}
        onDrop={() => { setOver(false); handleDrop(col.key); }}
      >
        <div className="col-head">
          <div className="col-head-left">
            <span className="col-dot" style={{ background: col.tone }}/>
            <span className="col-title">{col.title}</span>
            <span className="col-count">{items.length}</span>
          </div>
          <span className="col-hint">{col.hint}</span>
        </div>
        <div className="col-body">
          {items.map(it => <Card key={it.seq} item={it}/>)}
          {items.length === 0 && <div className="col-empty">—</div>}
        </div>
      </div>
    );
  }

  function Drawer() {
    if (!open) return null;
    const st = K.statusOf(open);
    return (
      <div className="drawer-wrap" onClick={() => setOpen(null)}>
        <aside className="drawer" onClick={e => e.stopPropagation()}>
          <header className="drawer-head">
            <div>
              <div className="drawer-eyebrow">EF 訂單詳情</div>
              <div className="drawer-id">{open.id}</div>
            </div>
            <button className="icon-btn" onClick={() => setOpen(null)}>×</button>
          </header>
          <div className="drawer-customer">{open.customer}</div>
          <div className="drawer-row">
            <div className="drawer-field">
              <div className="field-label">執行工程師</div>
              <div className="field-value">
                <Avatar engineer={open.engineer}/>
                <span style={{ marginLeft: 8 }}>{K.ENG_LABEL[open.engineer]}</span>
              </div>
            </div>
            <div className="drawer-field">
              <div className="field-label">機台</div>
              <div className="field-value">{open.machine || '—'}</div>
            </div>
          </div>
          <div className="drawer-row">
            <div className="drawer-field">
              <div className="field-label">期望交期</div>
              <div className="field-value"><DueChip dateStr={open.dueDate} isDone={st === 'done'}/></div>
            </div>
            <div className="drawer-field">
              <div className="field-label">材料</div>
              <div className="field-value">
                <span className={`pill ${open.material === '需調撥' ? 'pill-amber' : 'pill-ok'}`}>
                  {open.material}
                </span>
              </div>
            </div>
          </div>
          <div className="drawer-row">
            <div className="drawer-field">
              <div className="field-label">開始日期</div>
              <div className="field-value mono">{open.startDate || '—'}</div>
            </div>
            <div className="drawer-field">
              <div className="field-label">預計完成</div>
              <div className="field-value mono">{open.endDate || '—'}</div>
            </div>
          </div>
          <div className="drawer-field" style={{ marginTop: 18 }}>
            <div className="field-label">進度</div>
            <div className="progress-controls">
              {[0, 25, 50, 75, 100].map(p => (
                <button key={p}
                  className={`prog-btn ${open.progress === p ? 'prog-btn-active' : ''}`}
                  onClick={() => updateItem({ ...open, progress: p, complete: p === 100 ? '是' : '否' })}>
                  {p}%
                </button>
              ))}
            </div>
          </div>
          <div className="drawer-field" style={{ marginTop: 18 }}>
            <div className="field-label">備註</div>
            <div className="field-value remark-box">{open.remark || '—'}</div>
          </div>
          <footer className="drawer-foot">
            <span>序列 #{String(open.seq).padStart(3, '0')}</span>
            <span>狀態:{K.STATUS_TONE[st].label}</span>
          </footer>
        </aside>
      </div>
    );
  }

  return (
    <div className="kanban-view">
      {/* 工具列 */}
      <div className="toolbar">
        <div className="toolbar-title">看板檢視</div>
        <div className="t-search">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <circle cx="7" cy="7" r="5" stroke="currentColor" strokeWidth="1.5"/>
            <path d="M11 11l3 3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
          </svg>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="搜尋 EF / 客戶"/>
        </div>
        <select className="t-sel" value={engF} onChange={e => setEngF(e.target.value)}>
          <option value="">所有工程師</option>
          {K.ENG_ORDER.map(k => <option key={k} value={k}>{K.ENG_LABEL[k]}</option>)}
        </select>
        <select className="t-sel" value={machF} onChange={e => setMachF(e.target.value)}>
          <option value="">所有機台</option>
          {K.MACHINES.map(m => <option key={m} value={m}>{m}</option>)}
        </select>
        <div className="seg">
          {[
            { k: 'status',   label: '狀態' },
            { k: 'progress', label: '進度' },
            { k: 'engineer', label: '工程師' },
            { k: 'machine',  label: '機台' },
          ].map(o => (
            <button key={o.k}
              className={`seg-btn ${groupBy === o.k ? 'seg-btn-active' : ''}`}
              onClick={() => setGroupBy(o.k)}>{o.label}</button>
          ))}
        </div>
      </div>

      {/* KPI */}
      <div className="kpi-strip">
        {[
          { label: '總訂單',     value: stats.total },
          { label: '進行中',     value: stats.wip },
          { label: '等待材料',   value: stats.blocked, sub: '需調撥/待簽回', accent: '#c79b2a' },
          { label: '7 天內到期', value: stats.due7,    sub: '未完成且交期 ≤ 7 天', accent: '#c0392b' },
          { label: '已完成',     value: stats.done,    sub: '100% / 完成', accent: '#1d6f43' },
        ].map((c, i) => (
          <div key={i} className="kpi-cell">
            <div className="kpi-label">{c.label}</div>
            <div className="kpi-value" style={c.accent ? { color: c.accent } : null}>{c.value}</div>
            <div className="kpi-sub">{c.sub || '即時更新'}</div>
          </div>
        ))}
      </div>

      {/* 看板 */}
      <main className="board">
        {cols.map(col => <Column key={col.key} col={col} items={grouped[col.key] || []}/>)}
      </main>

      <footer className="footnote">
        <span>共 {filtered.length} / {data.length} 筆</span>
        <span className="dot-sep"/>
        <span>依「{ {status:'狀態',progress:'進度',engineer:'工程師',machine:'機台'}[groupBy] }」分欄</span>
        <span className="dot-sep"/>
        <span>拖曳卡片可在欄間移動</span>
      </footer>

      <Drawer/>
    </div>
  );
}

window.KanbanView = KanbanView;

</script>
<script type="text/babel" data-presets="react">
/* 時間軸 / 甘特圖 view */
const { useState: useStateG, useMemo: useMemoG } = React;

function GanttView({ data }) {
  const K = window.K;
  const TODAY = K.TODAY;
  const DAY = K.DAY;

  const [rangeKey, setRangeKey] = useStateG('quarter');
  const [engF, setEngF] = useStateG('');
  const [tip, setTip] = useStateG(null);

  const RANGES = [
    { key:'month',  label:'本月',   spanDays: 30,  startOffset: -14 },
    { key:'quarter',label:'3 個月', spanDays: 92,  startOffset: -30 },
    { key:'half',   label:'半年',   spanDays: 180, startOffset: -60 },
  ];

  const range = RANGES.find(r => r.key === rangeKey);
  const start = new Date(TODAY.getTime() + range.startOffset * DAY);
  start.setHours(0,0,0,0);
  const days = [];
  for (let d = new Date(start); d < new Date(start.getTime() + range.spanDays * DAY); d = new Date(d.getTime() + DAY)) {
    days.push(new Date(d));
  }

  const monthsAgg = [];
  days.forEach(d => {
    const ym = `${d.getFullYear()}-${d.getMonth()}`;
    const last = monthsAgg[monthsAgg.length-1];
    if (last && last.ym === ym) last.count++;
    else monthsAgg.push({ ym, count: 1, year: d.getFullYear(), month: d.getMonth() });
  });

  const items = data.filter(it => !engF || it.engineer === engF);
  const lanes = K.ENG_ORDER.filter(e => !engF || engF === e).map(eng => ({
    eng, items: items.filter(it => it.engineer === eng),
  }));

  function parseDate(s) {
    if (!s) return null;
    const d = new Date(s);
    return Number.isNaN(d.getTime()) ? null : d;
  }
  function barPos(it) {
    const sd = parseDate(it.startDate);
    const dd = parseDate(it.dueDate);
    if (!dd) return null;
    const barStart = sd || new Date(dd.getTime() - 7 * DAY);
    const startIdx = Math.round((barStart - start) / DAY);
    const dueIdx = Math.round((dd - start) / DAY);
    if (dueIdx < 0 || startIdx > days.length) return null;
    const clippedStart = Math.max(0, startIdx);
    const clippedEnd = Math.min(days.length, dueIdx + 1);
    return {
      left: clippedStart * 22,
      width: Math.max(28, (clippedEnd - clippedStart) * 22),
      noStart: !sd,
      overdue: dd < TODAY && K.statusOf(it) !== 'done' && K.statusOf(it) !== 'cancelled',
    };
  }
  function todayPos() {
    const idx = (TODAY - start) / DAY;
    if (idx < 0 || idx > days.length) return null;
    return idx * 22;
  }
  const isWeekend = (d) => { const w = d.getDay(); return w === 0 || w === 6; };
  const isMonday = (d) => d.getDay() === 1;
  const isToday = (d) =>
    d.getFullYear() === TODAY.getFullYear() &&
    d.getMonth() === TODAY.getMonth() &&
    d.getDate() === TODAY.getDate();

  const tpos = todayPos();

  return (
    <div className="gantt-view">
      <div className="toolbar">
        <div className="toolbar-title">時間軸 / 甘特圖</div>
        <span className="toolbar-sub">{items.length} 筆訂單 · 滑鼠移到 bar 顯示詳情</span>
        <span className="today-pill">
          <span className="dot"></span>
          今天 <b>{K.fmtYmd(TODAY)}</b>
        </span>
        <select className="t-sel" value={engF} onChange={e => setEngF(e.target.value)}>
          <option value="">所有工程師</option>
          {K.ENG_ORDER.map(k => <option key={k} value={k}>{K.ENG_FULLLABEL[k]}</option>)}
        </select>
        <div className="seg">
          {RANGES.map(r => (
            <button key={r.key}
              className={`seg-btn ${rangeKey === r.key ? 'seg-btn-active' : ''}`}
              onClick={() => setRangeKey(r.key)}>{r.label}</button>
          ))}
        </div>
      </div>

      <div className="legend">
        <span className="lg"><span className="lg-chip todo"/>待開始</span>
        <span className="lg"><span className="lg-chip blocked"/>等待材料</span>
        <span className="lg"><span className="lg-chip progress"/>進行中</span>
        <span className="lg"><span className="lg-chip done"/>已完成</span>
        <span className="lg"><span className="lg-chip cancelled"/>已取消</span>
        <span className="lg-spacer"/>
        <span className="lg-hint">bar 內填色 = 進度 %</span>
      </div>

      <div className="gantt">
        <div className="gantt-left">
          <div className="lane-head-sticky">工程師</div>
          {lanes.map(l => (
            <div key={l.eng} className="lane">
              <span className="lane-avatar" style={{
                color: K.ENG_TONE[l.eng].fg,
                background: K.ENG_TONE[l.eng].bg,
              }}>{K.ENG_INIT[l.eng]}</span>
              <div className="lane-meta">
                <span className="lane-name">{K.ENG_FULLLABEL[l.eng]}</span>
                <span className="lane-sub">{l.items.length} 訂單</span>
              </div>
            </div>
          ))}
        </div>

        <div className="gantt-right" style={{ minWidth: days.length * 22 + 'px' }}>
          <div className="scale" style={{ width: days.length * 22 + 'px' }}>
            <div className="scale-months">
              {monthsAgg.map((m, i) => (
                <div key={i} className="scale-month" style={{ width: m.count * 22 + 'px' }}>
                  {m.year} · {String(m.month + 1).padStart(2, '0')} 月
                </div>
              ))}
            </div>
            <div className="scale-days">
              {days.map((d, i) => (
                <div key={i} className={[
                  'scale-day',
                  isWeekend(d) ? 'weekend' : '',
                  isMonday(d) ? 'is-monday' : '',
                  isToday(d) ? 'is-today' : '',
                ].filter(Boolean).join(' ')}>
                  {d.getDate()}
                </div>
              ))}
            </div>
          </div>

          {tpos !== null && (
            <div className="today-line" style={{ left: tpos + 'px', top: 48 }}/>
          )}

          {lanes.map((l, li) => (
            <div key={l.eng} className={`row ${li % 2 === 1 ? 'alt' : ''}`} style={{ width: days.length * 22 + 'px' }}>
              <div className="grid-lines">
                {days.map((d, i) => (
                  <div key={i} className={[
                    'grid-cell',
                    isWeekend(d) ? 'weekend' : '',
                    isMonday(d) ? 'is-monday' : '',
                  ].filter(Boolean).join(' ')}/>
                ))}
              </div>

              {l.items.map(it => {
                const pos = barPos(it);
                if (!pos) return null;
                const st = K.statusOf(it);
                const cls = `bar ${st} ${pos.noStart ? 'todo-pending' : ''} ${pos.overdue ? 'overdue' : ''}`;
                return (
                  <div key={it.seq} className={cls}
                    style={{ left: pos.left + 'px', width: pos.width + 'px' }}
                    onMouseEnter={e => setTip({
                      item: it,
                      x: e.currentTarget.offsetLeft + pos.width + 10,
                      y: e.currentTarget.offsetTop - 6,
                    })}
                    onMouseLeave={() => setTip(null)}
                  >
                    {!pos.noStart && st !== 'todo' && (
                      <div className="bar-fill" style={{ width: `${it.progress}%` }}/>
                    )}
                    <span className="bar-text">
                      EF·{it.id.slice(-7)} · {it.customer.length > 10 ? it.customer.slice(0, 10) + '…' : it.customer}
                    </span>
                    {!pos.noStart && st !== 'done' && st !== 'cancelled' && pos.overdue && (
                      <div className="bar-due-marker"/>
                    )}
                  </div>
                );
              })}
            </div>
          ))}

          {tip && (
            <div className="tooltip" style={{ left: tip.x + 'px', top: tip.y + 48 + 'px' }}>
              <div className="tooltip-title">{tip.item.customer}</div>
              <div className="tooltip-row">EF · <b>{tip.item.id}</b></div>
              <div className="tooltip-row">機台 · <b>{tip.item.machine || '—'}</b></div>
              <div className="tooltip-row">進度 · <b>{tip.item.progress}%</b></div>
              <div className="tooltip-row">期望交期 · <b>{tip.item.dueDate || '—'}</b></div>
              <div className="tooltip-row">開始日 · <b>{tip.item.startDate || '未排程'}</b></div>
              <div className="tooltip-row">材料 · <b>{tip.item.material}</b></div>
              {tip.item.remark && <div className="tooltip-row" style={{ marginTop: 4 }}>備註 · <b>{tip.item.remark}</b></div>}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

window.GanttView = GanttView;

</script>
<script type="text/babel" data-presets="react">
/* Dashboard view — 3 預設 + 3 自由選擇 */
const { useState: useStateD, useMemo: useMemoD } = React;

// 維度定義
const DIMENSIONS = {
  status: {
    label: '狀態',
    extract: (it) => window.K.statusOf(it),
    order: ['todo', 'blocked', 'progress', 'done', 'cancelled'],
    label_for: (k) => window.K.STATUS_TONE[k].label,
    color_for: (k) => window.K.STATUS_TONE[k].fg,
  },
  engineer: {
    label: '工程師',
    extract: (it) => it.engineer,
    order: window.K.ENG_ORDER,
    label_for: (k) => window.K.ENG_LABEL[k] || k,
    color_for: (k) => (window.K.ENG_TONE[k] || { fg: '#0c7a99' }).fg,
  },
  progress: {
    label: '進度',
    extract: (it) => String(it.progress),
    order: ['0', '25', '50', '75', '100'],
    label_for: (k) => k + '%',
    color_for: (k) => {
      const n = parseInt(k, 10);
      if (n === 0) return '#9aa3b2';
      if (n === 100) return '#1d6f43';
      return '#0c7a99';
    },
  },
  machine: {
    label: '機台',
    extract: (it) => it.machine || '未指派',
    order: null,
    label_for: (k) => k,
    color_for: () => '#0c7a99',
  },
  material: {
    label: '材料',
    extract: (it) => it.material,
    order: ['足夠', '需調撥'],
    label_for: (k) => k,
    color_for: (k) => k === '足夠' ? '#1d6f43' : '#c79b2a',
  },
  customer: {
    label: '客戶 (Top 8)',
    extract: (it) => it.customer,
    order: null,
    label_for: (k) => k.length > 12 ? k.slice(0, 12) + '…' : k,
    color_for: () => '#0c7a99',
  },
};

function aggregate(data, dimKey) {
  const dim = DIMENSIONS[dimKey];
  const counts = {};
  data.forEach(it => {
    const k = dim.extract(it);
    counts[k] = (counts[k] || 0) + 1;
  });
  let keys;
  if (dim.order) {
    keys = dim.order.filter(k => counts[k] !== undefined);
    // 加入 order 沒有列到的(避免漏掉)
    Object.keys(counts).forEach(k => { if (!keys.includes(k)) keys.push(k); });
  } else {
    keys = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    if (dimKey === 'customer') keys = keys.slice(0, 8);
  }
  return keys.map(k => ({
    key: k,
    label: dim.label_for(k),
    value: counts[k] || 0,
    color: dim.color_for(k),
  }));
}

// ─── 圖表元件 ───────────────────

function VerticalBar({ data, height = 200 }) {
  if (data.length === 0) return <div className="chart-empty">無資料</div>;
  const max = Math.max(...data.map(d => d.value), 1);
  const padding = { top: 16, right: 8, bottom: 28, left: 28 };
  const W = 320, H = height;
  const innerW = W - padding.left - padding.right;
  const innerH = H - padding.top - padding.bottom;
  const barW = innerW / data.length;
  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(p => Math.round(max * p));

  return (
    <svg className="svg-chart" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet">
      {/* gridlines */}
      {gridLines.map((v, i) => {
        const y = padding.top + innerH - (v / max) * innerH;
        return (
          <g key={i}>
            <line x1={padding.left} x2={W - padding.right} y1={y} y2={y} className="vbar-grid"/>
            <text x={padding.left - 4} y={y + 3} fontSize="9" textAnchor="end" fill="#8a93a3">{v}</text>
          </g>
        );
      })}
      {/* bars */}
      {data.map((d, i) => {
        const h = (d.value / max) * innerH;
        const x = padding.left + i * barW + barW * 0.2;
        const w = barW * 0.6;
        const y = padding.top + innerH - h;
        return (
          <g key={d.key}>
            <rect x={x} y={padding.top} width={w} height={innerH}
              className="vbar-track" rx="2"/>
            <rect x={x} y={y} width={w} height={h}
              fill={d.color} className="vbar-bar" rx="2"/>
            <text x={x + w/2} y={y - 4} fontSize="10" textAnchor="middle" fill="#0a0e14" fontWeight="600">
              {d.value}
            </text>
            <text x={x + w/2} y={H - padding.bottom + 14} fontSize="9.5" textAnchor="middle" fill="#5a6270">
              {d.label}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function HorizontalBar({ data }) {
  if (data.length === 0) return <div className="chart-empty">無資料</div>;
  const max = Math.max(...data.map(d => d.value), 1);
  return (
    <div className="hbar-list">
      {data.map(d => (
        <div key={d.key} className="hbar-row">
          <div className="hbar-label" title={d.label}>{d.label}</div>
          <div className="hbar-track">
            <div className="hbar-fill" style={{
              width: `${(d.value / max) * 100}%`,
              background: d.color,
            }}/>
          </div>
          <div className="hbar-num">{d.value}</div>
        </div>
      ))}
    </div>
  );
}

function DonutChart({ data, centerLabel = '總計' }) {
  if (data.length === 0) return <div className="chart-empty">無資料</div>;
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const W = 200, R = 78, r = 52, cx = W/2, cy = W/2;
  let cumulative = 0;
  const segments = data.map(d => {
    const start = cumulative / total;
    cumulative += d.value;
    const end = cumulative / total;
    return { ...d, start, end };
  });
  function arcPath(start, end) {
    if (end - start >= 0.9999) {
      // full circle — draw as two arcs
      return [
        `M ${cx + R} ${cy}`,
        `A ${R} ${R} 0 1 1 ${cx - R} ${cy}`,
        `A ${R} ${R} 0 1 1 ${cx + R} ${cy}`,
        `L ${cx + r} ${cy}`,
        `A ${r} ${r} 0 1 0 ${cx - r} ${cy}`,
        `A ${r} ${r} 0 1 0 ${cx + r} ${cy}`,
        'Z',
      ].join(' ');
    }
    const a0 = start * Math.PI * 2 - Math.PI / 2;
    const a1 = end * Math.PI * 2 - Math.PI / 2;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0);
    const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const x2 = cx + r * Math.cos(a1), y2 = cy + r * Math.sin(a1);
    const x3 = cx + r * Math.cos(a0), y3 = cy + r * Math.sin(a0);
    const large = end - start > 0.5 ? 1 : 0;
    return [
      `M ${x0} ${y0}`,
      `A ${R} ${R} 0 ${large} 1 ${x1} ${y1}`,
      `L ${x2} ${y2}`,
      `A ${r} ${r} 0 ${large} 0 ${x3} ${y3}`,
      'Z',
    ].join(' ');
  }
  return (
    <div style={{ position: 'relative', display: 'flex', flexDirection: 'column', alignItems: 'center', width: '100%' }}>
      <div style={{ position: 'relative', width: W, height: W }}>
        <svg width={W} height={W} viewBox={`0 0 ${W} ${W}`}>
          {segments.map(seg => (
            <path key={seg.key} d={arcPath(seg.start, seg.end)} fill={seg.color}
              stroke="#fff" strokeWidth="1.5"/>
          ))}
        </svg>
        <div className="donut-center">
          <div className="donut-center-value">{total}</div>
          <div className="donut-center-label">{centerLabel}</div>
        </div>
      </div>
      <div className="chart-legend" style={{ marginTop: 14, borderTop: 0, paddingTop: 0 }}>
        {segments.map(seg => (
          <span key={seg.key} className="chart-legend-item">
            <span className="chart-legend-dot" style={{ background: seg.color }}/>
            {seg.label} · {seg.value}
          </span>
        ))}
      </div>
    </div>
  );
}

function PieChart({ data, centerLabel = '總計' }) {
  // 跟 Donut 一樣,但內半徑為 0
  if (data.length === 0) return <div className="chart-empty">無資料</div>;
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const W = 200, R = 84, cx = W/2, cy = W/2;
  let cumulative = 0;
  const segments = data.map(d => {
    const start = cumulative / total;
    cumulative += d.value;
    const end = cumulative / total;
    return { ...d, start, end };
  });
  function piePath(start, end) {
    if (end - start >= 0.9999) {
      return [
        `M ${cx + R} ${cy}`,
        `A ${R} ${R} 0 1 1 ${cx - R} ${cy}`,
        `A ${R} ${R} 0 1 1 ${cx + R} ${cy}`,
        'Z',
      ].join(' ');
    }
    const a0 = start * Math.PI * 2 - Math.PI / 2;
    const a1 = end * Math.PI * 2 - Math.PI / 2;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0);
    const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const large = end - start > 0.5 ? 1 : 0;
    return [
      `M ${cx} ${cy}`,
      `L ${x0} ${y0}`,
      `A ${R} ${R} 0 ${large} 1 ${x1} ${y1}`,
      'Z',
    ].join(' ');
  }
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', width: '100%' }}>
      <svg width={W} height={W} viewBox={`0 0 ${W} ${W}`}>
        {segments.map(seg => (
          <path key={seg.key} d={piePath(seg.start, seg.end)} fill={seg.color}
            stroke="#fff" strokeWidth="1.5"/>
        ))}
      </svg>
      <div className="chart-legend" style={{ marginTop: 14, borderTop: 0, paddingTop: 0 }}>
        {segments.map(seg => (
          <span key={seg.key} className="chart-legend-item">
            <span className="chart-legend-dot" style={{ background: seg.color }}/>
            {seg.label} · {seg.value}
          </span>
        ))}
      </div>
    </div>
  );
}

function LineChart({ data, height = 200 }) {
  // 折線適合時序資料 — 把資料當作有順序的時間軸
  if (data.length === 0) return <div className="chart-empty">無資料</div>;
  const max = Math.max(...data.map(d => d.value), 1);
  const padding = { top: 16, right: 12, bottom: 28, left: 28 };
  const W = 320, H = height;
  const innerW = W - padding.left - padding.right;
  const innerH = H - padding.top - padding.bottom;
  const stepX = data.length > 1 ? innerW / (data.length - 1) : 0;
  const points = data.map((d, i) => ({
    x: padding.left + i * stepX,
    y: padding.top + innerH - (d.value / max) * innerH,
    value: d.value,
    label: d.label,
  }));
  const pathD = points.map((p, i) => (i === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ');
  const areaD = points.length > 0
    ? `${pathD} L ${points[points.length-1].x} ${padding.top + innerH} L ${points[0].x} ${padding.top + innerH} Z`
    : '';
  const gridLines = [0, 0.5, 1].map(p => Math.round(max * p));

  return (
    <svg className="svg-chart" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet">
      {gridLines.map((v, i) => {
        const y = padding.top + innerH - (v / max) * innerH;
        return (
          <g key={i}>
            <line x1={padding.left} x2={W - padding.right} y1={y} y2={y} className="line-grid"/>
            <text x={padding.left - 4} y={y + 3} fontSize="9" textAnchor="end" fill="#8a93a3">{v}</text>
          </g>
        );
      })}
      <path d={areaD} className="line-area"/>
      <path d={pathD} className="line-path"/>
      {points.map((p, i) => (
        <g key={i}>
          <circle cx={p.x} cy={p.y} r="3.5" className="line-dot"/>
          <text x={p.x} y={H - padding.bottom + 14} fontSize="9" textAnchor="middle" fill="#5a6270">
            {p.label}
          </text>
        </g>
      ))}
    </svg>
  );
}

function ChartByType({ type, data, centerLabel }) {
  if (type === 'bar') return <VerticalBar data={data}/>;
  if (type === 'hbar') return <HorizontalBar data={data}/>;
  if (type === 'donut') return <DonutChart data={data} centerLabel={centerLabel}/>;
  if (type === 'pie') return <PieChart data={data} centerLabel={centerLabel}/>;
  if (type === 'line') return <LineChart data={data}/>;
  return null;
}

// ─── 主元件 ──────────────────────

function DashboardView({ data }) {
  const K = window.K;

  // 3 自由選擇 slot 的狀態
  const [c1, setC1] = useStateD({ dim: 'machine',  type: 'donut' });
  const [c2, setC2] = useStateD({ dim: 'material', type: 'donut' });
  const [c3, setC3] = useStateD({ dim: 'customer', type: 'hbar' });

  // KPI
  const stats = {
    total: data.length,
    wip: data.filter(d => K.statusOf(d) === 'progress').length,
    blocked: data.filter(d => K.statusOf(d) === 'blocked').length,
    due7: data.filter(d => {
      const s = K.statusOf(d);
      if (s === 'done' || s === 'cancelled') return false;
      const du = K.daysUntil(d.dueDate);
      return du !== null && du <= 7;
    }).length,
    done: data.filter(d => K.statusOf(d) === 'done').length,
  };

  // 預設 3 個圖表
  const statusData = useMemoD(() => aggregate(data, 'status'), [data]);
  const engineerData = useMemoD(() => aggregate(data, 'engineer'), [data]);
  const progressData = useMemoD(() => aggregate(data, 'progress'), [data]);

  // 3 個自由 slot
  const customCharts = [
    { state: c1, setState: setC1, idx: 1 },
    { state: c2, setState: setC2, idx: 2 },
    { state: c3, setState: setC3, idx: 3 },
  ];

  const CHART_TYPES = [
    { value: 'bar',   label: '長條圖' },
    { value: 'hbar',  label: '橫條圖' },
    { value: 'donut', label: '環狀圖' },
    { value: 'pie',   label: '圓餅圖' },
    { value: 'line',  label: '折線圖' },
  ];

  return (
    <div className="dash">
      {/* KPI */}
      <div className="dash-kpis">
        <div className="dash-kpi">
          <div className="dash-kpi-label">總訂單</div>
          <div className="dash-kpi-value">{stats.total}</div>
          <div className="dash-kpi-sub">全部資料筆數</div>
        </div>
        <div className="dash-kpi">
          <div className="dash-kpi-label">進行中</div>
          <div className="dash-kpi-value">{stats.wip}</div>
          <div className="dash-kpi-sub">已開工未完成</div>
        </div>
        <div className="dash-kpi">
          <div className="dash-kpi-label">等待材料</div>
          <div className="dash-kpi-value" style={{ color: '#c79b2a' }}>{stats.blocked}</div>
          <div className="dash-kpi-sub">需調撥 / 待簽回</div>
        </div>
        <div className="dash-kpi">
          <div className="dash-kpi-label">7 天內到期</div>
          <div className="dash-kpi-value" style={{ color: '#c0392b' }}>{stats.due7}</div>
          <div className="dash-kpi-sub">未完成且交期 ≤ 7 天</div>
        </div>
        <div className="dash-kpi">
          <div className="dash-kpi-label">已完成</div>
          <div className="dash-kpi-value" style={{ color: '#1d6f43' }}>{stats.done}</div>
          <div className="dash-kpi-sub">100% / 完成</div>
        </div>
      </div>

      {/* 預設圖表 */}
      <div className="dash-section">
        <div className="dash-section-title">預設分析</div>
        <div className="dash-section-sub">DEFAULT VIEWS</div>
      </div>
      <div className="dash-grid">
        <div className="chart-card">
          <div className="chart-card-head">
            <div className="chart-card-title">狀態分布</div>
            <div className="chart-card-meta">DONUT</div>
          </div>
          <div className="chart-body">
            <DonutChart data={statusData} centerLabel="總訂單"/>
          </div>
        </div>

        <div className="chart-card">
          <div className="chart-card-head">
            <div className="chart-card-title">工程師負荷</div>
            <div className="chart-card-meta">HORIZONTAL BAR</div>
          </div>
          <div className="chart-body">
            <HorizontalBar data={engineerData}/>
          </div>
        </div>

        <div className="chart-card">
          <div className="chart-card-head">
            <div className="chart-card-title">進度分布</div>
            <div className="chart-card-meta">VERTICAL BAR</div>
          </div>
          <div className="chart-body">
            <VerticalBar data={progressData}/>
          </div>
        </div>
      </div>

      {/* 自由選擇 */}
      <div className="dash-section">
        <div className="dash-section-title">自由分析</div>
        <div className="dash-section-sub">CUSTOM — 選擇維度與圖表類型</div>
      </div>
      <div className="dash-grid">
        {customCharts.map(({ state, setState, idx }) => {
          const aggData = aggregate(data, state.dim);
          return (
            <div key={idx} className="chart-card custom">
              <div className="chart-card-head">
                <div className="chart-card-title">自由分析 #{idx}</div>
                <select className="chart-mini-sel" value={state.dim}
                  onChange={e => setState({ ...state, dim: e.target.value })}>
                  {Object.entries(DIMENSIONS).map(([k, d]) => (
                    <option key={k} value={k}>依 {d.label}</option>
                  ))}
                </select>
                <select className="chart-mini-sel" value={state.type}
                  onChange={e => setState({ ...state, type: e.target.value })}>
                  {CHART_TYPES.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
                </select>
              </div>
              <div className="chart-body">
                <ChartByType type={state.type} data={aggData}
                  centerLabel={DIMENSIONS[state.dim].label}/>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

window.DashboardView = DashboardView;
window.VerticalBar = VerticalBar;
window.HorizontalBar = HorizontalBar;
window.DonutChart = DonutChart;
window.PieChart = PieChart;
window.LineChart = LineChart;

</script>

<!-- WorkBoard 主元件 -->
<script type="text/babel" data-presets="react">
const { useState: useStateWB, useEffect: useEffectWB, useRef: useRefWB } = React;

const TABS = [
  { key:'table',     label:'總表' },
  { key:'kanban',    label:'看板' },
  { key:'gantt',     label:'時間軸' },
  { key:'dashboard', label:'Dashboard' },
];

const TAB_ICONS = {
  table:(<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1.5" y="2" width="11" height="10" rx="1.2" stroke="currentColor" strokeWidth="1.3"/><line x1="1.5" y1="5.5" x2="12.5" y2="5.5" stroke="currentColor" strokeWidth="1.3"/><line x1="5" y1="2" x2="5" y2="12" stroke="currentColor" strokeWidth="1.3"/></svg>),
  kanban:(<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1.5" y="2" width="3" height="10" rx="0.8" stroke="currentColor" strokeWidth="1.3"/><rect x="5.5" y="2" width="3" height="6.5" rx="0.8" stroke="currentColor" strokeWidth="1.3"/><rect x="9.5" y="2" width="3" height="8.5" rx="0.8" stroke="currentColor" strokeWidth="1.3"/></svg>),
  gantt:(<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><line x1="1.5" y1="3" x2="9.5" y2="3" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><line x1="4" y1="7" x2="12.5" y2="7" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><line x1="2" y1="11" x2="8" y2="11" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>),
  dashboard:(<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 11.5V8.5M5 11.5V5M8 11.5V7M11 11.5V3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/><line x1="1" y1="12.5" x2="13" y2="12.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>),
};

/* ── 訂單 Modal (新增/編輯) ── */
function OrderModal({ order, onClose, onSave, canDelete }) {
  const K = window.K;
  const empty = { seq:'', id:'', customer:'', engineer:K.ENG_ORDER[0], dueDate:'', startDate:'', endDate:'', material:'足夠', progress:0, machine:K.MACHINES[0], complete:'否', remark:'' };
  const [form, setForm] = useStateWB(order ? {...order} : empty);
  const [busy, setBusy] = useStateWB(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const save = async () => {
    if (!form.customer || !form.dueDate) { alert('請填寫客戶名稱與期望交期'); return; }
    setBusy(true);
    try { await onSave(form); onClose(); }
    catch(e) { alert(e.message||'儲存失敗'); }
    finally { setBusy(false); }
  };

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.35)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:500}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:'#fff',borderRadius:12,width:640,maxWidth:'95vw',maxHeight:'90vh',overflowY:'auto',boxShadow:'0 16px 40px rgba(0,0,0,.2)'}}>
        <div style={{padding:'20px 24px 0',display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
          <h3 style={{fontSize:15,fontWeight:700}}>{order ? '✏️ 編輯訂單' : '➕ 新增訂單'}</h3>
          <button onClick={onClose} style={{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#8a93a3',padding:'2px 6px',borderRadius:4}}>×</button>
        </div>
        <div style={{padding:'0 24px'}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:14}}>
            <div><label style={{display:'block',fontSize:11.5,fontWeight:600,color:'#5a6270',marginBottom:5}}>EF 單號</label>
              <input value={form.id||''} onChange={e=>set('id',e.target.value)} placeholder="202512100001" style={INP}/></div>
            <div><label style={{display:'block',fontSize:11.5,fontWeight:600,color:'#5a6270',marginBottom:5}}>客戶名稱 *</label>
              <input value={form.customer} onChange={e=>set('customer',e.target.value)} style={INP}/></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:14}}>
            <div><label style={LBL}>執行工程師</label>
              <select value={form.engineer} onChange={e=>set('engineer',e.target.value)} style={INP}>
                {K.ENG_ORDER.map(e=><option key={e} value={e}>{K.ENG_LABEL[e]||e}</option>)}</select></div>
            <div><label style={LBL}>機台</label>
              <select value={form.machine} onChange={e=>set('machine',e.target.value)} style={INP}>
                {K.MACHINES.map(m=><option key={m}>{m}</option>)}</select></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:14}}>
            <div><label style={LBL}>開始執行日</label><input type="date" value={form.startDate||''} onChange={e=>set('startDate',e.target.value)} style={INP}/></div>
            <div><label style={LBL}>預計完成日</label><input type="date" value={form.endDate||''} onChange={e=>set('endDate',e.target.value)} style={INP}/></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:14}}>
            <div><label style={LBL}>期望交期 *</label><input type="date" value={form.dueDate||''} onChange={e=>set('dueDate',e.target.value)} style={INP}/></div>
            <div><label style={LBL}>材料庫存</label>
              <select value={form.material} onChange={e=>set('material',e.target.value)} style={INP}>
                {K.MATERIALS.map(m=><option key={m}>{m}</option>)}</select></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:14}}>
            <div><label style={LBL}>進度 %</label>
              <select value={form.progress} onChange={e=>set('progress',+e.target.value)} style={INP}>
                {K.PROGRESS_VALUES.map(p=><option key={p} value={p}>{p}%</option>)}</select></div>
            <div><label style={LBL}>完成</label>
              <select value={form.complete} onChange={e=>set('complete',e.target.value)} style={INP}>
                <option>否</option><option>是</option></select></div>
          </div>
          <div style={{marginBottom:16}}><label style={LBL}>備註</label>
            <textarea value={form.remark||''} onChange={e=>set('remark',e.target.value)} rows={3} style={{...INP,resize:'vertical'}}/></div>
        </div>
        <div style={{padding:'16px 24px',display:'flex',justifyContent:'flex-end',gap:8,borderTop:'1px solid #e6e8ec',marginTop:4}}>
          <button onClick={onClose} style={BTN}>取消</button>
          <button onClick={save} disabled={busy} style={BTNP}>{busy?'儲存中...':'💾 儲存'}</button>
        </div>
      </div>
    </div>
  );
}

const INP = {width:'100%',padding:'8px 11px',border:'1.5px solid #e6e8ec',borderRadius:6,fontSize:13,fontFamily:'inherit',outline:'none'};
const LBL = {display:'block',fontSize:11.5,fontWeight:600,color:'#5a6270',marginBottom:5};
const BTN = {height:34,padding:'0 16px',border:'1px solid #e6e8ec',background:'#fff',color:'#3b4250',fontSize:13,fontWeight:500,borderRadius:6,cursor:'pointer',fontFamily:'inherit'};
const BTNP = {height:34,padding:'0 16px',border:'none',background:'#0a0e14',color:'#fff',fontSize:13,fontWeight:600,borderRadius:6,cursor:'pointer',fontFamily:'inherit'};

/* ── WorkBoard 主元件 ── */
function WorkBoard({ currentUser, standalone }) {
  const [tab, setTab] = useStateWB('table');
  const [data, setData] = useStateWB([]);
  const [loading, setLoading] = useStateWB(true);
  const [error, setError] = useStateWB('');
  const [modal, setModal] = useStateWB(false);
  const [editOrder, setEditOrder] = useStateWB(null);
  const unsubRef = useRefWB(null);
  const K = window.K;

  const canEdit   = currentUser && (currentUser.permissions||[]).some(p=>['admin','edit_board'].includes(p));
  const canDelete = currentUser && (currentUser.permissions||[]).some(p=>['admin','delete_board'].includes(p));

  useEffectWB(() => {
    if (!window._db) { setError('Firebase 尚未初始化，請確認 firebase-config.js'); setLoading(false); return; }
    unsubRef.current = window.FBOrders.onSnapshot(rows => {
      setData(rows);
      setLoading(false);
    });
    return () => { if(unsubRef.current) unsubRef.current(); };
  }, []);

  // 同步 parent frame tab bar
  useEffectWB(() => {
    if (!standalone) return;
    const topbar = document.getElementById('wb-topbar');
    const tabsEl = document.getElementById('wb-tabs');
    if (!topbar || !tabsEl) return;
    topbar.style.display = 'flex';
    tabsEl.innerHTML = '';
    TABS.forEach(t => {
      const btn = document.createElement('button');
      btn.role = 'tab';
      btn.className = 'shell-tab' + (tab === t.key ? ' sel' : '');
      btn.setAttribute('aria-selected', tab === t.key);
      btn.innerHTML = t.label;
      btn.style.cssText = tab === t.key
        ? 'position:relative;border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:#0a0e14;padding:14px 16px;cursor:pointer'
        : 'position:relative;border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;color:#5a6270;padding:14px 16px;cursor:pointer';
      btn.onclick = () => setTab(t.key);
      tabsEl.appendChild(btn);
    });
  }, [tab, standalone]);

  const nextSeq = () => data.length ? Math.max(...data.map(d=>d.seq||0))+1 : 1;

  const handleSave = async form => {
    if (editOrder) {
      await window.FBOrders.update(editOrder._id, form);
      showMsg('訂單已更新 ✓');
    } else {
      await window.FBOrders.add({ ...form, seq: nextSeq() });
      showMsg('訂單已新增 ✓');
    }
  };

  const handleDelete = async seq => {
    const item = data.find(d => d.seq === seq);
    if (!item) return;
    if (!confirm('確定刪除此筆訂單？')) return;
    await window.FBOrders.del(item._id);
    showMsg('已刪除','inf');
  };

  // TableView 的 setData proxy：攔截刪除操作
  const proxySetData = updater => {
    const next = typeof updater === 'function' ? updater(data) : updater;
    const removed = data.filter(d => !next.find(n => n.seq === d.seq));
    removed.forEach(r => { if(canDelete) window.FBOrders.del(r._id).then(()=>showMsg('已刪除','inf')); });
    const changed = next.filter(n => {
      const orig = data.find(d => d.seq === n.seq);
      return orig && JSON.stringify(orig) !== JSON.stringify(n);
    });
    changed.forEach(n => { window.FBOrders.update(n._id, n).then(()=>showMsg('已更新 ✓')); });
  };

  if (loading) return <div className="fb-loading">⏳ 從 Firebase 載入資料...</div>;
  if (error)   return <div className="fb-err">⚠️ {error}</div>;

  return (
    <div style={{display:'flex',flexDirection:'column',flex:1,minHeight:0}}>
      {/* Tab bar (嵌入模式) */}
      {!standalone && (
        <div className="shell-top">
          <nav className="shell-tabs" role="tablist">
            {TABS.map(t=>(
              <button key={t.key} role="tab" aria-selected={tab===t.key} className="shell-tab" onClick={()=>setTab(t.key)}>
                <span className="shell-tab-icon">{TAB_ICONS[t.key]}</span>{t.label}
              </button>
            ))}
          </nav>
          <div className="shell-spacer"/>
          <div className="shell-aux">WORK BOARD</div>
        </div>
      )}

      <div className="shell-body" style={{flex:1,minHeight:0,position:'relative'}}>
        {/* 新增訂單按鈕 */}
        {canEdit && (
          <div style={{position:'absolute',top:14,right:28,zIndex:10}}>
            <button className="t-btn t-btn-primary" onClick={()=>{setEditOrder(null);setModal(true);}}>+ 新增訂單</button>
          </div>
        )}
        {tab==='table'     && <TableView     data={data} setData={proxySetData}/>}
        {tab==='kanban'    && <KanbanView    data={data} setData={proxySetData}/>}
        {tab==='gantt'     && <GanttView     data={data}/>}
        {tab==='dashboard' && <DashboardView data={data}/>}
      </div>

      {modal && <OrderModal
        order={editOrder}
        onClose={()=>setModal(false)}
        onSave={async form => { await handleSave(form); setModal(false); }}
        canDelete={canDelete}
      />}
    </div>
  );
}

function showMsg(msg, type) {
  type = type || 'ok';
  var c = document.getElementById('wb-toasts');
  if (!c) { c = document.createElement('div'); c.id='wb-toasts'; c.style.cssText='position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px'; document.body.appendChild(c); }
  var el = document.createElement('div');
  el.style.cssText = 'padding:11px 16px;border-radius:8px;font-size:13px;font-weight:500;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:toastIn .2s ease;background:' + (type==='ok'?'#1d6f43':type==='err'?'#c0392b':'#0c7a99');
  el.textContent = (type==='ok'?'✓ ':type==='err'?'✕ ':'ℹ ') + msg;
  c.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3000);
}

// ── 掛載邏輯 ──
// 模式 A: 從 index.html iframe 呼叫 window.mountWorkBoard(user)
// 模式 B: 獨立開啟，等 Firebase Auth 確認身份
window.mountWorkBoard = function(user) {
  const root = document.getElementById('wb-root');
  ReactDOM.createRoot(root).render(<WorkBoard currentUser={user} standalone={false}/>);
};

// 獨立頁面模式
(function() {
  const isStandalone = window.self === window.top;
  if (!isStandalone) return; // 由 index 控制

  // 等 Firebase config 就緒再 auth
  var tries = 0;
  var check = setInterval(function() {
    tries++;
    if (window._fbReady) {
      clearInterval(check);
      window._auth.onAuthStateChanged(function(fbUser) {
        if (!fbUser) { window.location.href = 'index.html'; return; }
        window._db.collection('users').doc(fbUser.uid).get().then(function(doc) {
          var user = doc.exists ? Object.assign({uid:fbUser.uid}, doc.data()) : {uid:fbUser.uid, email:fbUser.email, permissions:['view_board']};
          document.getElementById('wb-topbar').style.display = 'flex';
          ReactDOM.createRoot(document.getElementById('wb-root')).render(<WorkBoard currentUser={user} standalone={true}/>);
        });
      });
    }
    if (tries > 40) { clearInterval(check); document.getElementById('wb-root').innerHTML = '<div class="fb-err">⚠️ 無法載入 Firebase，請確認 firebase-config.js</div>'; }
  }, 250);
})();
</script>

<style>@keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}</style>
</body>
