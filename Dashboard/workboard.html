<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作看板 · 3D列印管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/styles-shell.css">
<style>
/* ── Table ── */
.kt-wrap { background:var(--surface); border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; box-shadow:var(--shadow); }
.kt-table { width:100%; border-collapse:collapse; }
.kt-table th { background:#f8fafc; padding:9px 12px; text-align:left; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--border); white-space:nowrap; cursor:pointer; user-select:none; }
.kt-table th:hover { background:#f1f5f9; }
.kt-table th.sort-asc::after { content:' ↑'; }
.kt-table th.sort-desc::after { content:' ↓'; }
.kt-table td { padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
.kt-table tr:last-child td { border-bottom:none; }
.kt-table tr:hover td { background:#f8fafc; }
.kt-badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:700; }
.kt-progress { display:flex; align-items:center; gap:6px; }
.kt-progress-bar { flex:1; height:6px; background:#e2e8f0; border-radius:3px; overflow:hidden; min-width:60px; }
.kt-progress-fill { height:100%; border-radius:3px; transition:width .3s; }
.kt-actions { display:flex; gap:4px; }

/* ── Kanban ── */
.kanban-board { display:flex; gap:16px; overflow-x:auto; padding-bottom:8px; min-height:400px; }
.kanban-col { flex-shrink:0; width:260px; background:#f8fafc; border-radius:var(--radius); padding:12px; border:1px solid var(--border); }
.kanban-col-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.kanban-col-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
.kanban-count { background:var(--border); color:var(--text-muted); padding:1px 7px; border-radius:10px; font-size:11px; font-weight:700; }
.kanban-cards { display:flex; flex-direction:column; gap:8px; min-height:40px; }
.kanban-card { background:var(--surface); border-radius:var(--radius); padding:12px; box-shadow:var(--shadow); border:1px solid var(--border); cursor:pointer; transition:box-shadow .15s; border-left:3px solid transparent; }
.kanban-card:hover { box-shadow:var(--shadow-md); }
.kanban-card-id { font-size:10px; color:var(--text-muted); font-family:monospace; }
.kanban-card-customer { font-size:13px; font-weight:600; margin:4px 0; }
.kanban-card-meta { display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:11px; }
.kanban-card-progress { height:4px; background:#e2e8f0; border-radius:2px; margin-top:8px; overflow:hidden; }
.kanban-card-progress-fill { height:100%; border-radius:2px; }

/* ── Gantt ── */
.gantt-wrap { overflow-x:auto; }
.gantt-table { border-collapse:collapse; width:100%; }
.gantt-label { min-width:150px; padding:8px 12px; border-bottom:1px solid var(--border); font-size:12px; font-weight:600; background:var(--surface); position:sticky; left:0; z-index:1; }
.gantt-cell { border-bottom:1px solid var(--border); padding:4px 2px; background:var(--surface); }
.gantt-header-cell { min-width:36px; padding:6px 2px; text-align:center; font-size:10px; font-weight:700; color:var(--text-muted); background:#f8fafc; border-bottom:2px solid var(--border); }
.gantt-bar { height:24px; border-radius:4px; display:flex; align-items:center; padding:0 6px; font-size:10px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:8px; }
.gantt-today { background:rgba(59,130,246,.12); }

/* ── Dashboard Charts ── */
.charts-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
.chart-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
.chart-card h4 { font-size:13px; font-weight:700; margin-bottom:12px; }
.bar-chart { display:flex; flex-direction:column; gap:8px; }
.bar-row { display:flex; align-items:center; gap:8px; }
.bar-row-label { font-size:12px; width:80px; flex-shrink:0; }
.bar-bg { flex:1; height:20px; background:#f1f5f9; border-radius:4px; overflow:hidden; }
.bar-fill { height:100%; border-radius:4px; display:flex; align-items:center; padding-left:6px; font-size:11px; font-weight:700; color:#fff; transition:width .3s; }
.donut-wrap { display:flex; gap:16px; align-items:center; }
.donut-svg { flex-shrink:0; }
.donut-legend { display:flex; flex-direction:column; gap:6px; }
.donut-legend-item { display:flex; align-items:center; gap:6px; font-size:12px; }
.donut-legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
</style>
</head>
<body>

<!-- 由 index.html 嵌入，不顯示 sidebar，只渲染內容區 -->
<div id="wb-root" style="height:100vh;display:flex;flex-direction:column;"></div>


<!-- <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script> -->
<!-- <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script> -->
<!-- <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script> -->
<script src="src/firebase/firebase-config.js"></script>
<script src="src/firebase/firebase-service.js"></script>
<script src="src/helpers.js"></script>

<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── Toast ──
function showToast(msg, type='success') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icon = type==='success'?'✓':type==='error'?'✕':'ℹ';
  t.innerHTML = `<span>${icon}</span>${msg}`;
  c.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

// ── 訂單表單 Modal ──
function OrderModal({ order, onClose, onSave, engineers, machines }) {
  const empty = { seq:'', id:'', customer:'', engineer:engineers[0]||'', dueDate:'', startDate:'', endDate:'', material:'足夠', progress:0, machine:machines[0]||'', complete:'否', remark:'' };
  const [form, setForm] = useState(order || empty);
  const [saving, setSaving] = useState(false);

  const set = (k,v) => setForm(f => ({...f,[k]:v}));

  const handleSave = async () => {
    if (!form.customer || !form.dueDate) { showToast('請填寫客戶名稱與交期','error'); return; }
    setSaving(true);
    try {
      await onSave(form);
      onClose();
    } catch(e) {
      showToast(e.message || '儲存失敗','error');
    } finally { setSaving(false); }
  };

  return (
    <div className="modal-overlay open" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header">
          <h3>{order ? '✏️ 編輯訂單' : '➕ 新增訂單'}</h3>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <div className="form-row">
            <div className="form-field"><label>EF 單號</label><input value={form.id} onChange={e=>set('id',e.target.value)} placeholder="202512100001"/></div>
            <div className="form-field"><label>客戶名稱 *</label><input value={form.customer} onChange={e=>set('customer',e.target.value)} placeholder="客戶名稱"/></div>
          </div>
          <div className="form-row">
            <div className="form-field"><label>工程師</label>
              <select value={form.engineer} onChange={e=>set('engineer',e.target.value)}>
                {engineers.map(e=><option key={e} value={e}>{e}</option>)}
              </select>
            </div>
            <div className="form-field"><label>機台</label>
              <select value={form.machine} onChange={e=>set('machine',e.target.value)}>
                {machines.map(m=><option key={m} value={m}>{m}</option>)}
              </select>
            </div>
          </div>
          <div className="form-row">
            <div className="form-field"><label>開始日</label><input type="date" value={form.startDate} onChange={e=>set('startDate',e.target.value)}/></div>
            <div className="form-field"><label>結束日</label><input type="date" value={form.endDate} onChange={e=>set('endDate',e.target.value)}/></div>
          </div>
          <div className="form-row">
            <div className="form-field"><label>期望交期 *</label><input type="date" value={form.dueDate} onChange={e=>set('dueDate',e.target.value)}/></div>
            <div className="form-field"><label>素材狀態</label>
              <select value={form.material} onChange={e=>set('material',e.target.value)}>
                {K.MATERIALS.map(m=><option key={m}>{m}</option>)}
              </select>
            </div>
          </div>
          <div className="form-row">
            <div className="form-field"><label>進度 %</label>
              <select value={form.progress} onChange={e=>set('progress',Number(e.target.value))}>
                {K.PROGRESS_OPTS.map(p=><option key={p} value={p}>{p}%</option>)}
              </select>
            </div>
            <div className="form-field"><label>完成</label>
              <select value={form.complete} onChange={e=>set('complete',e.target.value)}>
                <option>否</option><option>是</option>
              </select>
            </div>
          </div>
          <div className="form-field"><label>備註</label><textarea value={form.remark} onChange={e=>set('remark',e.target.value)} rows={3}/></div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>取消</button>
          <button className="btn btn-primary" onClick={handleSave} disabled={saving}>{saving?'儲存中...':'💾 儲存'}</button>
        </div>
      </div>
    </div>
  );
}

// ── 總表 Tab ──
function TableView({ orders, canEdit, canDelete, onAdd, onEdit, onDelete }) {
  const [search, setSearch] = useState('');
  const [filterEng, setFilterEng] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [sortKey, setSortKey] = useState('seq');
  const [sortDir, setSortDir] = useState('asc');
  const [page, setPage] = useState(1);
  const pageSize = 20;

  const STATUS_COLORS = { '未開始':'#94a3b8','進行中':'#3b82f6','已完成':'#10b981','逾期':'#ef4444','暫停':'#f59e0b' };

  const filtered = orders.filter(o=>{
    if (search && !JSON.stringify(o).toLowerCase().includes(search.toLowerCase())) return false;
    if (filterEng && o.engineer !== filterEng) return false;
    if (filterStatus && K.orderStatus(o) !== filterStatus) return false;
    return true;
  }).sort((a,b)=>{
    let va=a[sortKey], vb=b[sortKey];
    if (typeof va==='string') va=va.toLowerCase(), vb=vb.toLowerCase();
    if (va<vb) return sortDir==='asc'?-1:1;
    if (va>vb) return sortDir==='asc'?1:-1;
    return 0;
  });

  const totalPages = Math.ceil(filtered.length/pageSize);
  const paged = filtered.slice((page-1)*pageSize, page*pageSize);

  const sort = (k) => { if(sortKey===k) setSortDir(d=>d==='asc'?'desc':'asc'); else { setSortKey(k); setSortDir('asc'); } };
  const thClass = (k) => sortKey===k ? (sortDir==='asc'?'sort-asc':'sort-desc') : '';

  const handleExport = () => K.exportCSV(filtered.map(({id:fid,...rest})=>({...rest})), '訂單資料.csv');

  return (
    <div>
      <div className="toolbar">
        <input className="search-input" placeholder="🔍 搜尋..." value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}}/>
        <select className="filter-select" value={filterEng} onChange={e=>{setFilterEng(e.target.value);setPage(1);}}>
          <option value="">所有工程師</option>
          {K.ENG_ORDER.map(e=><option key={e}>{e}</option>)}
        </select>
        <select className="filter-select" value={filterStatus} onChange={e=>{setFilterStatus(e.target.value);setPage(1);}}>
          <option value="">所有狀態</option>
          {['未開始','進行中','已完成','逾期'].map(s=><option key={s}>{s}</option>)}
        </select>
        <div className="toolbar-right">
          <button className="btn btn-ghost btn-sm" onClick={handleExport}>📥 匯出CSV</button>
          {canEdit && <button className="btn btn-primary btn-sm" onClick={onAdd}>➕ 新增訂單</button>}
        </div>
      </div>
      <div className="kt-wrap">
        <table className="kt-table">
          <thead><tr>
            {[['seq','#'],['id','單號'],['customer','客戶'],['engineer','工程師'],['dueDate','交期'],['machine','機台'],['material','素材'],['progress','進度'],['complete','完成'],['','狀態'],['','操作']].map(([k,l])=>(
              <th key={l} className={k?thClass(k):''} onClick={k?()=>sort(k):undefined}>{l}</th>
            ))}
          </tr></thead>
          <tbody>
            {paged.length===0 ? (
              <tr><td colSpan={11} style={{textAlign:'center',padding:'40px',color:'var(--text-muted)'}}>無資料</td></tr>
            ) : paged.map(o=>{
              const status = K.orderStatus(o);
              const daysLeft = K.daysLeft(o.dueDate);
              const pColor = K.progressColor(o.progress);
              return (
                <tr key={o.id}>
                  <td style={{color:'var(--text-muted)',fontSize:'11px'}}>{o.seq}</td>
                  <td style={{fontFamily:'monospace',fontSize:'11px'}}>{o.id}</td>
                  <td style={{fontWeight:600}}>{o.customer}</td>
                  <td><span style={{color:K.ENG_TONE[o.engineer]||'#64748b',fontWeight:700}}>{o.engineer}</span></td>
                  <td>
                    <div style={{fontSize:'12px'}}>{o.dueDate}</div>
                    {daysLeft!==null&&<div style={{fontSize:'10px',color:daysLeft<0?'var(--danger)':daysLeft<=3?'var(--warn)':'var(--text-muted)'}}>{daysLeft<0?`逾期${-daysLeft}天`:daysLeft===0?'今天到期':`剩${daysLeft}天`}</div>}
                  </td>
                  <td><span style={{background:'#f1f5f9',padding:'2px 8px',borderRadius:4,fontSize:'11px',fontWeight:700}}>{o.machine}</span></td>
                  <td><span style={{color:o.material==='需調撥'?'var(--warn)':'var(--success)',fontWeight:600,fontSize:'12px'}}>{o.material}</span></td>
                  <td>
                    <div className="kt-progress">
                      <div className="kt-progress-bar"><div className="kt-progress-fill" style={{width:`${o.progress}%`,background:pColor}}/></div>
                      <span style={{fontSize:'11px',fontWeight:700,color:pColor,width:32}}>{o.progress}%</span>
                    </div>
                  </td>
                  <td><span style={{color:o.complete==='是'?'var(--success)':'var(--text-muted)',fontWeight:700}}>{o.complete}</span></td>
                  <td><span className="kt-badge" style={{background:STATUS_COLORS[status]+'20',color:STATUS_COLORS[status]}}>{status}</span></td>
                  <td>
                    <div className="kt-actions">
                      {canEdit&&<button className="btn btn-outline btn-sm" onClick={()=>onEdit(o)}>✏️</button>}
                      {canDelete&&<button className="btn btn-danger btn-sm" onClick={()=>onDelete(o)}>🗑</button>}
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {totalPages > 1 && (
        <div style={{display:'flex',justifyContent:'center',gap:6,marginTop:16,alignItems:'center'}}>
          <button className="btn btn-ghost btn-sm" disabled={page===1} onClick={()=>setPage(p=>p-1)}>← 上頁</button>
          <span style={{fontSize:'12px',color:'var(--text-muted)'}}>第 {page} / {totalPages} 頁，共 {filtered.length} 筆</span>
          <button className="btn btn-ghost btn-sm" disabled={page>=totalPages} onClick={()=>setPage(p=>p+1)}>下頁 →</button>
        </div>
      )}
    </div>
  );
}

// ── 看板 Tab ──
function KanbanView({ orders, canEdit, onEdit }) {
  const cols = [
    { key:'未開始', label:'未開始', color:'#94a3b8' },
    { key:'進行中', label:'進行中', color:'#3b82f6' },
    { key:'逾期',   label:'逾期',   color:'#ef4444' },
    { key:'已完成', label:'已完成', color:'#10b981' },
  ];
  const grouped = {};
  cols.forEach(c=>{ grouped[c.key]=[]; });
  orders.forEach(o=>{ const s=K.orderStatus(o); if(grouped[s]) grouped[s].push(o); });

  return (
    <div className="kanban-board">
      {cols.map(col=>(
        <div key={col.key} className="kanban-col">
          <div className="kanban-col-header">
            <span className="kanban-col-title" style={{color:col.color}}>{col.label}</span>
            <span className="kanban-count">{grouped[col.key].length}</span>
          </div>
          <div className="kanban-cards">
            {grouped[col.key].length===0&&<div style={{textAlign:'center',padding:'20px',color:'var(--text-muted)',fontSize:'12px'}}>無</div>}
            {grouped[col.key].map(o=>(
              <div key={o.id} className="kanban-card" style={{borderLeftColor:K.ENG_TONE[o.engineer]||'#3b82f6'}} onClick={canEdit?()=>onEdit(o):undefined}>
                <div className="kanban-card-id">{o.id||'(未設單號)'}</div>
                <div className="kanban-card-customer">{o.customer}</div>
                <div className="kanban-card-meta">
                  <span style={{color:K.ENG_TONE[o.engineer]||'#64748b',fontWeight:700,fontSize:'11px'}}>{o.engineer}</span>
                  <span style={{fontSize:'11px',background:'#f1f5f9',padding:'1px 6px',borderRadius:4}}>{o.machine}</span>
                </div>
                <div className="kanban-card-progress"><div className="kanban-card-progress-fill" style={{width:`${o.progress}%`,background:K.progressColor(o.progress)}}/></div>
                <div style={{display:'flex',justifyContent:'space-between',marginTop:4,fontSize:'10px',color:'var(--text-muted)'}}>
                  <span>交期: {o.dueDate}</span>
                  <span style={{fontWeight:700,color:K.progressColor(o.progress)}}>{o.progress}%</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

// ── 時間軸 Tab ──
function GanttView({ orders }) {
  const [range, setRange] = useState('month');
  const today = K.today();
  
  const getRanges = () => {
    const days = range==='month'?30:range==='quarter'?90:180;
    const start = new Date(today); start.setDate(start.getDate()-7);
    const dates = [];
    for(let i=0;i<days;i++){ const d=new Date(start); d.setDate(d.getDate()+i); dates.push(d); }
    return { start, dates };
  };
  const { start, dates } = getRanges();

  const engOrders = {};
  K.ENG_ORDER.forEach(e=>{ engOrders[e]=[]; });
  orders.forEach(o=>{ if(engOrders[o.engineer]) engOrders[o.engineer].push(o); else engOrders['其他']=(engOrders['其他']||[]).concat(o); });

  const colW = range==='month'?30:range==='quarter'?14:8;

  const dateStr = d => `${d.getMonth()+1}/${d.getDate()}`;
  const isToday = d => d.toDateString()===today.toDateString();

  const getBarStyle = (o) => {
    if(!o.startDate||!o.endDate) return null;
    const s=new Date(o.startDate), e=new Date(o.endDate);
    const startIdx = Math.round((s-start)/86400000);
    const endIdx   = Math.round((e-start)/86400000);
    const left = startIdx*colW;
    const width = Math.max((endIdx-startIdx+1)*colW, colW);
    return { left, width, color:K.ENG_TONE[o.engineer]||'#3b82f6' };
  };

  return (
    <div>
      <div className="toolbar">
        <div className="toolbar-right">
          {['month','quarter','halfyear'].map(r=>(
            <button key={r} className={`tab-btn ${range===r?'active':''}`} onClick={()=>setRange(r)}>
              {r==='month'?'月':r==='quarter'?'季':'半年'}
            </button>
          ))}
        </div>
      </div>
      <div className="gantt-wrap">
        <table className="gantt-table">
          <thead><tr>
            <th className="gantt-label" style={{position:'sticky',left:0,zIndex:2,background:'#f8fafc'}}>工程師 / 訂單</th>
            {dates.map((d,i)=>(
              <th key={i} className="gantt-header-cell" style={{minWidth:colW,background:isToday(d)?'#eff6ff':'#f8fafc',color:isToday(d)?'var(--accent)':'var(--text-muted)'}}>
                {colW>=14?dateStr(d):(d.getDate()===1||i===0?dateStr(d):'')}
              </th>
            ))}
          </tr></thead>
          <tbody>
            {K.ENG_ORDER.map(eng=>(
              <React.Fragment key={eng}>
                <tr style={{background:'#f8fafc'}}>
                  <td className="gantt-label" style={{fontWeight:700,color:K.ENG_TONE[eng]||'var(--text)',fontSize:'12px',padding:'6px 12px'}}>
                    {eng}
                  </td>
                  {dates.map((d,i)=>(
                    <td key={i} className="gantt-cell" style={{background:isToday(d)?'rgba(59,130,246,.05)':''}}/>
                  ))}
                </tr>
                {(engOrders[eng]||[]).map(o=>{
                  const bar = getBarStyle(o);
                  return (
                    <tr key={o.id}>
                      <td className="gantt-label" style={{fontSize:'11px',color:'var(--text-muted)',paddingLeft:24}}>{o.customer}{o.id?` (${o.id})`:''}</td>
                      <td colSpan={dates.length} style={{position:'relative',padding:0,height:32,border:'none',borderBottom:'1px solid var(--border)'}}>
                        {bar&&<div className="gantt-bar" style={{position:'absolute',top:4,left:bar.left,width:bar.width,background:bar.color}}>
                          {bar.width>40&&`${o.progress}%`}
                          <div style={{position:'absolute',left:0,top:0,bottom:0,width:`${o.progress}%`,background:'rgba(255,255,255,.25)',borderRadius:4}}/>
                        </div>}
                        {dates.map((d,i)=>(isToday(d)?<div key={i} style={{position:'absolute',top:0,bottom:0,left:i*colW,width:colW,background:'rgba(59,130,246,.08)',pointerEvents:'none'}}/>:null))}
                      </td>
                    </tr>
                  );
                })}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── Dashboard Tab ──
function DashboardView({ orders }) {
  const total = orders.length;
  const done  = orders.filter(o=>o.complete==='是').length;
  const overdue = orders.filter(o=>K.orderStatus(o)==='逾期').length;
  const inProgress = orders.filter(o=>K.orderStatus(o)==='進行中').length;
  const avgProgress = total ? Math.round(orders.reduce((s,o)=>s+(o.progress||0),0)/total) : 0;

  const statusCount = {};
  orders.forEach(o=>{ const s=K.orderStatus(o); statusCount[s]=(statusCount[s]||0)+1; });
  const engCount = {};
  K.ENG_ORDER.forEach(e=>engCount[e]=0);
  orders.forEach(o=>{ if(engCount[o.engineer]!==undefined) engCount[o.engineer]++; });

  // Donut
  const statusColors = {'已完成':'#10b981','進行中':'#3b82f6','逾期':'#ef4444','未開始':'#94a3b8'};
  const donutData = Object.entries(statusCount).map(([k,v])=>({label:k,value:v,color:statusColors[k]||'#94a3b8'}));
  const donutTotal = donutData.reduce((s,d)=>s+d.value,0);
  let offset = 0;
  const CIRC = 2*Math.PI*40;

  return (
    <div>
      <div className="kpi-strip">
        <div className="kpi-card"><div className="kpi-label">總訂單</div><div className="kpi-value">{total}</div><div className="kpi-sub">筆</div></div>
        <div className="kpi-card"><div className="kpi-label">已完成</div><div className="kpi-value" style={{color:'var(--success)'}}>{done}</div><div className="kpi-sub">{total?Math.round(done/total*100):0}%</div></div>
        <div className="kpi-card"><div className="kpi-label">進行中</div><div className="kpi-value" style={{color:'var(--accent)'}}>{inProgress}</div></div>
        <div className="kpi-card"><div className="kpi-label">逾期</div><div className="kpi-value" style={{color:'var(--danger)'}}>{overdue}</div></div>
        <div className="kpi-card"><div className="kpi-label">平均進度</div><div className="kpi-value">{avgProgress}%</div></div>
      </div>
      <div className="charts-grid">
        <div className="chart-card">
          <h4>狀態分布</h4>
          <div className="donut-wrap">
            <svg className="donut-svg" width={100} height={100} viewBox="0 0 100 100">
              <circle cx={50} cy={50} r={40} fill="none" stroke="#f1f5f9" strokeWidth={14}/>
              {donutData.map((d,i)=>{
                const pct = donutTotal ? d.value/donutTotal : 0;
                const dash = pct*CIRC;
                const el = <circle key={i} cx={50} cy={50} r={40} fill="none" stroke={d.color} strokeWidth={14} strokeDasharray={`${dash} ${CIRC-dash}`} strokeDashoffset={-offset} style={{transform:'rotate(-90deg)',transformOrigin:'50% 50%'}}/>;
                offset += dash;
                return el;
              })}
              <text x={50} y={54} textAnchor="middle" fontSize={14} fontWeight={800} fill="var(--text)">{total}</text>
            </svg>
            <div className="donut-legend">
              {donutData.map(d=>(
                <div key={d.label} className="donut-legend-item">
                  <div className="donut-legend-dot" style={{background:d.color}}/>
                  <span>{d.label} ({d.value})</span>
                </div>
              ))}
            </div>
          </div>
        </div>
        <div className="chart-card">
          <h4>工程師訂單量</h4>
          <div className="bar-chart">
            {K.ENG_ORDER.map(eng=>(
              <div key={eng} className="bar-row">
                <span className="bar-row-label" style={{color:K.ENG_TONE[eng],fontWeight:700}}>{eng}</span>
                <div className="bar-bg">
                  <div className="bar-fill" style={{width:`${total?engCount[eng]/Math.max(...Object.values(engCount))*100:0}%`,background:K.ENG_TONE[eng]}}>
                    {engCount[eng]>0&&engCount[eng]}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
        <div className="chart-card">
          <h4>進度分布</h4>
          <div className="bar-chart">
            {K.PROGRESS_OPTS.map(p=>{
              const cnt = orders.filter(o=>o.progress===p).length;
              return (
                <div key={p} className="bar-row">
                  <span className="bar-row-label">{p}%</span>
                  <div className="bar-bg">
                    <div className="bar-fill" style={{width:`${total?cnt/total*100:0}%`,background:K.progressColor(p)}}>{cnt>0&&cnt}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── 主元件 ──
function WorkBoard({ user }) {
  const [tab, setTab] = useState('table');
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modalOpen, setModalOpen] = useState(false);
  const [editOrder, setEditOrder] = useState(null);
  const unsubRef = useRef(null);

  const canEdit   = K.hasPermission(user, 'edit_board');
  const canDelete = K.hasPermission(user, 'delete_board');

  useEffect(()=>{
    FB.initFirebase();
    unsubRef.current = FB.Orders.onSnapshot(data=>{ setOrders(data); setLoading(false); });
    return ()=>{ if(unsubRef.current) unsubRef.current(); };
  },[]);

  const handleAdd = () => { setEditOrder(null); setModalOpen(true); };
  const handleEdit = (o) => { setEditOrder(o); setModalOpen(true); };
  const handleSave = async (form) => {
    if (editOrder) {
      await FB.Orders.update(editOrder.id, form);
      showToast('訂單已更新 ✓');
    } else {
      const seq = K.nextSeq(orders);
      await FB.Orders.create({...form, seq});
      showToast('訂單已新增 ✓');
    }
  };
  const handleDelete = async (o) => {
    if (!confirm(`確定要刪除「${o.customer}」的訂單？`)) return;
    await FB.Orders.delete(o.id);
    showToast('訂單已刪除','info');
  };

  const tabs = [['table','📋 總表'],['kanban','🗂 看板'],['gantt','📅 時間軸'],['dashboard','📊 Dashboard']];

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div className="topbar">
        <span className="topbar-title">🖨️ 工作看板</span>
        <div className="topbar-tabs">
          {tabs.map(([k,l])=><button key={k} className={`tab-btn ${tab===k?'active':''}`} onClick={()=>setTab(k)}>{l}</button>)}
        </div>
      </div>
      <div className="content-area">
        {loading ? (
          <div className="loading"><div className="spinner"/></div>
        ) : (
          <>
            {tab==='table'    && <TableView orders={orders} canEdit={canEdit} canDelete={canDelete} onAdd={handleAdd} onEdit={handleEdit} onDelete={handleDelete}/>}
            {tab==='kanban'   && <KanbanView orders={orders} canEdit={canEdit} onEdit={handleEdit}/>}
            {tab==='gantt'    && <GanttView orders={orders}/>}
            {tab==='dashboard'&& <DashboardView orders={orders}/>}
          </>
        )}
      </div>
      {modalOpen && (
        <OrderModal
          order={editOrder}
          engineers={K.ENG_ORDER}
          machines={K.MACHINES}
          onClose={()=>setModalOpen(false)}
          onSave={handleSave}
        />
      )}
      <div id="toast-container" className="toast-container"/>
    </div>
  );
}

// 決定是獨立頁面還是嵌入模式
const isEmbedded = window.self !== window.top || window.WB_USER;

if (isEmbedded) {
  // 嵌入模式：等待父頁面傳入 user
  window.mountWorkBoard = (user) => {
    const root = ReactDOM.createRoot(document.getElementById('wb-root'));
    root.render(<WorkBoard user={user}/>);
  };
} else {
  // 獨立模式：需要登入
  FB.initFirebase();
  FB.Auth.onAuthStateChanged(async (firebaseUser) => {
    if (firebaseUser) {
      const userData = await FB.Users.get(firebaseUser.uid);
      const user = userData || { permissions: ['view_board'], displayName: firebaseUser.email };
      if (!K.hasPermission(user, 'view_board')) {
        document.getElementById('wb-root').innerHTML = '<div class="permission-denied"><div class="icon">🔒</div><p>您沒有查看工作看板的權限</p></div>';
        return;
      }
      const root = ReactDOM.createRoot(document.getElementById('wb-root'));
      root.render(<WorkBoard user={user}/>);
    } else {
      window.location.href = 'index.html';
    }
  });
}
</script>
</body>
</html>
